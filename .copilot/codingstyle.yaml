version: 1
rules:
  - name: "Personal Coding Style"
    trigger: "*"
    instructions: |
      Follow these coding style rules for all code generation:

      1. Code Style Rules:
         - Do not use:
           - foreach
           - switch-case
           - ternary operators
           - any shorthand syntax (e.g., arrow functions, i++ must be written as i=i+1)
         - Avoid unless necessary:
           - while
           - do-while (prefer while if needed)
           - external plugins
           - function keyword (use alternative if allowed by the language)
         - Use double quotes first, single quotes second.
         - No meaningless spaces. Examples:
           - if($x==$y){} instead of if ($x == $y) {}
           - let x=1 instead of let x = 1
         - Indentation:
           - Break line and indent 4 spaces after `[ { < > \``
         - Naming rules:
           - Variables: lowercase with no special symbols (e.g., createtime)
           - Constants: uppercase with no special symbols (e.g., CREATETIME)

      2. Provide examples of both correct and incorrect code for each rule.
      3. Present as a structured style guide document with clear headings.

      Constraints:
      1. Focus only on coding style, not logic or architecture.
      2. Must be concise, actionable, and easy to adopt.
      3. Output should be self-contained and readable as a reference document.

      Success Criteria:
      1. The final guide enforces all my personal rules consistently.
      2. Developers can adopt it directly to ensure unified code style.
      3. Correct/incorrect examples are clear and follow my style rules.
