version: 1

# 本檔是「規則描述」，不是 prompt：Copilot 產碼時直接套用下列規則，
# 不要輸出風格指南文件。唯一真實來源是根目錄 AGENTS.md 的「使用者指定 Coding Style」，
# 兩邊不一致時以 AGENTS.md 為準，並回頭同步本檔。

rules:
  - name: "Personal Coding Style"
    trigger: "*"
    description: "Apply these rules to all generated code. Follow them silently; output code, not a style guide."

    language:
      forbidden:
        - "foreach（Python 的 for item in row 例外，見下方 python 段）"
        - "switch-case"
        - "=== 與 !==，一律使用 == 與 !="
        - "簡化表示法：arrow function、i++（迴圈寫 i=i+1）"
        - "把函式指派給變數：const fn=function(){} / let fn=function(){}；一律寫成函式宣告 function fn(){}（覆寫既有函式的 decorator 寫法 fn=function(){} 例外）"
      avoid:
        - "三元運算式；只有在 HTML template literal 中能明顯讓畫面組裝更短更清楚時才用"
        - "early return；優先寫成正向條件把主要流程整段包住，只有明顯更清楚或必要的防呆才例外"
        - "while、do-while"
        - "外掛插件"
        - "額外 function：一段邏輯不會重複用到就直接寫在當下流程裡"
      required:
        - "function 關鍵字：JS 一律用函式宣告 function fn(){}（不要改用 arrow function）"
        - "優先使用雙引號，再使用單引號"
        - "語言不需要分號時省略分號"
        - "不要保留未使用的常數或變數"
        - "匿名 function 不要在 function 和 () 中間加空格，寫 function()、function(event)"

    naming:
      - "let／var 變數全小寫，不用底線或其他符號，例如 playername、tablelist"
      - "不會重新指定的值用 const；const 常數任何語言都全大寫、不使用底線，例如 SESSIONID、CREATETIME"
      - "布林值用 ed 結尾，例如 owend、preved、nexted"
      - "不使用縮寫，寫完整單字並維持全小寫，例如 buttonparsestructure，不要寫 btnParseStruct；btn 一律改寫成 button"
      - "清單／陣列型資料不要用英文複數加 s，改用 list 結尾，例如 handlist、playerlist，不要寫 hands、players"
      - "資料夾命名同樣避免英文複數加 s；現有 gtoresults、shortdeckresults 屬歷史命名，不要只改單邊"
      - "後端／API／WebSocket／localStorage 既有欄位名稱不可單邊改名，例如既有協定是 currentIndex 就沿用"

    spacing:
      - "不做無意義空格，例如 if($hi==$hi){}、let x=1"
      - "指派與宣告不要在 = 前後加空格，例如 let x=1、const SESSIONID=..."
      - "保持縮排，遇到 [ { < > ` 這類區塊要換行並縮排 4 格"

    comment:
      - "不為了風格規則修改註解；註解中的 ===、= 或分隔線不需要改"

    javascript:
      - "object / JSON key 新增時要加雙引號，例如 { \"success\": true }，不要寫 { success: true }"

    python:
      - "指派與參數預設值不要在 = 前後加空格，例如 x=1、def run(value=0):"
      - "迴圈可以寫 for item in row，不要為了避開 foreach 寫成較難讀的索引迴圈"

    html:
      - "按鈕以 <input type=\"button|submit|reset\"> 為主，只有需要子元素的互動區塊才使用 role=\"button\""
      - "屬性順序原則：先放元素必要屬性，再放帶值屬性，再放不帶值屬性"
      - "常用排序：src、for、type、href 放前面；class 放在前段；data-* 在 class 後；id、name 再後面；required、readonly、disabled 這類不帶值屬性放最後"
      - "min、max、value、placeholder、title、alt 視為非必填帶值屬性，不要放在 class、data-*、id 前面"
      - "屬性順序優先套用在 input、select、textarea"
      - "正例：<input type=\"number\" class=\"...\" id=\"reentrycount\" min=\"0\" value=\"0\">"
      - "反例：<input type=\"number\" value=\"0\" min=\"0\" class=\"...\" id=\"reentrycount\">"

    css:
      - "使用標準排版方式，selector { 中間保留一個空格，{ 後換行，} 獨立一行"
      - "屬性每行一個，格式固定為 key: value;，冒號後保留一個空格"
      - "盡量不使用 inline style，優先把樣式寫在 CSS 檔案中"
      - "保持 CSS/JS 分離，新頁面不要把大量 CSS/JS 塞回 HTML"

    scope:
      - "既有檔案有不少歷史寫法不符合規範；修改時以「新改的區塊」優先遵守，不要為了格式做大範圍無關重構"
