<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新增牌桌 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">New Table</p>
				<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl">新增牌桌</h1>
				<p class="mt-3 text-sm leading-7 text-zinc-400">填入單一編號，或以起始與結束編號一次建立多個牌桌。</p>
			</div>

			<form method="POST" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="form">
				<div class="mb-4">
					<label for="no" class="mb-2 block text-sm font-bold text-zinc-100">牌桌編號</label>
					<input type="number" min="1" inputmode="numeric" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="no" placeholder="1">
				</div>
				<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
					<div>
						<label for="rangestart" class="mb-2 block text-sm font-bold text-zinc-100">起始牌桌編號</label>
						<input type="number" min="1" inputmode="numeric" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="rangestart" placeholder="1">
					</div>
					<div>
						<label for="rangeend" class="mb-2 block text-sm font-bold text-zinc-100">結束牌桌編號</label>
						<input type="number" min="1" inputmode="numeric" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="rangeend" placeholder="9">
					</div>
				</div>
				<p class="mt-3 text-xs leading-6 text-zinc-500">填入起始與結束編號可一次建立多個牌桌，例如 1 到 9 會建立 9 個牌桌。只填其中一個範圍欄位時，只會建立該編號。</p>
				<div class="mt-3 min-h-6 text-sm font-bold leading-7 text-rose-300" id="error"></div>
				<div class="mt-3 flex flex-col gap-2 sm:flex-row sm:justify-end">
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back" value="返回">
					<input type="submit" class="inline-flex min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="submit" value="送出">
				</div>
			</form>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="newtable.js"></script>
	</body>
</html>
