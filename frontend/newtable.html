<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新增場次 - Add Session</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-5xl mx-auto py-10 px-4 lg:min-h-[75vh]">
			<h2 class="text-2xl font-bold mb-4">新增場次</h2>
			<form method="POST" class="bg-zinc-800 rounded-lg p-6 shadow space-y-6" id="form">
				<div>
					<label for="location" class="block mb-2 text-zinc-300">名稱</label>
					<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="name">
				</div>
				<div class="flex justify-end gap-3">
					<input type="button" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded text-lg font-bold cursor-pointer" id="back" value="返回">
					<button type="submit" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded text-lg font-bold" id="submit">送出</button>
				</div>
			</form>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="newtable.js"></script>
	</body>
</html>
