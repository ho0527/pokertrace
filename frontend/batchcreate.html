<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>批量建立多日賽 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="serieslist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 pb-12 min-h-[70vh]">
			<div class="mb-6">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Batch</p>
				<h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl" id="pagetitle">批量建立多日賽</h1>
				<p class="mt-2 text-sm text-zinc-400" id="pagehint">填一次設定，一鍵建好整棵晉級樹的所有場次，並自動包成系列賽。</p>
				<div class="mt-4 flex flex-wrap gap-2">
					<input type="button" id="b-savejson" class="cursor-pointer rounded-xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 px-4 py-1.5 text-xs font-bold text-white transition" data-entersubmit value="儲存設定 JSON">
					<input type="button" id="b-loadjson" class="cursor-pointer rounded-xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 px-4 py-1.5 text-xs font-bold text-white transition" value="載入設定 JSON">
					<input type="file" id="b-configfile" accept=".json,application/json" class="hidden">
				</div>
			</div>

			<!-- 步驟導覽 -->
			<div class="mb-5 grid grid-cols-2 gap-2 md:grid-cols-5" id="b-stepnav">
				<div role="button" tabindex="0" class="flex min-h-[64px] items-center gap-2 rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-left transition cursor-pointer" data-stepitem="1">
					<span class="inline-flex h-8 min-w-8 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950 text-sm font-extrabold text-zinc-300">1</span>
					<span class="text-sm font-bold text-zinc-300" data-steplabel="basic">基本設定</span>
				</div>
				<div role="button" tabindex="0" class="flex min-h-[64px] items-center gap-2 rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-left transition cursor-pointer" data-stepitem="2">
					<span class="inline-flex h-8 min-w-8 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950 text-sm font-extrabold text-zinc-300">2</span>
					<span class="text-sm font-bold text-zinc-300" data-steplabel="structure">買入結構</span>
				</div>
				<div role="button" tabindex="0" class="flex min-h-[64px] items-center gap-2 rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-left transition cursor-pointer" data-stepitem="3">
					<span class="inline-flex h-8 min-w-8 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950 text-sm font-extrabold text-zinc-300">3</span>
					<span class="text-sm font-bold text-zinc-300" data-steplabel="blind">盲注結構</span>
				</div>
				<div role="button" tabindex="0" class="flex min-h-[64px] items-center gap-2 rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-left transition cursor-pointer" data-stepitem="4">
					<span class="inline-flex h-8 min-w-8 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950 text-sm font-extrabold text-zinc-300">4</span>
					<span class="text-sm font-bold text-zinc-300" data-steplabel="bracket">賽制 / 晉級樹</span>
				</div>
				<div role="button" tabindex="0" class="flex min-h-[64px] items-center gap-2 rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-left transition cursor-pointer" data-stepitem="5">
					<span class="inline-flex h-8 min-w-8 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950 text-sm font-extrabold text-zinc-300">5</span>
					<span class="text-sm font-bold text-zinc-300" data-steplabel="preview">預覽</span>
				</div>
			</div>

			<!-- A. 基本 -->
			<section class="mb-5 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 md:p-6" data-steppanel="1">
				<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400 mb-4" data-sec="basic">基本設定</div>
				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="seriesname">系列賽名稱</span>
						<input type="text" id="b-seriesname" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" maxlength="100">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="club">協會</span>
						<select id="b-club" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></select>
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="startdate">開始日期</span>
						<input type="date" id="b-startdate" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="scoringtype">系列賽排名依據</span>
						<select id="b-scoringtype" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
							<option value="profit" data-opt="scoring_profit">盈虧</option>
							<option value="place" data-opt="scoring_place">名次</option>
							<option value="points" data-opt="scoring_points">積分</option>
						</select>
					</label>
				</div>
				<div class="grid grid-cols-2 gap-3 mt-3 md:grid-cols-4">
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="gametype">計分牌遊戲類型</span>
						<select id="b-gametype" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></select>
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="limittype">限注類型</span>
						<select id="b-limittype" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></select>
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="stacktype">計分牌類型</span>
						<select id="b-stacktype" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></select>
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="eventtype">賽事細項</span>
						<select id="b-eventtype" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></select>
					</label>
				</div>
			</section>

			<!-- A2. 報名 / 買入結構 + 備註 -->
			<section class="mb-5 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 md:p-6" data-steppanel="2">
				<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400 mb-4" data-sec="structure">報名 / 買入結構</div>
				<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="buyin">買入</span>
						<input type="number" id="b-buyin" inputmode="numeric" value="2000" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="buyinfee">手續費</span>
						<input type="number" id="b-fee" inputmode="numeric" value="200" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="chip">起始碼</span>
						<input type="number" id="b-chip" inputmode="numeric" value="3000" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="maxseat">每桌人數</span>
						<input type="number" id="b-maxseat" inputmode="numeric" value="9" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
				</div>
				<div class="grid grid-cols-5 gap-2 items-center text-sm">
					<div></div>
					<div class="text-xs text-zinc-500 text-center" data-label="structcount">次數</div>
					<div class="text-xs text-zinc-500 text-center" data-label="structbuyin">買入</div>
					<div class="text-xs text-zinc-500 text-center" data-label="structfee">手續費</div>
					<div class="text-xs text-zinc-500 text-center" data-label="structchip">計分牌</div>

					<div class="text-sm text-zinc-300" data-label="rebuy">重買</div>
					<input type="number" id="b-rebuycount" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-rebuybuyin" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-rebuyfee" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-rebuychip" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">

					<div class="text-sm text-zinc-300" data-label="reentry">重入</div>
					<input type="number" id="b-reentrycount" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-reentrybuyin" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-reentryfee" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-reentrychip" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">

					<div class="text-sm text-zinc-300" data-label="addon">加買</div>
					<input type="number" id="b-addoncount" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-addonbuyin" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-addonfee" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
					<input type="number" id="b-addonchip" inputmode="numeric" value="0" class="min-h-10 rounded-xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
				</div>
				<label class="flex flex-col gap-1 mt-4">
					<span class="text-sm text-zinc-400" data-label="note">備註（套用到每一場）</span>
					<textarea id="b-description" rows="2" class="rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-2 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15"></textarea>
				</label>

				<div class="mt-5 rounded-2xl border border-zinc-800 bg-zinc-950/60 p-4">
					<div class="flex items-center justify-between gap-3 mb-1">
						<span class="text-sm font-bold text-zinc-200" data-label="chiplist">計分牌清單（寫入每一場的場次設定）</span>
						<input type="button" id="b-chipsfromprofile" class="cursor-pointer rounded-xl border border-emerald-600 bg-transparent px-3 py-1.5 text-xs font-bold text-emerald-300 transition hover:bg-emerald-950/40" value="從個人資料載入">
					</div>
					<div class="text-xs text-zinc-500 mb-3" data-label="chiplisthint">會寫進每個新建場次的計分牌清單（場次設定裡看得到），與上面的起始碼／Color up 分開設定。</div>
					<div id="b-chiprows" class="flex flex-col gap-2"></div>
					<input type="button" id="b-chipadd" class="mt-3 cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-4 py-1.5 text-xs font-bold text-white transition" data-entersubmit value="+ 新增面額">
				</div>
			</section>

			<!-- B. 盲注結構 -->
			<section class="mb-5 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 md:p-6" data-steppanel="3">
				<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400 mb-1" data-sec="blind">盲注結構</div>
				<div class="text-sm text-zinc-400 mb-3" id="blindhint">貼上完整盲注階梯（每行：級數 時長 SB BB Ante），按解析。休息會由下方規則自動插入。可切換匯入目標，分別匯入一般與 Turbo 結構。</div>
				<textarea id="b-structtext" rows="6" class="w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-2 text-[14px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15 font-mono"></textarea>
				<input type="file" id="b-structfile" accept=".json,application/json" class="hidden">
				<div class="mt-3 flex flex-wrap items-center gap-3">
					<select id="b-structtarget" class="min-h-10 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-sm text-white outline-none focus:border-emerald-400">
						<option value="normal" data-bopt="structnormal">一般結構</option>
						<option value="turbo" data-bopt="structturbo">Turbo 結構</option>
					</select>
					<input type="button" id="b-parse" class="cursor-pointer rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-6 py-2 text-sm font-bold text-white transition" data-entersubmit value="讀取 / 解析">
					<input type="button" id="b-upload" class="cursor-pointer rounded-2xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 px-6 py-2 text-sm font-bold text-white transition" value="上傳 JSON 檔">
					<span id="b-structpreview" class="text-sm text-zinc-400"></span>
				</div>
				<div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="breakevery">每幾級休息</span>
						<input type="number" id="b-breakevery" inputmode="numeric" value="4" class="min-h-11 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="breakdur">休息分鐘</span>
						<input type="number" id="b-breakdur" inputmode="numeric" value="10" class="min-h-11 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="regclose">截止買入級別</span>
						<input type="number" id="b-regclose" inputmode="numeric" value="16" class="min-h-11 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
					</label>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="colorups">Color up (級=面額)</span>
						<input type="text" id="b-colorups" value="8=10,12=50" class="min-h-11 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
						<input type="button" id="b-colorupsfromprofile" class="mt-1 self-start cursor-pointer rounded-xl border border-emerald-600 bg-transparent px-3 py-1.5 text-xs font-bold text-emerald-300 transition hover:bg-emerald-950/40" value="從個人資料載入面額">
					</label>
				</div>
			</section>

			<!-- C. 賽制 / 晉級樹 -->
			<section class="mb-5 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 md:p-6" data-steppanel="4">
				<div class="flex items-center justify-between gap-3 mb-3">
					<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" data-sec="bracket">賽制 / 晉級樹</div>
					<div class="flex flex-wrap gap-2">
						<input type="button" class="cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 text-xs font-bold text-white transition tpl-btn" data-tpl="3-1" value="3→1">
						<input type="button" class="cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 text-xs font-bold text-white transition tpl-btn" data-tpl="5-1" value="5→1">
						<input type="button" class="cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 text-xs font-bold text-white transition tpl-btn" data-tpl="6-1" value="6→1">
						<input type="button" class="cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 text-xs font-bold text-white transition tpl-btn" data-tpl="8-2-1" value="8→2→1">
					</div>
				</div>
				<div id="b-rounds" class="flex flex-col gap-3"></div>
				<div class="mt-3 flex gap-2">
					<input type="button" id="b-addround" class="cursor-pointer rounded-2xl bg-zinc-800 hover:bg-zinc-700 px-5 py-2 text-sm font-bold text-white transition" data-entersubmit value="+ 新增一層">
					<input type="button" id="b-removeround" class="cursor-pointer rounded-2xl bg-zinc-800 hover:bg-zinc-700 px-5 py-2 text-sm font-bold text-red-300 transition" value="− 刪除最後一層">
				</div>
			</section>

			<!-- D. 預覽 + 建立 -->
			<section class="mb-5 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 md:p-6" data-steppanel="5">
				<div class="flex items-center justify-between gap-3 mb-3">
					<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" data-sec="preview">預覽</div>
					<input type="button" id="b-refresh" class="cursor-pointer rounded-xl bg-zinc-800 hover:bg-zinc-700 px-4 py-1.5 text-xs font-bold text-white transition" value="重新整理預覽">
				</div>
				<div id="b-preview" class="text-sm text-zinc-300"></div>
				<div class="mt-5 flex justify-end">
					<input type="button" id="b-create" class="cursor-pointer rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 px-8 py-3 text-sm font-bold text-white transition" data-entersubmit value="建立全部">
				</div>
			</section>

			<div class="mb-8 grid grid-cols-2 gap-2" id="b-stepbtns">
				<input type="button" id="b-prevstep" class="cursor-pointer rounded-2xl bg-zinc-800 hover:bg-zinc-700 px-5 py-3 text-sm font-bold text-zinc-100 transition" value="上一步">
				<input type="button" id="b-nextstep" class="cursor-pointer rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-5 py-3 text-sm font-bold text-white transition" data-entersubmit value="下一步">
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="batchcreate.js"></script>
	</body>
</html>
