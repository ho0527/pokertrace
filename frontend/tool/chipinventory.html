<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="全場計分牌需求：各面額全場備量。免費線上撲克工具，不用登入、無廣告。Chip Inventory: Venue-wide chip inventory. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/chipinventory.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="全場計分牌需求 / Chip Inventory - PokerTrace">
		<meta property="og:description" content="全場計分牌需求：各面額全場備量。免費線上撲克工具，不用登入、無廣告。Chip Inventory: Venue-wide chip inventory. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/chipinventory.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>全場計分牌需求 (Chip Inventory) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="cititle">全場計分牌需求</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="block sm:w-1/2">
					<label class="mb-2 block text-sm font-bold text-zinc-100" id="cientrieslabel" for="cientries">報名人數</label>
					<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="cientries" min="0" inputmode="numeric" value="100">
				</div>
				<div class="mt-4 flex flex-wrap gap-2">
					<input type="button" class="min-h-10 rounded-2xl border border-emerald-600/60 bg-emerald-600/10 px-4 text-sm font-bold text-emerald-300 transition hover:bg-emerald-600/20" id="ciprofilechips" value="從個人資料載入面額">
				</div>

				<div class="mb-2 mt-6 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.12em] text-zinc-500">
					<span class="flex-1" id="cihdenom">面額</span>
					<span class="flex-1" id="cihper">每人顆數</span>
					<span class="flex-1 text-right" id="cihtotal">全場需求</span>
				</div>
				<div id="cigrid" class="space-y-2"></div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cichipslabel">全場總顆數</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="cichips">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="civaluelabel">全場總面值</div><div class="mt-1 text-3xl font-extrabold" id="civalue">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="cinote">全場需求 = 每人顆數 × 報名人數。用於估算需準備多少各面額計分牌（建議再多備一成因應 rebuy/換色）。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.chipinventorytitle">整場比賽需要準備多少計分牌？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.chipinventorybody">依報名上限、起始計分牌配置、重購與換色規劃，工具會算出每種面額全場需要準備的總顆數，並預留 color up 所需的備量，讓主辦採購與備碼一次到位。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/chipinventory.js"></script>
	</body>
</html>
