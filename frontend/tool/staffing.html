<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="現場人力配置：桌數 / dealer / floor / 助理。免費線上撲克工具，不用登入、無廣告。Staffing: Dealer, floor, and assistant needs. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/staffing.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="現場人力配置 / Staffing - PokerTrace">
		<meta property="og:description" content="現場人力配置：桌數 / dealer / floor / 助理。免費線上撲克工具，不用登入、無廣告。Staffing: Dealer, floor, and assistant needs. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/staffing.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>現場人力配置 (Staffing) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="sftitle">現場人力配置</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="sfplayerslabel" for="sfplayers">選手數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="sfplayers" min="0" inputmode="numeric" value="90"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="sfseatslabel" for="sfseats">每桌座位</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="sfseats" min="2" max="10" inputmode="numeric" value="9"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="sfrelieflabel" for="sfrelief">輪替比例 (%)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="sfrelief" min="0" max="100" step="0.1" inputmode="decimal" value="20"></div>
				</div>

				<div class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="sftableslabel">桌數</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="sftables">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="sfdealerslabel">發牌員</div><div class="mt-1 text-2xl font-extrabold" id="sfdealers">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="sffloorlabel">Floor</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="sffloor">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="sfassistlabel">助理</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="sfassist">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="sfnote">發牌員 = 桌數 ×（1 + 輪替比例）；Floor ≈ 每 8 桌 1 位（至少 1）；助理 ≈ 每 6 桌 1 位（至少 1）。為概略建議，依場館流程調整。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">比賽現場要配多少人力？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">依桌數與賽制估算需要的發牌員（含輪替）、floor 與行政助理人數。輸入桌數、是否輪替與服務範圍，工具給出建議配置，讓你不會開賽當天才發現人手不夠。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/staffing.js"></script>
	</body>
</html>
