		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">

	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="catitle">計分牌總量稽核</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4 lg:grid-cols-7">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="caentrieslabel" for="caentries">報名人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="caentries" min="0" inputmode="numeric" value="80"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="castartlabel" for="castart">起始計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="castart" min="0" inputmode="numeric" value="20000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="carebuycountlabel" for="carebuycount">Rebuy 數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="carebuycount" min="0" inputmode="numeric" value="30"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="carebuychiplabel" for="carebuychip">Rebuy 計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="carebuychip" min="0" inputmode="numeric" value="20000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="caaddoncountlabel" for="caaddoncount">Addon 數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="caaddoncount" min="0" inputmode="numeric" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="caaddonchiplabel" for="caaddonchip">Addon 計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="caaddonchip" min="0" inputmode="numeric" value="20000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="caactuallabel" for="caactual">實際清點</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="caactual" min="0" inputmode="numeric" value="3200000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="caexpectedlabel">應有總計分牌</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="caexpected">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cacountedlabel">實際清點</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="cacounted">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cadifflabel">差異</div><div class="mt-1 text-2xl font-extrabold" id="cadiff">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="canote">應有總計分牌 = 報名×起始 + rebuy 數×rebuy 計分牌 + addon 數×addon 計分牌。差異 = 實際 − 應有，非 0 表示有多發/短發或清點誤差。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">計分牌總量稽核</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">全場計分牌應該等於起始計分牌乘以參賽人次，加上重購與 add-on 發出的量。這個工具算出理論總量，與各桌清點結果比對，快速發現少計分牌或多計分牌的異常，是比賽中場與收場的必要檢查。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
