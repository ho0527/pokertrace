<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="現金桌時薪估算 / Winrate Estimate - PokerTrace">
		<meta property="og:description" content="現金桌時薪估算：bb/100 換算期望時薪。免費線上撲克工具，不用登入、無廣告。Winrate Estimate: Convert bb/100 to hourly. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/winrate.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">

		<meta name="twitter:card" content="summary">
		<title>現金桌時薪估算 (Winrate Estimate) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="wrtitle">現金桌時薪估算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wrwinratelabel" for="wrwinrate">勝率 (bb/100)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wrwinrate" step="0.1" inputmode="decimal" value="5"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wrbblabel" for="wrbb">大盲金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wrbb" min="0" step="any" inputmode="decimal" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wrhandslabel" for="wrhands">每小時手數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wrhands" min="0" inputmode="numeric" value="30"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wrhourslabel" for="wrhours">時數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wrhours" step="0.5" min="0" inputmode="decimal" value="6"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="wrper100label">每 100 手期望</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="wrper100">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="wrhourlylabel">期望時薪</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="wrhourly">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="wrsessionlabel">本場期望</div><div class="mt-1 text-2xl font-extrabold" id="wrsession">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="wrnote">期望時薪 = (bb/100 ÷ 100) × 大盲金額 × 每小時手數。為長期期望值，短期受變異影響極大。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.winratetitle">現金桌時薪怎麼估？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.winratebody">bb/100（每百手贏多少大盲）是現金桌勝率的標準單位。輸入你的 bb/100、盲注級別與每小時手數，工具換算出期望時薪，讓你用數字決定該打哪個級別、要不要多開一桌。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/winrate.js"></script>
	</body>
</html>
