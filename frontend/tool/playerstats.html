<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="選手成績：ROI、ITM 率與淨利。免費線上撲克工具，不用登入、無廣告。Player Stats: ROI, ITM, and net profit. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/playerstats.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="選手成績 / Player Stats - PokerTrace">
		<meta property="og:description" content="選手成績：ROI、ITM 率與淨利。免費線上撲克工具，不用登入、無廣告。Player Stats: ROI, ITM, and net profit. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/playerstats.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>選手成績 (Player Stats) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="pstitle">選手成績</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pssessionslabel" for="pssessions">總場次</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pssessions" min="0" inputmode="numeric" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="psitmlabel" for="psitm">進錢次數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="psitm" min="0" inputmode="numeric" value="12"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="psbuyinlabel" for="psbuyin">總買入</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="psbuyin" min="0" inputmode="numeric" value="60000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pswinlabel" for="pswin">總獎金</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pswin" min="0" inputmode="numeric" value="78000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="psprofitlabel">總淨利</div><div class="mt-1 text-2xl font-extrabold" id="psprofit">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="psroilabel">ROI</div><div class="mt-1 text-2xl font-extrabold" id="psroi">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="psitmratelabel">ITM 率</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="psitmrate">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="psavglabel">平均每場損益</div><div class="mt-1 text-2xl font-extrabold" id="psavg">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="psnote">ROI = 總淨利 ÷ 總買入；ITM 率 = 進錢次數 ÷ 總場次。淨利為正代表長期獲利。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">選手成績統計：ROI 與 ITM</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">輸入參賽場次、買入與獎金紀錄，工具算出 ROI（投資報酬率）、ITM 率（進錢圈比例）與總淨利。長期追蹤這三個數字，比記憶更誠實地告訴你打得好不好。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/playerstats.js"></script>
	</body>
</html>
