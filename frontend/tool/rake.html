<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="抽水計算：現金桌抽水、cap 與實拿。免費線上撲克工具，不用登入、無廣告。Rake Calculator: Cash-game rake, cap, and net amount. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/rake.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="抽水計算 / Rake Calculator - PokerTrace">
		<meta property="og:description" content="抽水計算：現金桌抽水、cap 與實拿。免費線上撲克工具，不用登入、無廣告。Rake Calculator: Cash-game rake, cap, and net amount. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/rake.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>抽水計算 (Rake Calculator) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="rktitle">抽水計算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="rkpotlabel" for="rkpot">底池</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rkpot" min="0" inputmode="numeric" value="1000">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="rkpctlabel" for="rkpct">抽水 %</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rkpct" step="0.5" min="0" inputmode="decimal" value="5">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="rkcaplabel" for="rkcap">上限 Cap（0=無）</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rkcap" min="0" inputmode="numeric" value="100">
					</div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rkrakelabel">實際抽水</div><div class="mt-1 text-3xl font-extrabold text-red-400" id="rkrake">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rkwinlabel">贏家實拿</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="rkwin">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rkefflabel">有效抽水率</div><div class="mt-1 text-3xl font-extrabold" id="rkeff">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="rknote">實際抽水 = min(底池 × 抽水%, 上限)。有上限時大底池的有效抽水率會低於名目 %。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.raketitle">抽水怎麼算？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.rakebody">現金桌常見抽水為底池的 5% 並設上限（cap）。輸入抽水比例、cap 與底池大小，工具算出實際抽走金額與選手實拿，也能估算整晚的抽水總量，對主辦與選手都透明。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/rake.js"></script>
	</body>
</html>
