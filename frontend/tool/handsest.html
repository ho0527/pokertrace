	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="hetitle">每小時手數估算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="heseclabel" for="hesec">每手平均秒數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hesec" min="1" inputmode="numeric" value="130"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="helevellabel" for="helevel">每級分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="helevel" min="1" inputmode="numeric" value="20"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hehourlabel">每小時手數</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="hehour">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="helevelhandslabel">每級手數</div><div class="mt-1 text-3xl font-extrabold" id="helevelhands">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="henote">每小時手數 = 3600 ÷ 每手秒數。實體桌常見約 25–30 手/小時（每手約 120–140 秒），人少或發牌快會更多。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.handsesttitle">每小時能打幾手牌？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.handsestbody">現場一桌一位計分員每小時大約 25 到 35 手，人數、選手速度與洗牌方式都會影響。輸入桌數與條件，工具估算全場每小時手數，是估算比賽節奏與現金桌抽水收入的基礎數字。</p>
			</div>
