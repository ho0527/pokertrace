<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="起始計分牌配置：依面額建議每人計分牌顆數。免費線上撲克工具，不用登入、無廣告。Starting Chip Setup: Recommended chip counts by denomination. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/chipsetup.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="起始計分牌配置 / Starting Chip Setup - PokerTrace">
		<meta property="og:description" content="起始計分牌配置：依面額建議每人計分牌顆數。免費線上撲克工具，不用登入、無廣告。Starting Chip Setup: Recommended chip counts by denomination. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/chipsetup.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>起始計分牌配置 (Starting Chip Setup) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="cstitle">起始計分牌配置</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="csstacklabel" for="csstack">起始計分牌量</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="csstack" min="0" inputmode="numeric" value="20000">
					</div>
					<div class="flex items-end">
						<input type="button" class="min-h-12 w-full rounded-2xl bg-emerald-500 px-5 text-sm font-bold text-zinc-950 transition hover:bg-emerald-400" id="csauto" value="自動配置">
					</div>
				</div>

				<div class="mt-6 flex items-center justify-between">
					<div class="text-lg font-extrabold" id="csdenomtitle">面額與顆數</div>
					<div class="flex flex-wrap justify-end gap-2">
						<input type="button" class="rounded-2xl border border-emerald-600/60 bg-emerald-600/10 px-3 py-1.5 text-sm font-bold text-emerald-300 hover:bg-emerald-600/20" id="csprofilechips" value="從個人資料載入面額">
						<input type="button" class="rounded-2xl bg-zinc-800 px-3 py-1.5 text-sm font-bold text-zinc-100 hover:bg-zinc-700" id="csadd" value="+ 面額">
					</div>
				</div>
				<div class="mb-2 mt-3 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.12em] text-zinc-500">
					<span class="flex-1" id="cshdenom">面額</span>
					<span class="flex-1" id="cshcount">每人顆數</span>
					<span class="flex-1 text-right" id="cshsub">小計</span>
					<span class="w-12"></span>
				</div>
				<div id="csrows" class="space-y-2"></div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cstotallabel">每人總額</div><div class="mt-1 text-2xl font-extrabold" id="cstotal">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cschipslabel">每人總顆數</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="cschips">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="csdifflabel">與目標差額</div><div class="mt-1 text-2xl font-extrabold" id="csdiff">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="csnote">「自動配置」會先保留足夠的小面額計分牌（方便前幾級下注與找零），剩餘額度再用大面額補足。可手動調整顆數，總額需等於起始計分牌量。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">起始計分牌怎麼配？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">起始計分牌的面額配置要讓前期下注方便、後期換色次數少。輸入每人起始總量與可用面額，工具會建議各面額的顆數組合，並算出全場總需求，開賽備碼不用再用猜的。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/chipsetup.js"></script>
	</body>
</html>
