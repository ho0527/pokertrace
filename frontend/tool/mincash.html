	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="mctitle">Min Cash 倍率</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="mcbuyinlabel" for="mcbuyin">買入</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="mcbuyin" min="0" inputmode="numeric" value="1200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="mcpaylabel" for="mcpay">Min Cash 獎金</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="mcpay" min="0" inputmode="numeric" value="2000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="mcmultlabel">Min Cash 倍率</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="mcmult">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="mcbreaklabel">損益兩平 ITM 率</div><div class="mt-1 text-3xl font-extrabold" id="mcbreak">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="mcnetlabel">min cash 淨利</div><div class="mt-1 text-3xl font-extrabold text-zinc-200" id="mcnet">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="mcnote">倍率 = Min Cash 獎金 ÷ 買入。損益兩平 ITM 率 = 買入 ÷ Min Cash 獎金，代表「每次都只拿 min cash」時需要的最低進錢率才不虧。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">Min Cash 是買入的幾倍？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">最小獎金通常是買入的 1.5 到 2 倍。輸入買入與獎金結構，工具算出 min cash 倍率與你需要多高的 ITM 率才能靠混獎圈打平，順便戳破「常常進錢圈就會賺」的迷思。</p>
			</div>
