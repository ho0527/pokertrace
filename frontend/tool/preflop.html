	<head>
		<meta charset="UTF-8">

		<meta property="og:url" content="https://pokertrace.net/frontend/tool/preflop.html">

		<title>Preflop 決策卡 (Preflop Card) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="pftitle">Preflop 決策卡</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="mb-2 text-sm font-bold text-zinc-300" id="pfpostitle">位置（9-max 開牌 RFI）</div>
				<div class="flex flex-wrap gap-2">
					<input type="button" class="min-h-10 rounded-2xl bg-zinc-800 px-4 text-sm font-bold text-zinc-100" data-pfpos="UTG" value="UTG">
					<input type="button" class="min-h-10 rounded-2xl bg-zinc-800 px-4 text-sm font-bold text-zinc-100" data-pfpos="MP" value="MP">
					<input type="button" class="min-h-10 rounded-2xl bg-zinc-800 px-4 text-sm font-bold text-zinc-100" data-pfpos="CO" value="CO">
					<input type="button" class="min-h-10 rounded-2xl bg-zinc-800 px-4 text-sm font-bold text-zinc-100" data-pfpos="BTN" value="BTN">
					<input type="button" class="min-h-10 rounded-2xl bg-zinc-800 px-4 text-sm font-bold text-zinc-100" data-pfpos="SB" value="SB">
				</div>

				<div class="mt-5 flex items-center justify-between">
					<div class="text-lg font-extrabold" id="pfgridtitle">開牌範圍</div>
					<div class="text-sm text-zinc-400"><span id="pfpercentlabel">範圍佔比</span>：<span id="pfpercent" class="font-mono font-extrabold text-emerald-400">-</span></div>
				</div>
				<div id="pfgrid" class="mt-3 grid gap-[2px] preflopgrid"></div>
				<div class="mt-2 text-xs text-zinc-500" id="pfsuitednote">右上三角為同花（s），左下為不同花（o），對角線為口袋對。</div>
			</section>

			<div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
				<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)]">
					<div class="mb-2 text-lg font-extrabold" id="pfsizetitle">加注尺寸建議</div>
					<div class="text-sm leading-7 text-zinc-300" id="pfsizebody">-</div>
				</section>
				<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)]">
					<div class="mb-2 text-lg font-extrabold" id="pfpushtitle">短碼 Push / Fold 參考</div>
					<div class="text-sm leading-7 text-zinc-300" id="pfpushbody">-</div>
				</section>
			</div>
			<div class="mt-4 text-xs text-zinc-500" id="pfdisclaimer">本表為 9-max 常見參考範圍，實戰需依對手、抽水、獎勵結構調整。</div>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.prefloptitle">翻前決策卡：開牌、加注與 push/fold</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.preflopbody">把翻前最常用的三張表放在一起：各位置建議開牌範圍、常用加注尺寸，以及短碼的 push/fold 參考。比賽中盲注升快、思考時間短，這張卡讓你的翻前決策有一致的框架。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/preflop.js"></script>
	</body>
</html>
