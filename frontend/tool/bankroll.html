	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="brtitle">Bankroll 建議</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="brtypelabel" for="brtype">遊戲類型</label>
						<select id="brtype" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400">
							<option data-i18n="bankrollpage.opt_mtt" value="mtt">MTT 錦標賽</option>
							<option data-i18n="bankrollpage.opt_pko" value="pko">PKO 賞金賽</option>
							<option data-i18n="bankrollpage.opt_sng" value="sng">SNG / 單桌</option>
							<option data-i18n="bankrollpage.opt_cash" value="cash">現金桌</option>
						</select>
					</div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="brbuyinlabel" for="brbuyin">平均買入</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="brbuyin" min="0" inputmode="numeric" value="1000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="brconslabel">保守（買入數）</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="brcons">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="brstdlabel">標準</div><div class="mt-1 text-2xl font-extrabold" id="brstd">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bragglabel">積極</div><div class="mt-1 text-2xl font-extrabold text-amber-400" id="bragg">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="brnote">不同賽制變異不同，建議 bankroll 以買入數計：保守 / 標準 / 積極。MTT 變異最大需最多買入。為一般參考，非投資建議。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.bankrolltitle">打比賽需要多少 Bankroll？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.bankrollbody">資金管理是長期贏家的基本功。一般建議：MTT 至少準備 100 個買入、高變異的快速賽更多、單桌 SNG 約 50 個買入，現金桌則以 20 到 40 個買入為常見區間。這個工具依你選的賽制與波動程度，估算建議的資金規模與單場買入上限。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/bankroll.js"></script>
	</body>
</html>
