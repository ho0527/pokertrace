<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="賽事時長估算：估算總時長與級數。免費線上撲克工具，不用登入、無廣告。Duration Estimate: Estimate total time and levels. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/duration.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="賽事時長估算 / Duration Estimate - PokerTrace">
		<meta property="og:description" content="賽事時長估算：估算總時長與級數。免費線上撲克工具，不用登入、無廣告。Duration Estimate: Estimate total time and levels. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/duration.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>賽事時長估算 (Duration Estimate) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="dutitle">賽事時長估算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="mb-4 text-lg font-extrabold" id="duinputtitle">場次與結構</div>
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="duentrieslabel" for="duentries">報名人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="duentries" min="1" inputmode="numeric" value="80"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dustacklabel" for="dustack">起始計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dustack" min="0" inputmode="numeric" value="20000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dufactorlabel" for="dufactor">Rebuy/Addon 倍數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dufactor" step="0.1" min="1" inputmode="decimal" value="1.5"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dustartbblabel" for="dustartbb">起始大盲</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dustartbb" min="1" step="any" inputmode="decimal" value="200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dumultlabel" for="dumult">升盲倍數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dumult" step="0.05" min="1" inputmode="decimal" value="1.5"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dulevelminlabel" for="dulevelmin">每級分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dulevelmin" min="1" inputmode="numeric" value="20"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dubreakeverylabel" for="dubreakevery">每幾級休息</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dubreakevery" min="0" inputmode="numeric" value="4"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dubreakminlabel" for="dubreakmin">休息分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dubreakmin" min="0" inputmode="numeric" value="10"></div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="dutargetlabel" for="dutarget">打到</label>
						<select id="dutarget" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400">
							<option data-i18n="durationpage.champion" value="champion">冠軍</option>
							<option data-i18n="durationpage.ft" value="ft">決賽桌（9 人）</option>
						</select>
					</div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dufinishbblabel" for="dufinishbb">結束平均碼量 (BB)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dufinishbb" min="1" step="any" inputmode="decimal" value="12"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="dutotalchipslabel">總計分牌量</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="dutotalchips">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="dulevelslabel">預估級數</div><div class="mt-1 text-2xl font-extrabold" id="dulevels">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="duendbblabel">結束盲注</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="duendbb">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="dutotallabel">預估總時長</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="dutotal">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="dunote">估算模型：總計分牌 ÷ 結束時人數 ÷ 結束平均碼量 = 結束時大盲，反推需要幾級。為粗估，實際受 late reg、打法、單挑長度影響。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.durationtitle">比賽會打多久？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.durationbody">由起始計分牌、盲注結構與報名人數，可以推估總發碼量會在哪一級被盲注消化完。工具據此估算整場時長與大約結束級別，主辦排場地時間、選手排行程都用得上。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/duration.js"></script>
	</body>
</html>
