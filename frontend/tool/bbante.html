					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="batitle">BB Ante 換算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="babblabel" for="babb">大盲</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="babb" min="1" step="any" inputmode="decimal" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="baplayerslabel" for="baplayers">人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="baplayers" min="1" max="10" inputmode="numeric" value="9"></div>

					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="batradtotallabel">傳統前注每手總額</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="batradtotal">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="babbantelabel">BB ante 每手總額</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="babbante">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="baequivlabel">等效每人前注</div><div class="mt-1 text-2xl font-extrabold" id="baequiv">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="banote">傳統前注每手總額 = 每人前注 × 人數。BB ante 由大盲位投入一個大盲，每手總額 = 大盲。等效每人前注 = 大盲 ÷ 人數，可用來對齊兩種結構的前注量。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.bbantetitle">BB Ante 和傳統前注怎麼換算？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.bbantebody">現代比賽多改用 BB Ante：由大盲位一人代付整桌前注，取代每人各投一顆的傳統 ante，加快發牌速度。換算原則是讓每圈進入底池的前注總量大致相同：BB Ante 通常等於一個大盲，約等於傳統 ante 乘上人數。這個工具幫你在兩種格式之間對齊結構，改結構表時不會失真。</p>
