		<title>底池成長試算 (Pot Builder) - PokerTrace 免費撲克工具</title>

		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="pbtitle">底池成長試算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pbstartlabel" for="pbstart">翻牌前底池</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pbstart" min="0" inputmode="numeric" value="600"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pbfloplabel" for="pbflop">翻牌下注 (% 底池)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pbflop" min="0" step="0.1" inputmode="decimal" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pbturnlabel" for="pbturn">轉牌下注 (% 底池)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pbturn" min="0" step="0.1" inputmode="decimal" value="66"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pbriverlabel" for="pbriver">河牌下注 (% 底池)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pbriver" min="0" step="0.1" inputmode="decimal" value="75"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-4">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="pbpfloplabel">翻牌後底池</div><div class="mt-1 text-xl font-extrabold text-zinc-200" id="pbpflop">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="pbpturnlabel">轉牌後底池</div><div class="mt-1 text-xl font-extrabold text-zinc-200" id="pbpturn">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="pbpriverlabel">河牌後底池</div><div class="mt-1 text-xl font-extrabold text-emerald-400" id="pbpriver">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="pbgrowthlabel">總成長倍數</div><div class="mt-1 text-xl font-extrabold" id="pbgrowth">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="pbnote">假設每街單一下注且對手跟注：下注額 = 當前底池 × 比例，底池增加 2 倍下注額（雙方投入）。可快速估算各街底池與最終底池。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.potbuildertitle">底池會長到多大？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.potbuilderbody">從翻前加注開始，每條街的下注都會讓底池以倍數成長。輸入各街的下注比例，工具模擬到河牌時的底池與剩餘計分牌，幫你預判 SPR 走向，避免「不小心把自己套死」的尺寸失誤。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/potbuilder.js"></script>
	</body>
</html>
