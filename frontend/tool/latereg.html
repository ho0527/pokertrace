<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="Late Reg 截止 / Late Reg Cutoff - PokerTrace">
		<meta property="og:description" content="Late Reg 截止：算出報名截止時刻。免費線上撲克工具，不用登入、無廣告。Late Reg Cutoff: Calculate registration cutoff. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/latereg.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>Late Reg 截止 (Late Reg Cutoff) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="lrtitle">Late Reg 截止</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="lrstartlabel" for="lrstart">開賽時間</label><input type="time" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="lrstart" value="19:00"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="lrlevelminlabel" for="lrlevelmin">每級分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="lrlevelmin" min="1" inputmode="numeric" value="20"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="lrclevellabel" for="lrclevel">截止級數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="lrclevel" min="1" inputmode="numeric" value="9"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="lrbreakeverylabel" for="lrbreakevery">每幾級休息</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="lrbreakevery" min="0" inputmode="numeric" value="4"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="lrbreakminlabel" for="lrbreakmin">休息分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="lrbreakmin" min="0" inputmode="numeric" value="10"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="lrcloselabel">Late Reg 截止時刻</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="lrclose">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="lrelapsedlabel">累計歷時</div><div class="mt-1 text-3xl font-extrabold" id="lrelapsed">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="lrbreakslabel">期間休息次數</div><div class="mt-1 text-3xl font-extrabold text-zinc-200" id="lrbreaks">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="lrnote">截止時刻 = 開賽時間 + 截止級數所有級時長 + 期間休息時間。報名通常在指定級數結束時截止。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">晚到報名什麼時候截止？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">輸入開賽時間、每級長度、休息規則與開放晚到報名的級數，工具算出報名截止的實際時刻，方便主辦公告、選手掐點進場。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/latereg.js"></script>
	</body>
</html>
