<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>主辦財務試算 (Host Cost) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="hctitle">主辦財務試算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="mb-4 text-lg font-extrabold" id="hcinputtitle">場次設定</div>
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcentrieslabel" for="hcentries">報名人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcentries" min="0" inputmode="numeric" value="80"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcbuyinlabel" for="hcbuyin">買入（進獎池）</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcbuyin" min="0" inputmode="numeric" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcfeelabel" for="hcfee">手續費（進主辦）</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcfee" min="0" inputmode="numeric" value="200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcrebuycountlabel" for="hcrebuycount">Rebuy 次數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcrebuycount" min="0" inputmode="numeric" value="30"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcrebuyamtlabel" for="hcrebuyamt">Rebuy 金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcrebuyamt" min="0" inputmode="numeric" value="1000"></div>
						<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcreentrycountlabel" for="hcreentrycount">Re-entry 次數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcreentrycount" min="0" inputmode="numeric" value="20"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcaddoncountlabel" for="hcaddoncount">Addon 次數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcaddoncount" min="0" inputmode="numeric" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcaddonamtlabel" for="hcaddonamt">Addon 金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcaddonamt" min="0" inputmode="numeric" value="500"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hcguaranteelabel" for="hcguarantee">保底獎池</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hcguarantee" min="0" inputmode="numeric" value="150000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="hccostlabel" for="hccost">固定成本（場租＋人事）</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="hccost" min="0" inputmode="numeric" value="20000"></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="hcnote">Rebuy／Re-entry 與買入同樣收手續費（進主辦）；買入／rebuy／addon 金額及 re-entry（視同重新買入）皆進獎池。可依實際規則調整。</div>
			</section>

			<section class="mt-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div id="hcoverlaybanner" class="mb-5 hidden rounded-2xl border px-4 py-3 text-sm font-bold"></div>
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hcpoollabel">累積獎池</div><div class="mt-1 text-2xl font-extrabold" id="hcpool">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hcpayoutlabel">實際發出獎池</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="hcpayout">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hcoverlaylabel">主辦補貼 Overlay</div><div class="mt-1 text-2xl font-extrabold" id="hcoverlay">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hcrevenuelabel">主辦毛收入</div><div class="mt-1 text-2xl font-extrabold" id="hcrevenue">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hccosttotallabel">固定成本</div><div class="mt-1 text-2xl font-extrabold text-zinc-300" id="hccosttotal">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="hcprofitlabel">主辦淨利</div><div class="mt-1 text-2xl font-extrabold" id="hcprofit">-</div></div>
				</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">主辦一場比賽的財務試算</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">把場地、發牌員、設備等成本，與買入、抽成、保底設定放在同一張試算表：工具算出不同報名人數下的獎池、收入與盈虧，讓你在公告保底前就知道自己承擔多少風險。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/hostcost.js"></script>
	</body>
</html>
