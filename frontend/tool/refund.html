<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<meta property="og:title" content="退賽退費試算 / Refund - PokerTrace">
		<meta property="og:description" content="退賽退費試算：依政策算可退金額。免費線上撲克工具，不用登入、無廣告。Refund: Refund amount by policy. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/refund.html">

		<title>退賽退費試算 (Refund) - PokerTrace 免費撲克工具</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="rftitle">退賽退費試算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rfpaidlabel" for="rfpaid">已付金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rfpaid" min="0" inputmode="numeric" value="1200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rffeelabel" for="rffee">其中手續費</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rffee" min="0" inputmode="numeric" value="200"></div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="rfpolicylabel" for="rfpolicy">退費政策</label>
						<select id="rfpolicy" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400">
							<option value="full">全額退</option>
							<option value="fee">扣手續費後退</option>
							<option value="none">不退</option>
							<option value="half">退一半</option>
						</select>
					</div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rfrefundlabel">可退金額</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="rfrefund">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rfkeeplabel">主辦保留</div><div class="mt-1 text-3xl font-extrabold text-zinc-200" id="rfkeep">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="rfnote">依退費政策計算：全額退＝全退；扣手續費＝退（已付 − 手續費）；不退＝0；退一半＝已付 ÷ 2。實際以該場規則為準。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">退賽退費計算</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">開賽前退賽退全額、打了幾手後只退獎池部分、行政費不退——各家政策不同。輸入你的退費規則與選手狀態，工具算出應退金額，現場處理退賽不用翻規則吵架。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/refund.js"></script>
	</body>
</html>
