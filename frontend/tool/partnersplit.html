	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="pntitle">收益夥伴分配</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pntotallabel" for="pntotal">總金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pntotal" inputmode="numeric" value="120000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="pnshareslabel" for="pnshares">分配比例 (% 逗號分隔)</label><input type="text" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="pnshares" value="50, 30, 20"></div>
				</div>
				<div class="mt-2 text-sm text-zinc-400"><span id="pnsumlabel">比例總和</span>：<span id="pnsum" class="font-bold text-white">-</span></div>
				<div id="pnrows" class="mt-4 space-y-2"></div>
				<div class="mt-3 text-xs text-zinc-500" id="pnnote">依輸入比例分配總金額給各夥伴。比例總和應為 100%；不為 100% 時仍按比例正規化分配並提示。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">

				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">多人合資主辦或合夥經營時，輸入總收益與各自的出資或分潤比例，工具算出每個人應得的金額，分帳清楚透明，避免口頭約定造成的糾紛。</p>
			</div>
		</section>
