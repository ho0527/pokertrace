<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="候補等待估算：候補等待與消化時間。免費線上撲克工具，不用登入、無廣告。Waitlist: Waitlist time estimate. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/waitlist.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="候補等待估算 / Waitlist - PokerTrace">
		<meta property="og:description" content="候補等待估算：候補等待與消化時間。免費線上撲克工具，不用登入、無廣告。Waitlist: Waitlist time estimate. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/waitlist.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<base href="../">
		<title>候補等待估算 (Waitlist) - PokerTrace 免費撲克工具</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="wltitle">候補等待估算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wllistlabel" for="wllist">候補總人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wllist" min="0" inputmode="numeric" value="12"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wlposlabel" for="wlpos">你的序位</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wlpos" min="1" inputmode="numeric" value="5"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="wlratelabel" for="wlrate">每小時空出座位</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="wlrate" step="0.5" min="0" inputmode="decimal" value="8"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="wlyoulabel">你預估等待</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="wlyou">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="wlalllabel">全部消化時間</div><div class="mt-1 text-3xl font-extrabold text-zinc-200" id="wlall">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="wlnote">你預估等待 = 你的序位 ÷ 每小時空位率。全部消化 = 候補總人數 ÷ 空位率。空位率受場況波動，僅供概估。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.waitlisttitle">候補要等多久？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.waitlistbody">輸入目前候補人數、桌數與平均離場速度，工具估算大約的等待時間與消化速度，讓候補選手心裡有數，也讓主辦決定要不要加開新桌。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/waitlist.js"></script>
	</body>
</html>
