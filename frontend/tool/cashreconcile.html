		<title>現場收款對帳 (Cash Reconcile) - PokerTrace 免費撲克工具</title>

		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="rctitle">現場收款對帳</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcentrieslabel" for="rcentries">報名數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcentries" min="0" inputmode="numeric" value="80"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcentryfeelabel" for="rcentryfee">報名費</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcentryfee" min="0" inputmode="numeric" value="1200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcrebuycountlabel" for="rcrebuycount">Rebuy 數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcrebuycount" min="0" inputmode="numeric" value="30"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcrebuyamtlabel" for="rcrebuyamt">Rebuy 額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcrebuyamt" min="0" inputmode="numeric" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcaddoncountlabel" for="rcaddoncount">Addon 數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcaddoncount" min="0" inputmode="numeric" value="50"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcaddonamtlabel" for="rcaddonamt">Addon 額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcaddonamt" min="0" inputmode="numeric" value="500"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcrefundlabel" for="rcrefund">退費總額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcrefund" min="0" inputmode="numeric" value="0"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="rcactuallabel" for="rcactual">實收現金</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="rcactual" min="0" inputmode="numeric" value="148000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rcduelabel">應收總額</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="rcdue">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rcgotlabel">實收</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="rcgot">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="rcdifflabel">差額</div><div class="mt-1 text-2xl font-extrabold" id="rcdiff">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="rcnote">應收 = 報名×報名費 + rebuy×額 + addon×額 − 退費。差額 = 實收 − 應收：正為溢收、負為短收，0 表示對平。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">現場收款對帳</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">賽事收尾最怕帳對不上。輸入報名數、重購、add-on 與各種收費，工具算出應收總額，再與實際點收金額比對差額，快速定位漏收或多收，讓主辦收場更輕鬆。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/cashreconcile.js"></script>
	</body>
</html>
