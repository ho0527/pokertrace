		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">

	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="iotitle">隱含賠率</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="iopotlabel" for="iopot">目前底池</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="iopot" min="0" inputmode="numeric" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="iocalllabel" for="iocall">要跟的注</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="iocall" min="0" inputmode="numeric" value="300"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="iofuturelabel" for="iofuture">預估後續可贏</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="iofuture" min="0" inputmode="numeric" value="800"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="ioeqlabel" for="ioeq">你的勝率 (%)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="ioeq" min="0" max="100" step="0.1" inputmode="decimal" value="20"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="iodirectlabel">直接所需勝率</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="iodirect">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="ioimpliedlabel">含隱含所需勝率</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="ioimplied">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="ioverdictlabel">建議</div><div class="mt-1 text-2xl font-extrabold" id="ioverdict">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="ionote">直接所需勝率 = 跟注 ÷（底池 + 跟注）。含隱含 = 跟注 ÷（底池 + 跟注 + 後續可贏）。你的勝率達到含隱含門檻即可跟注。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">隱含賠率怎麼算？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">聽牌時就算當下底池賠率不夠，若中牌後還能從對手身上贏到額外計分牌，跟注仍可能有利可圖——這就是隱含賠率。工具讓你輸入預估的後續可贏金額，算出考慮隱含賠率後實際需要的勝率門檻。</p>
			</div>
		</section>
		<div id="footer"></div>
