				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="esyoulabel" for="esyou">你的計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="esyou" min="0" inputmode="numeric" value="18000"></div>

				<div class="mt-3 text-xs text-zinc-500" id="esnote">有效計分牌 = 雙方計分牌較小者，即這手牌最多能贏或輸的量。多人底池時取你與各對手的較小值分別計算。</div>
			</section>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">

				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.effstackbody">兩人對戰時，實際能贏能輸的最大量由較短的一方決定，這就是有效計分牌。所有尺寸與策略決策都應該以有效計分牌（換算成 BB）為基準，而不是自己的總計分牌。輸入雙方計分牌與盲注，立即得到有效深度。</p>
