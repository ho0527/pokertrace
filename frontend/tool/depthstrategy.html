					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="dstitle">計分牌深度策略</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dsstacklabel" for="dsstack">計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dsstack" min="0" inputmode="numeric" value="32000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="dsbblabel" for="dsbb">目前大盲</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="dsbb" min="1" step="any" inputmode="decimal" value="800"></div>

				<div class="mt-6 rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5">

					<div class="mt-2 text-sm leading-7 text-zinc-300" id="dsadvice">-</div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="dsnote">以大盲數判斷打法區間：>100 深籌、40–100 標準、25–40 中短、15–25 短碼、<15 全下/棄牌為主。</div>

		</div>

				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.depthstrategytitle">不同計分牌深度該怎麼打？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.depthstrategybody">100 BB 的深計分牌可以打隱含賠率與多街操作，40 BB 進入 3-bet 全下的範疇，20 BB 以下 push/fold 成為主軸，10 BB 幾乎只剩全下或棄牌。輸入你的 BB 數，工具給出該深度的策略重點與該避免的錯誤。</p>
