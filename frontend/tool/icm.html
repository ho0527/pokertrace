				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.icmbody">ICM（獨立計分牌模型）把每個人的計分牌換算成獎金的期望值：計分牌價值不是線性的，短碼的每一顆計分牌比大碼的更值錢。談 deal 拆彩金時，輸入各家計分牌與獎金結構，工具同時給出 ICM 期望值與 chip-chop 兩種拆法的金額，讓談判有客觀依據。</p>
