	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="tbtitle">桌位平衡建議</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="block">
					<label class="mb-2 block text-sm font-bold text-zinc-100" id="tbcountslabel" for="tbcounts">各桌人數（逗號分隔）</label>
					<input type="text" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="tbcounts" value="9, 8, 6, 5">
				</div>
				<div class="mt-2 text-sm text-zinc-400"><span id="tbsummarylabel">總人數</span>：<span id="tbsummary" class="font-bold text-white">-</span></div>
				<div id="tbrows" class="mt-4 space-y-2"></div>
				<div id="tbadvice" class="mt-4 rounded-2xl border border-zinc-800 bg-zinc-950/70 p-4 text-sm leading-7 text-zinc-300">-</div>
				<div class="mt-3 text-xs text-zinc-500" id="tbnote">理想各桌人數差距不超過 1 人。標記人數偏多／偏少的桌，提示從多人桌搬至少人桌以平衡。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.tablebalancetitle">桌位平衡怎麼調？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.tablebalancebody">比賽規則通常要求各桌人數差距不超過一人。輸入各桌目前人數，工具算出該從哪桌移多少人到哪桌，並提示合併時機，讓 floor 平衡桌位有依據、選手沒話說。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/tablebalance.js"></script>
