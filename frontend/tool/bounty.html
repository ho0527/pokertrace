		<title>Bounty 價值 (Bounty Value) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="botitle">Bounty 價值</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="boheadlabel" for="bohead">每顆賞金</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bohead" min="0" inputmode="numeric" value="500"></div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="bomodelabel" for="bomode">賞金模式</label>
						<select id="bomode" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400">
							<option data-i18n="bountypage.modenormal" value="normal">一般 Bounty（全額入袋）</option>
							<option data-i18n="bountypage.modepko" value="pko">PKO（一半入袋、一半進頭上）</option>
						</select>
					</div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bokoslabel" for="bokos">擊倒數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bokos" min="0" inputmode="numeric" value="3"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="boperlabel">每次擊倒入袋</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="boper">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bocashlabel">累計入袋現金</div><div class="mt-1 text-3xl font-extrabold" id="bocash">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="boheadgrowlabel">你頭上賞金成長</div><div class="mt-1 text-3xl font-extrabold text-amber-400" id="boheadgrow">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="bonote">PKO 模式：每次擊倒對手，其賞金一半立刻入袋、一半加到你自己頭上（讓你成為更值錢的擊倒目標）。一般模式：賞金全額入袋。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.bountytitle">賞金值多少計分牌？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.bountybody">在賞金賽（尤其 PKO）裡，跟注全下時不只算底池賠率，還要把對手頭上的賞金換算成計分牌價值。常用估算是把賞金金額換算成等值的起始計分牌加進底池。這個工具幫你把一般與 PKO 賞金換算成額外賠率，判斷搶賞金的跟注划不划算。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/bounty.js"></script>
	</body>
</html>
