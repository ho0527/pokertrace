<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="TDA 規則測驗：以互動選擇題練習 2024 Poker TDA 規則、推薦程序與附錄。">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/tdarulesquiz.html">
		<title>TDA規則測驗 - PokerTrace 免費撲克工具</title>
		<base href="../">
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="tool/tdarule2024.html">
		<div id="navigationbar"></div>

		<main class="mx-auto w-full max-w-4xl px-4 py-6 md:py-8">
			<header class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase text-emerald-400">TDA Practice</p>
					<h1 class="text-3xl font-extrabold leading-tight text-white sm:text-4xl">TDA規則測驗</h1>
					<p class="mt-3 text-[15px] leading-7 text-zinc-400">用選擇題練習規則編號、標題和內容。題庫會直接使用目前的 TDA 規則資料。</p>
				</div>
				<div class="grid grid-cols-2 gap-2">
					<input type="button" class="min-h-10 rounded-lg bg-emerald-500 px-4 text-sm font-bold text-white transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400" id="tdaquizzh" value="中文">
					<input type="button" class="min-h-10 rounded-lg bg-zinc-800 px-4 text-sm font-bold text-zinc-200 transition hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-400" id="tdaquizen" value="English">
				</div>
			</header>

			<section class="rounded-lg bg-zinc-900/90 p-5 md:p-6">
				<div class="flex flex-col gap-3 border-b border-zinc-800 pb-4 md:flex-row md:items-center md:justify-between">
					<div>
						<div class="text-sm font-bold text-zinc-500" id="tdaquizprogress">第 1 題</div>
						<div class="mt-1 text-xl font-extrabold text-white" id="tdaquizmode">題型</div>
					</div>
					<div class="text-sm font-bold text-emerald-400" id="tdaquizscore">0 / 0</div>
				</div>

				<div class="mt-5 rounded-lg bg-zinc-950/70 p-4 text-[15px] leading-7 text-zinc-200 md:p-5" id="tdaquizquestion"></div>
				<div class="mt-4 grid gap-3" id="tdaquizoptionlist"></div>

				<div class="mt-5 hidden rounded-lg p-4 text-sm font-bold leading-6" id="tdaquizresult"></div>
				<div class="mt-5 flex flex-col gap-3 sm:flex-row">
					<input type="button" class="min-h-11 rounded-lg bg-emerald-500 px-5 text-sm font-extrabold text-white transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400" id="tdaquiznext" value="下一題">
					<a href="tool/tdarule2024.html" class="inline-flex min-h-11 items-center justify-center rounded-lg bg-zinc-800 px-5 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">回規則手冊</a>
				</div>
			</section>
		</main>

		<div class="hidden">
			<div id="tdalangbar"></div>
			<div id="tdaempty"></div>
			<div id="tdarulelist"></div>
			<div id="tdaeyebrow"></div>
			<div id="tdatitle"></div>
			<div id="tdadescription"></div>
			<div id="back"></div>
			<div id="tdasearchlabel"></div>
			<div id="tdacomparelabel"></div>
			<div id="tdapdftitle"></div>
			<div id="tdapdfnote"></div>
			<div id="tdadownload"></div>
			<div id="tdaopennewtab"></div>
			<div id="tdacount"></div>
			<nav id="tdasidenav"></nav>
			<input type="text" id="tdasearch">
			<input type="checkbox" id="tdacompare">
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/tdarules.js"></script>
		<script src="tool/tdarulesquiz.js"></script>
	</body>
</html>
