<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="計分牌換色：把金額拆成計分牌顆數。免費線上撲克工具，不用登入、無廣告。Color Up: Convert values into chip counts. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/colorup.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="計分牌換色 / Color Up - PokerTrace">
		<meta property="og:description" content="計分牌換色：把金額拆成計分牌顆數。免費線上撲克工具，不用登入、無廣告。Color Up: Convert values into chip counts. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/colorup.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>計分牌換色 (Color Up) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="cutitle">計分牌換色</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="cuamountlabel" for="cuamount">要換的金額</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="cuamount" min="0" inputmode="numeric" value="43350">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="cudenomlabel" for="cudenom">可用面額（逗號分隔）</label>
						<input type="text" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="cudenom" value="5000, 1000, 500, 100, 25">
						<input type="button" class="mt-2 min-h-10 rounded-2xl border border-emerald-600/60 bg-emerald-600/10 px-4 text-sm font-bold text-emerald-300 transition hover:bg-emerald-600/20" id="cuprofilechips" value="從個人資料載入面額">
						<div id="custrip" class="chipstrip"></div>
					</div>
				</div>

				<div class="mt-6 text-lg font-extrabold" id="cudenomtitle">換色明細（大到小）</div>
				<div id="curows" class="mt-3 space-y-2"></div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cuchipslabel">總計分牌數</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="cuchips">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="cucoveredlabel">可換金額</div><div class="mt-1 text-3xl font-extrabold text-zinc-200" id="cucovered">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="curemainlabel">無法整除餘額</div><div class="mt-1 text-3xl font-extrabold text-amber-400" id="curemain">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="cunote">由大面額往小面額貪婪換色，列出每種面額所需顆數。最後若有不足最小面額的餘額，需另以 chip race 處理。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.coloruptitle">計分牌換色（Color Up）計算</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.colorupbody">盲注升高後小面額失去作用，就要把它們換成大面額。輸入要移除的面額與各選手持有量，工具算出每人應換得的大計分牌與剩餘零頭，配合 chip race 或無條件進位規則快速完成換色。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/colorup.js"></script>
	</body>
</html>
