	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="ittitle">選手投入追蹤</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itbuyinlabel" for="itbuyin">買入金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itbuyin" min="0" inputmode="numeric" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itrebuycountlabel" for="itrebuycount">Rebuy 次數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itrebuycount" min="0" inputmode="numeric" value="2"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itrebuyamtlabel" for="itrebuyamt">Rebuy 金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itrebuyamt" min="0" inputmode="numeric" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itaddonlabel" for="itaddon">Addon 金額</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itaddon" min="0" inputmode="numeric" value="500"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itfeelabel" for="itfee">手續費合計</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itfee" min="0" inputmode="numeric" value="200"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="itwinlabel" for="itwin">獲得獎金</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="itwin" min="0" inputmode="numeric" value="0"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="ittotallabel">總投入</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="ittotal">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="itprofitlabel">本場淨利</div><div class="mt-1 text-2xl font-extrabold" id="itprofit">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="itroilabel">本場 ROI</div><div class="mt-1 text-2xl font-extrabold" id="itroi">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="itnote">總投入 = 買入 + rebuy 次數 × rebuy 金額 + addon + 手續費。本場淨利 = 獎金 − 總投入。可即時追蹤單場帳。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">單場投入與淨利追蹤</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">買入、重購、add-on、小費加起來才是你這場真正的投入。輸入各項支出與最終獎金，工具算出單場淨利與投報率，誠實面對自己的成績，不再只記得贏的那幾場。</p>
			</div>
		</section>
