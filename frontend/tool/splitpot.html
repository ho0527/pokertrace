<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="平分彩池：平分彩池與 odd chips 分配。免費線上撲克工具，不用登入、無廣告。Split Pot: Split pot and odd chip handling. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/splitpot.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="平分彩池 / Split Pot - PokerTrace">
		<meta property="og:description" content="平分彩池：平分彩池與 odd chips 分配。免費線上撲克工具，不用登入、無廣告。Split Pot: Split pot and odd chip handling. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/splitpot.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>平分彩池 (Split Pot) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="sptitle">平分彩池</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="sppotlabel" for="sppot">彩池</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="sppot" min="0" inputmode="numeric" value="9000">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="spwayslabel" for="spways">平分人數</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="spways" min="2" max="10" inputmode="numeric" value="2">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="spchiplabel" for="spchip">最小面額</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="spchip" min="1" inputmode="numeric" value="25">
						<input type="button" class="mt-2 min-h-10 rounded-2xl border border-emerald-600/60 bg-emerald-600/10 px-4 text-sm font-bold text-emerald-300 transition hover:bg-emerald-600/20" id="spprofilechips" value="從個人資料載入面額">
						<div id="spchipstrip" class="chipstrip"></div>
					</div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="spbaselabel">每人基本</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="spbase">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="spoddlabel">零頭計分牌（odd chips）</div><div class="mt-1 text-3xl font-extrabold" id="spodd">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="spremainderlabel">不可分配餘額</div><div class="mt-1 text-3xl font-extrabold" id="spremainder">-</div></div>
				</div>
				<div id="sprows" class="mt-4 space-y-2"></div>
				<div class="mt-3 text-xs text-zinc-500" id="spnote">每人先拿可整除最小面額的相同金額，剩下無法均分的計分牌（odd chips）依習慣分給距離莊家左手最近的選手。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.splitpottitle">平分彩池與零頭計分牌</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.splitpotbody">兩家以上攤牌同牌力時底池均分，除不盡的零頭（odd chip）通常給最接近按鈕左邊的選手。輸入底池與人數，工具算出每人分得金額與零頭歸屬，處理 split pot 快又標準。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/splitpot.js"></script>
	</body>
</html>
