		<title>平均計分牌 (Average Stack) - PokerTrace 免費撲克工具</title>

			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="astitle">平均計分牌</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="astotallabel" for="astotal">總計分牌量</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="astotal" min="0" inputmode="numeric" value="1600000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="asplayerslabel" for="asplayers">剩餘人數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="asplayers" min="1" inputmode="numeric" value="40"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="asbblabel" for="asbb">目前大盲（選填）</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="asbb" min="0" step="any" inputmode="decimal" value="2000"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="asavglabel">平均計分牌</div><div class="mt-1 text-3xl font-extrabold text-emerald-400" id="asavg">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="asavgbblabel">平均 BB</div><div class="mt-1 text-3xl font-extrabold" id="asavgbb">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="asnote">平均計分牌 = 總計分牌量 ÷ 剩餘人數；平均 BB = 平均計分牌 ÷ 目前大盲。可快速判斷全場深淺。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.avgstacktitle">平均計分牌怎麼算？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.avgstackbody">平均計分牌 = 全場總計分牌 ÷ 剩餘人數，再除以目前大盲就是平均 BB 深度。它是判斷比賽節奏最快的指標：你的計分牌相對平均值的位置，會直接影響該打得更積極還是更保守。輸入總計分牌、剩餘人數與目前盲注，即可同時得到平均計分牌與平均 BB。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/avgstack.js"></script>
	</body>
</html>
