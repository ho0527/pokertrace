<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="下注大小：各種 pot 比例與對手所需勝率。免費線上撲克工具，不用登入、無廣告。Bet Size: Pot fractions and opponent required equity. Free online poker tool by PokerTrace.">
		<link rel="canonical" href="https://pokertrace.net/frontend/tool/betsize.html">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="PokerTrace">
		<meta property="og:title" content="下注大小 / Bet Size - PokerTrace">
		<meta property="og:description" content="下注大小：各種 pot 比例與對手所需勝率。免費線上撲克工具，不用登入、無廣告。Bet Size: Pot fractions and opponent required equity. Free online poker tool by PokerTrace.">
		<meta property="og:url" content="https://pokertrace.net/frontend/tool/betsize.html">
		<meta property="og:image" content="https://pokertrace.net/material/image/indeximage.png">
		<meta property="og:locale" content="zh_TW">
		<meta name="twitter:card" content="summary">
		<title>下注大小 (Bet Size) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="bstitle">下注大小</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>

			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-2">
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="bspotlabel" for="bspot">目前底池</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bspot" min="0" inputmode="numeric" value="1000">
					</div>
					<div class="block">
						<label class="mb-2 block text-sm font-bold text-zinc-100" id="bsoverbetlabel" for="bsoverbet">Overbet 倍數</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bsoverbet" step="0.1" min="1" inputmode="decimal" value="1.5">
					</div>
				</div>

				<div class="mt-6 overflow-hidden rounded-2xl border border-zinc-800">
					<div class="grid grid-cols-3 gap-px bg-zinc-800 text-xs font-bold uppercase tracking-[0.12em] text-zinc-400">
						<div class="bg-zinc-950/80 px-4 py-3" id="bshfraction">下注比例</div>
						<div class="bg-zinc-950/80 px-4 py-3 text-right" id="bshamount">下注金額</div>
						<div class="bg-zinc-950/80 px-4 py-3 text-right" id="bshneed">對手所需勝率</div>
					</div>
					<div id="bsrows"></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="bsnote">對手所需勝率 = 下注額 ÷（底池 + 2 × 下注額），即他跟注要划算所需的最低勝率。</div>
			</section>
		</div>

		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white">下注尺寸與對手所需勝率</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">下注大小決定對手跟注需要的勝率：下注 1/2 pot 時對手需要 25% 勝率才夠本，下注滿 pot 需要 33%。這個工具列出常見 pot 比例對應的對手所需勝率，以及你詐唬時的損益平衡棄牌率，幫你在價值下注與詐唬之間選出合理尺寸。</p>
			</div>
		</section>
		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/betsize.js"></script>
	</body>
</html>
