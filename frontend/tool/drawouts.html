			</section>

				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400">同花聽牌 9 張補牌、兩頭順 8 張、卡順 4 張。快速估算法是「4-2 法則」：翻牌到河牌約為補牌數 ×4%，轉牌到河牌約 ×2%。這張表整理常見聽牌的 outs 與各街成牌機率，配合底池賠率就能決定跟不跟。</p>
