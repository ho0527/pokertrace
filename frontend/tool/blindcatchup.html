<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>盲注追上估算 (Blind Catchup) - PokerTrace 免費撲克工具</title>
		<base href="../">
			<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="tool.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="toollist.html">
		<div id="navigationbar"></div>
		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex items-end justify-between gap-3">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Tools</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="bctitle">盲注追上估算</h1>
				</div>
				<a href="toollist.html" class="rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="back">回上一頁</a>
			</div>
			<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
				<div class="grid grid-cols-2 gap-4 sm:grid-cols-5">
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bcstacklabel" for="bcstack">目前計分牌</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bcstack" min="0" inputmode="numeric" value="40000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bcbblabel" for="bcbb">目前大盲</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bcbb" min="1" step="any" inputmode="decimal" value="1000"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bcmultlabel" for="bcmult">升盲倍數</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bcmult" step="0.05" min="1" inputmode="decimal" value="1.5"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bclevelminlabel" for="bclevelmin">每級分鐘</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bclevelmin" min="1" inputmode="numeric" value="20"></div>
					<div class="block"><label class="mb-2 block text-sm font-bold text-zinc-100" id="bcthresholdlabel" for="bcthreshold">短碼門檻 (BB)</label><input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none focus:border-emerald-400" id="bcthreshold" min="1" step="any" inputmode="decimal" value="10"></div>
				</div>

				<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-4">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bcnowlabel">目前大盲數</div><div class="mt-1 text-2xl font-extrabold text-emerald-400" id="bcnow">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bclevelslabel">再過幾級進入短碼</div><div class="mt-1 text-2xl font-extrabold" id="bclevels">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bctimelabel">約多久</div><div class="mt-1 text-2xl font-extrabold text-zinc-200" id="bctime">-</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center"><div class="text-sm text-zinc-400" id="bcthenlabel">屆時大盲數</div><div class="mt-1 text-2xl font-extrabold text-amber-400" id="bcthen">-</div></div>
				</div>
				<div class="mt-3 text-xs text-zinc-500" id="bcnote">假設計分牌不變、僅盲注上升。每升一級大盲 ×倍數，計算還有幾級／多久後大盲數低於短碼門檻，提示何時進入 push/fold。</div>
			</section>
		</div>
		<section class="mx-auto w-full max-w-6xl px-4 pb-10">
			<div class="rounded-[28px] border border-zinc-800 bg-zinc-900/60 p-6 md:p-8">
				<h2 id="toolseotitle" class="text-xl font-extrabold text-white" data-i18n="toolseo.blindcatchuptitle">還有幾級會變短碼？</h2>
				<p id="toolseobody" class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="toolseo.blindcatchupbody">盲注每級上升，計分牌不動就等於變相縮水。輸入目前計分牌與盲注結構，工具會推算幾級之後你會掉到 20 BB、10 BB 等關鍵深度，幫你提早規劃該在哪個級別開始加壓或尋找全下機會。</p>
			</div>
		</section>
		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tool/blindcatchup.js"></script>
	</body>
</html>
