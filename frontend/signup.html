<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>登入頁面 - Sign In Page</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen flex items-center justify-center">
		<div class="w-full max-w-md bg-zinc-800 rounded-xl shadow-lg p-8">
			<h1 class="text-2xl font-bold text-gray-300 mb-6 text-center">歡迎回來</h1>
			<form method="POST" class="space-y-6" id="form">
				<div>
					<label for="text" class="block text-sm font-medium text-gray-200 mb-2">使用者名稱</label>
					<input type="text" class="w-full px-4 py-2 border border-gray-800 bg-zinc-900 rounded-lg" id="username" name="username" required>
				</div>
				<div>
					<label for="email" class="block text-sm font-medium text-gray-200 mb-2">電子郵件</label>
					<input type="text" class="w-full px-4 py-2 border border-gray-800 bg-zinc-900 rounded-lg" id="email" name="email" required>
				</div>
				<div>
					<label for="name" class="block text-sm font-medium text-gray-200 mb-2">姓名</label>
					<input type="text" class="w-full px-4 py-2 border border-gray-800 bg-zinc-900 rounded-lg" id="name" name="name" required>
				</div>
				<div>
					<label for="phone" class="block text-sm font-medium text-gray-200 mb-2">電話</label>
					<input type="text" class="w-full px-4 py-2 border border-gray-800 bg-zinc-900 rounded-lg" id="phone" name="phone" required>
				</div>
				<div>
					<label for="password" class="block text-sm font-medium text-gray-200 mb-2">密碼</label>
					<input type="password" class="w-full px-4 py-2 border border-gray-800 bg-zinc-900 rounded-lg" id="password" name="password" required>
				</div>
				<button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg transition-colors" id="submit">註冊</button>
			</form>
			<div class="text-red-500 text-center my-2" id="error"></div>
			<div class="flex justify-between mt-6 text-sm">
				<a href="signin.html" class="text-blue-500 hover:underline">返回登入</a>
				<div></div>
			</div>
		</div>

		<script src="initialize.js"></script>
		<script src="signup.js"></script>
	</body>
</html>
