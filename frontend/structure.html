<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Structure - Poker Clock</title>
    <link href="../material/icon/icon.png" rel="shortcut icon" type="image/x-icon">
    <link href="../material/icon/icon.png" rel="apple-touch-icon">
    <link rel="stylesheet" href="control.css">
    <script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
    <script src="translate.js"></script>
</head>

<body>
    <div id="navigationbar"></div>

    <div class="layout">
        <div class="topbar">
            <div class="title-row">
                <div style="flex:1;min-width:0">
                    <div class="tname" id="tournName">Structure</div>
                    <div class="tname-sub"><span id="tournSub">STRUCTURE VIEW</span> · LV <span id="hLv">—</span>/<span id="hLvMax">—</span></div>
                </div>
                <div id="regBadge" class="reg-badge reg-open">REG OPEN</div>
            </div>
        </div>

        <div class="section">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <a href="control.html" class="btn btn-ghost btn-sm" id="btnBack">Back to Control</a>
                <a href="structureedit.html" class="btn btn-primary btn-sm" id="btnEdit">Edit Structure</a>
            </div>
        </div>

        <div class="section">
            <div class="section-title" id="sectionTitle">Structure</div>
            <div class="card" style="padding:0">
                <div class="lvl-list structure-list" id="structureList"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title" id="summaryTitle">Summary</div>
            <div class="card">
                <div class="player-meta" style="margin-top:0">
                    <div class="meta-cell">
                        <div class="lbl">Level</div>
                        <div class="v" id="levelCount">—</div>
                    </div>
                    <div class="meta-cell">
                        <div class="lbl" id="totalDurationLabel">Total Duration</div>
                        <div class="v amber" id="totalDuration">—</div>
                    </div>
                </div>
                <div id="regHint" style="font-size:12px;color:#666;margin-top:10px;line-height:1.6"></div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div><span class="sync-dot" id="syncDot"></span><span id="syncText">Loading</span></div>
        <div id="lastAction">Ready</div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="initialize.js"></script>
    <script src="structure.js"></script>
</body>

</html>
