<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Poker Clock - Tournament Display</title>
		<link rel="stylesheet" href="display.css">
		<link href="../material/icon/icon.png" rel="shortcut icon" type="image/x-icon">
		<link href="../material/icon/icon.png" rel="apple-touch-icon">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
	</head>
	<body>
		<!-- 返回鈕：只在窄螢幕（body.displayscaled）顯示，網址由 display.js 依 sessionid 補上。
		     大螢幕的顯示頁是投影用的，不放這顆。 -->
		<a href="#" class="displayback" id="displayback">&#8592; Back</a>
		<div class="sync-indicator" id="syncDot" title="Synchronizing with control desk"></div>

		<div id="root">
			<div class="display-shell">
				<header class="display-header">
					<div class="tournament-block">
						<div class="tournament-title">
							<span id="tournName"></span>
							<span class="tournament-subtitle" id="tournSub"></span>
						</div>
					</div>

					<div class="header-meta-wrap">
						<div class="header-meta">
							Buy-in <span class="buyin-value" id="bInfo">$500+100</span><br>
							<span class="status-running" id="statusInfo">▶ RUNNING</span>
						</div>
					</div>
				</header>

				<main class="display-main">
					<section class="payout-column" id="payoutColumn" aria-label="Payout information">
						<div class="card payout-card">
							<div class="lbl">Payouts</div>
							<div id="payoutList"></div>

							<div class="prize-pool-card">
								<div class="lbl">Total Prize Pool</div>
								<div class="stat-num prize-pool-value prizePoolDisplay" id="prizePoolDisplay"></div>
								<div class="prize-pool-calc prizePoolCalc" id="prizePoolCalc"></div>
							</div>

							<div class="other-reward-card" id="otherRewardBlock">
								<div class="lbl">Other Rewards</div>
								<div class="other-reward-list" id="otherRewardList"></div>
							</div>
						</div>
					</section>

					<section class="card center-panel" id="centerPanel" role="timer" aria-live="polite" aria-atomic="true" aria-label="Tournament clock">
						<div class="bubble-banner hidden" id="bubbleBanner">BUBBLE TIME</div>
						<div class="bubble-banner h4h-banner hidden" id="h4hBanner">HAND-FOR-HAND</div>

						<div class="level-bar">
							<span class="level-tag" id="tagLabel">LEVEL</span>
							<span class="mono level-number" id="levelNum"></span>
							<span class="level-of" id="levelOf"></span>
						</div>

						<div class="break-overlay hidden" id="breakOverlay">
							<div class="break-title">Break Time</div>
							<div class="mono break-timer" id="breakTimerDisplay"></div>
							<div class="break-next">
								<span class="break-next-blinds" id="breakNextBlinds"></span>
							</div>
						</div>

						<div class="main-content" id="mainContent">
							<div class="timer-main" id="timerDisplay" role="timer" aria-live="polite" aria-atomic="true">20:00</div>

							<div class="progress-track">
								<div class="progress-bar" id="progressBar"></div>
							</div>

							<div class="blind-block">
								<div class="blind-row">
									<span class="blind-label">Blinds</span>
									<div class="blind-big" id="blindsDisplay"></div>
								</div>

								<div class="blind-row">
									<span class="blind-label ante-label">BB Ante</span>
									<div class="ante-big" id="anteDisplay"></div>
								</div>
							</div>
						</div>
					</section>

					<section class="info-column" aria-label="Tournament status">
						<div class="card" id="regCountdownCard">
							<div class="lbl">Registration Close</div>
							<div class="stat-num large-stat green-stat" id="regCountdownDisplay"></div>
							<div class="sub-stat hidden" id="regCloseAfterLabel"></div>
						</div>

						<div class="card players-card" id="playersCard">
							<div class="lbl">Players Remaining</div>
							<div class="stat-num large-stat">
								<span id="playersDisplay">9</span><span id="entriesLabel">/9</span>
							</div>
							<div class="bubble-status hidden" id="bubbleStatus"></div>
						</div>

						<div class="card avg-card" id="avgStackCard">
							<div class="lbl">Avg Stack</div>
							<div class="stat-num large-stat" id="avgStack"></div>
						</div>

						<div class="card" id="breakCountdownCard">
							<div class="lbl">Next Break</div>
							<div class="stat-num large-stat gold-stat" id="breakCountdownDisplay"></div>
							<div class="sub-stat hidden" id="breakAfterLabel"></div>
						</div>

						<div class="card" id="nextBlindsCard">
							<div class="lbl">Next Blinds</div>
							<div id="nextBlindsInfo"></div>
						</div>

						<div class="card schedule-card hidden">
							<div class="lbl">Schedule</div>
							<div id="blindStructureList"></div>
						</div>
					</section>
				</main>
			</div>

			<div class="marquee-wrap" id="marqueeWrap">
				<div class="marquee-text" id="marqueeText"></div>
			</div>

			<div class="card mobile-prize-card">
				<div class="lbl">Total Cash Prize</div>
				<div class="stat-num prize-pool-value prizePoolDisplay"></div>
				<div class="prize-pool-calc prizePoolCalc"></div>
			</div>
		</div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="display.js?v=20260826payout4"></script>
	</body>
</html>
