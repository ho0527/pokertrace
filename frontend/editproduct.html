<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>新增商品 - 上傳表單</title>
		<link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
        <script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 min-h-screen flex items-center justify-center">
        <div class="max-w-3xl mx-auto my-8 bg-white rounded-xl shadow-lg p-8 w-full">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">修改商品</h2>
            <form method="POST" id="form">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                    <div class="mb-4">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">商品名稱</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="tag" class="block text-sm font-medium text-gray-700 mb-2">分類</label>
                        <input type="text" id="tag" name="category"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="price" class="block text-sm font-medium text-gray-700 mb-2">價格</label>
                        <input type="number" id="price" name="price" required min="0" step="0.01"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="stock" class="block text-sm font-medium text-gray-700 mb-2">庫存</label>
                        <input type="number" id="stock" name="stock" required min="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4 md:col-span-2">
                        <label for="image" class="block text-sm font-medium text-gray-700 mb-2">商品圖片</label>
                        <div id="imagePreview" class="flex items-center justify-center border-2 border-dashed border-gray-300 rounded-lg h-40 bg-gray-50 cursor-pointer transition-colors mb-2 overflow-hidden">
                            <span class="text-gray-400" id="previewText"></span>
                            <img id="previewImg" src="" alt="預覽" class="h-full object-contain">
                        </div>
                        <input type="file" id="image" name="image" accept="image/*" class="hidden">
                    </div>
                    <div class="mb-4 md:col-span-2">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">商品描述</label>
                        <textarea id="description" name="description" rows="4"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
				<div class="text-red-500 text-center my-2" id="error"></div>
                <div class="flex gap-5">
                    <a href="adminproduct.html" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition-colors mt-4 text-center">返回</a>
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg transition-colors mt-4" id="submit">上傳商品</button>
                </div>
            </form>
        </div>

        <script src="initialize.js"></script>
        <script src="editproduct.js"></script>
    </body>
</html>
