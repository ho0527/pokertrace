<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>通知中心 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="notifeyebrow">Notification</p>
					<h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl" id="notiftitle">通知中心</h1>
				</div>
				<div class="flex flex-wrap gap-2">
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-5 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="refreshnotif" value="重新整理">
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-5 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="readallnotif" value="全部已讀">
				</div>
			</div>

			<div class="mb-6 flex flex-wrap gap-2">
				<input type="text" class="min-h-12 flex-1 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="notifkeyword" placeholder="搜尋標題或內容" maxlength="100">
				<input type="button" class="min-h-12 inline-flex cursor-pointer items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-emerald-400" id="searchnotif" value="搜尋">
				<select class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="notiflimitselect" aria-label="每頁筆數">
					<option value="10">10</option>
					<option value="20" selected>20</option>
					<option value="50">50</option>
					<option value="100">100</option>
				</select>
			</div>

			<div id="notiflist" class="space-y-3"></div>
			<div id="notifempty" class="hidden py-16 text-center text-zinc-500">目前沒有通知</div>
			<div id="notifpagination" class="mt-6 flex flex-wrap items-center justify-center gap-2"></div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="notification.js"></script>
	</body>
</html>
