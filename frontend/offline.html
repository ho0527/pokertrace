<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#18181b">
		<title>離線 - PokerTrace</title>
		<style>
			html,body{height:100%;margin:0}
			body{display:flex;align-items:center;justify-content:center;background:#09090b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
			.box{max-width:420px;padding:32px;text-align:center}
			.title{font-size:24px;font-weight:800;margin-bottom:12px}
			.desc{font-size:15px;line-height:1.8;color:#a1a1aa;margin-bottom:24px}
			.btn{display:inline-block;cursor:pointer;border:none;border-radius:16px;background:#10b981;color:#fff;font-size:15px;font-weight:700;padding:12px 28px}
			.btn:hover{background:#059669}
			.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f87171;margin-right:8px;vertical-align:middle}
		</style>
	</head>
	<body>
		<div class="box" data-copyignore>
			<div class="title"><span class="dot"></span>目前離線 / Offline</div>
			<div class="desc">
				偵測不到網路連線。已快取的頁面仍可瀏覽；恢復連線後請重新整理。<br>
				No network connection. Cached pages still work; reload once you are back online.
			</div>
			<input type="button" class="btn" id="retry" value="重新整理 / Retry">
		</div>
		<script>
			document.getElementById("retry").addEventListener("click",function(){
				location.reload()
			})
			window.addEventListener("online",function(){
				location.reload()
			})
		</script>
		<script src="copydata.js" data-ptcopydata></script>
	</body>
</html>
