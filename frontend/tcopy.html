<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			font-family: Arial, Helvetica, sans-serif;
		}

		.nav-bar {
			background-color: #666666;
			display: flex;
			justify-content: center;
		}

		.nav-block {
			width: 70vw;
			display: flex;
			justify-content: space-between;
		}

		.nav-bar ul {
			list-style: none;
			display: flex;
			gap: 10px;
		}

		.nav-bar li,
		.nav-block div {
			margin: 10px 0;
		}

		.nav-bar a,
		.nav-block div {
			text-decoration: none;
			color: white;
		}

		.top {
			background-color: lightgrey;
			display: flex;
			justify-content: center;
		}

		.top-block {
			position: absolute;
			width: 70vw;
			height: "";
			display: flex;
			justify-content: space-between;
			align-items: end;
		}
		.textdiv {
			position: relative;
			width: 70vw;
			height: "";
			display: flex;
		}

		.textdiv .text {
			margin: 2vw 0;
			width: 50%;
		}

		.top-block .img {
			/* position: absolute; */
			width: 47%;
			aspect-ratio: 4/3;
			background-color: #565656;
			border: 0;
			top: 0;
			right: 0;
		}

		.top-block .btn {
			background-color: #666666;
			padding: 1vw;
			color: white;
			border: 0;
			width: 8vw;
			aspect-ratio: 2/1;
			/* position: absolute; */
			/* left: 0; */
			/* bottom: 0; */
		}
	</style>
</head>

<body>
	<nav class="nav-bar">
		<div class="nav-block">
			<div>ITSA 2024</div>
			<ul>
				<li><a href="">最新消息</a></li>
				<li><a href="">競賽須知</a></li>
				<li><a href="">競賽報名</a></li>
				<li><a href="">競賽時程</a></li>
			</ul>
		</div>
	</nav>

	<div class="top">
		<div class="textdiv">
		<div class="text">
			<h1>全國大專校院程式設計極客挑戰賽</h1>
			<p><b>即日起至113年9月13日(五) 17:00止</b></p>
		</div>
		</div>
		<div class="top-block">
			<button class="btn">我要報名</button>

			<div class="img">

			</div>

		</div>
	</div>
</body>

</html>
