<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>報名收據 四聯單 - PokerTrace</title>
		<link rel="stylesheet" href="receipt.css">
	</head>
	<body class="receiptpage">
		<div class="receipttoolbar" id="receipttoolbar">
			<div class="receipttoolbarinner">
				<div class="receipttoolbartitle">報名收據 · 四聯單（58mm 熱感紙）</div>
				<div class="receipttoolbaractions">
					<input type="button" class="receiptbutton" id="printreceipt" value="列印 / Print">
					<input type="button" class="receiptbutton receiptbuttonghost" id="backsession" value="返回">
				</div>
			</div>
			<div class="receipttoolbarnote">參照 POKER DREAM 收據格式的四聯單版面（店家 / 選手 / 發牌 / 桌面），內容為範例資料，實際報名資料之後再串。列印時工具列不會印出。</div>
		</div>

		<div class="receiptsheet" id="receiptsheet"></div>

		<script src="qrcode.js"></script>
		<script src="receipt.js"></script>
	</body>
</html>
