<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新增場次 - Add Session</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-xl mx-auto py-10 px-4">
			<h2 class="text-2xl font-bold mb-4">新增場次</h2>
			<form method="POST" class="bg-zinc-800 rounded-lg p-6 shadow space-y-6" id="form">
				<div>
					<label for="gameeventtype" class="block mb-2 text-zinc-300">賽事類型</label>
					<select class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="gameeventtype">
						<option value="tournament">錦標賽</option>
						<option value="limited">限時錦標賽</option>
						<option value="cash">現金局</option>
					</select>
				</div>
				<div>
					<label for="name" class="block mb-2 text-zinc-300">名稱</label>
					<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="name">
				</div>
				<div>
					<label for="clubid" class="block mb-2 text-zinc-300">地點</label>
					<select class="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center" id="clubid" required>
						<option value="">-- 請選擇 --</option>
					</select>
				</div>
				<div class="flex gap-4">
					<div class="w-full">
						<label for="gametype" class="block mb-2 text-zinc-300">遊戲類型</label>
						<select class="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center" id="gametype"></select>
					</div>
					<div class="w-full">
						<label for="limittype" class="block mb-2 text-zinc-300">限注類型</label>
						<select class="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center" id="limittype"></select>
					</div>
				</div>
				<div class="flex gap-4">
					<div class="w-full">
						<label for="stacktype" class="block mb-2 text-zinc-300">籌碼類型</label>
						<select class="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center" id="stacktype"></select>
					</div>
					<div class="w-full">
						<label for="eventtype" class="block mb-2 text-zinc-300">賽事類型</label>
						<select class="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center" id="eventtype"></select>
					</div>
				</div>
				<div class="flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-3">
					<input type="checkbox" id="owned" class="w-5 h-5 accent-emerald-500 cursor-pointer">
					<label for="owned" class="text-zinc-200 cursor-pointer select-none">
						是否為主辦牌局
						<span class="block text-xs text-zinc-400 mt-0.5">勾選後切換為主辦設定模式 (不計入個人盈虧)</span>
					</label>
				</div>
				<div>
					<label for="date" class="block mb-2 text-zinc-300">開始日期</label>
					<input type="date" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="date">
				</div>
				<div class="grid grid-cols-2 gap-4">
					<div>
						<label for="starttime" class="block mb-2 text-zinc-300">開始時間</label>
						<input type="time" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="starttime" step="1" value="14:00">
					</div>
					<div>
						<label for="endtime" class="block mb-2 text-zinc-300">結束時間</label>
						<input type="time" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="endtime" step="1" value="20:30">
					</div>
				</div>
				<div class="grid grid-cols-3 gap-4">
					<div>
						<label for="buyin" class="block mb-2 text-zinc-300"><span class="ownedlabel">買入費</span></label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="buyin" value="600">
					</div>
					<div>
						<label for="buyinfee" class="block mb-2 text-zinc-300">買入服務費</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="buyinfee" value="0">
					</div>
					<div>
						<label for="chip" class="block mb-2 text-zinc-300"><span class="ownedlabel">買入籌碼</span></label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="chip" value="25000">
					</div>
				</div>
				<div class="grid grid-cols-3 gap-4">
					<div>
						<label for="rebuycount" class="block mb-2 text-zinc-300"><span class="ownedlabel">重購次數</span></label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="rebuycount" value="0">
					</div>
					<div>
						<label for="rebuybuyin" class="block mb-2 text-zinc-300"><span class="ownedlabel">重購費</span></label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="rebuybuyin" value="600">
					</div>
					<div>
						<label for="rebuyfee" class="block mb-2 text-zinc-300">重購服務費</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="rebuyfee" value="0">
					</div>
				</div>

				<!-- 主辦設定區 (owned=true 才顯示) -->
				<div id="ownedfields" class="hidden space-y-6 border-t border-zinc-700 pt-6">
					<div class="text-emerald-400 text-sm font-semibold">主辦設定</div>
					<div>
						<label for="rebuychip" class="block mb-2 text-zinc-300">重購籌碼</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="rebuychip" value="0">
					</div>
					<div class="grid grid-cols-3 gap-4">
						<div>
							<label for="reentrycount" class="block mb-2 text-zinc-300">再入次數</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="reentrycount" value="0">
						</div>
						<div>
							<label for="reentrybuyin" class="block mb-2 text-zinc-300">再入費</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="reentrybuyin" value="0">
						</div>
						<div>
							<label for="reentryfee" class="block mb-2 text-zinc-300">再入服務費</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="reentryfee" value="0">
						</div>
					</div>
					<div>
						<label for="reentrychip" class="block mb-2 text-zinc-300">再入籌碼</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="reentrychip" value="0">
					</div>
					<div class="grid grid-cols-3 gap-4">
						<div>
							<label for="addoncount" class="block mb-2 text-zinc-300">增購次數</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="addoncount" value="0">
						</div>
						<div>
							<label for="addonbuyin" class="block mb-2 text-zinc-300">增購費</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="addonbuyin" value="0">
						</div>
						<div>
							<label for="addonfee" class="block mb-2 text-zinc-300">增購服務費</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="addonfee" value="0">
						</div>
					</div>
					<div class="grid grid-cols-2 gap-4">
						<div>
							<label for="addonchip" class="block mb-2 text-zinc-300">增購籌碼</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="addonchip" value="0">
						</div>
						<div>
							<div class="flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-2 h-full">
								<input type="checkbox" id="linkuser" class="w-5 h-5 accent-emerald-500 cursor-pointer">
								<label for="linkuser" class="text-zinc-200 cursor-pointer select-none text-sm">
									使用者連結
								</label>
							</div>
						</div>
						<div>
							<div class="flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-2 h-full">
								<input type="checkbox" id="openregistration" class="w-5 h-5 accent-emerald-500 cursor-pointer">
								<label for="openregistration" class="text-zinc-200 cursor-pointer select-none text-sm">
									開放報名
								</label>
							</div>
						</div>
					</div>
				</div>

				<!-- 個人成績區 (owned=false 才顯示) -->
				<div id="personalfields" class="space-y-6">
					<div class="grid grid-cols-2 gap-4">
						<div>
							<label for="winprice" class="block mb-2 text-zinc-300">獲獎金額</label>
							<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="winprice" value="0">
						</div>
						<div>
							<label for="winthing" class="block mb-2 text-zinc-300">獲獎獎品</label>
							<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="winthing" value="N/A">
						</div>
					</div>
					<div class="grid grid-cols-2 gap-4">
						<div>
							<label for="place" class="block mb-2 text-zinc-300">名次</label>
							<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="place" value="0">
						</div>
						<div>
							<label for="totalbuyin" class="block mb-2 text-zinc-300">總買入</label>
							<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="totalbuyin" value="0">
						</div>
					</div>
					<div class="grid grid-cols-2 gap-4">
						<div class="flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-2">
							<input type="checkbox" id="inmoney" class="w-5 h-5 accent-emerald-500 cursor-pointer">
							<label for="inmoney" class="text-zinc-200 cursor-pointer select-none text-sm">
								有進錢圈 (ITM)
							</label>
						</div>
						<div class="flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-2">
							<input type="checkbox" id="inft" class="w-5 h-5 accent-emerald-500 cursor-pointer">
							<label for="inft" class="text-zinc-200 cursor-pointer select-none text-sm">
								有進 Final Table
							</label>
						</div>
					</div>
				</div>

				<div>
					<label for="description" class="block mb-2 text-zinc-300">備註</label>
					<textarea class="w-full bg-zinc-700 text-white rounded px-3 py-2 resize-none" id="description" rows="2" placeholder="可填寫本場重點或心得"></textarea>
				</div>
				<div class="text-red-500 text-center font-bold my-1" id="error"></div>
				<div class="flex justify-end">
					<button type="submit" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded text-lg font-bold" id="submit">送出</button>
				</div>
			</form>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="newsession.js"></script>
	</body>
</html>
