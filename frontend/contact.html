<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>聯絡我們 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Contact</p>
				<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="contacttitle">聯絡我們</h1>
				<p class="mt-3 text-sm leading-7 text-zinc-400" id="contactdesc">有任何功能建議、錯誤回報、使用問題或合作想法，都可以從這裡送出。你的回饋會進入後台，由管理者查看與處理。</p>
			</div>

			<div class="grid grid-cols-1 gap-5 lg:grid-cols-[0.9fr_1.1fr]">
				<section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5">
						<div class="text-base font-bold text-white" id="contactreporttitle">適合回報的內容</div>
						<div class="mt-3 text-sm leading-7 text-zinc-400" id="contactreportdesc">
							賽事流程建議、報名或座位操作問題、計時器需求、開源部署問題、畫面錯誤、翻譯問題、資料統計異常。
						</div>
					</div>
				</section>

				<form id="contactform" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8 space-y-4">
					<div>
						<label class="mb-2 block text-sm font-bold text-zinc-100" for="contactname" id="contactnamelabel">姓名</label>
						<input id="contactname" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" maxlength="100" required>
					</div>
					<div>
						<label class="mb-2 block text-sm font-bold text-zinc-100" for="contactemail">Email</label>
						<input id="contactemail" type="email" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" maxlength="150" required>
					</div>
					<div>
						<label class="mb-2 block text-sm font-bold text-zinc-100" for="contactsubject" id="contactsubjectlabel">主旨</label>
						<input id="contactsubject" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" maxlength="150" placeholder="例如：報名清單建議">
					</div>
					<div>
						<label class="mb-2 block text-sm font-bold text-zinc-100" for="contactmessage" id="contactmessagelabel">內容</label>
						<textarea id="contactmessage" class="min-h-40 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-3 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" maxlength="3000" required></textarea>
					</div>
					<input type="submit" class="min-h-12 inline-flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="contactsubmit" value="送出訊息">
				</form>
			</div>
		</div>

		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="contact.js"></script>
	</body>
</html>
