<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>系統 API 紀錄 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="adminlogeyebrow">API Access Log</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="adminlogheading">系統 API 紀錄</h1>
				</div>
				<div class="flex flex-wrap gap-2">
					<input type="text" id="adminlogkeyword" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" placeholder="搜尋使用者姓名/信箱/選手編號/API/方法/IP" maxlength="100">
					<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-emerald-400" id="searchadminlog" value="搜尋">
					<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-rose-400" id="adminlogerroronly" aria-pressed="false" value="只看非 200">
					<select id="adminloglimitselect" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" aria-label="每頁筆數">
						<option value="10">10</option>
						<option value="20" selected>20</option>
						<option value="50">50</option>
						<option value="100">100</option>
					</select>
					<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="reloadadminlog" value="重新整理">
				</div>
			</div>
			<div class="max-h-[65vh] overflow-y-auto overflow-x-auto rounded-2xl border border-zinc-800">
				<table class="w-full text-left text-sm">
					<thead class="sticky top-0 z-10 bg-zinc-900 text-zinc-400">
						<tr>
							<th class="px-4 py-3" id="adminlogcoltime">時間</th>
							<th class="px-4 py-3" id="adminlogcoluser">使用者</th>
							<th class="px-4 py-3" id="adminlogcolpath">API</th>
							<th class="px-4 py-3" id="adminlogcolstatus">狀態碼</th>
						</tr>
					</thead>
					<tbody id="adminlogtablebody"></tbody>
				</table>
			</div>
			<div id="adminlogpagination" class="mt-6 flex flex-wrap justify-center items-center gap-2"></div>
		</div>

		<div id="adminlogdetailmodal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
			<div class="w-full max-w-lg rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
				<div class="mb-4 flex items-center justify-between">
					<h2 class="text-lg font-bold" id="adminlogdetailtitle">詳細訊息</h2>
					<input type="button" class="rounded-xl border border-zinc-700 px-3 py-1 text-sm text-zinc-300 hover:border-emerald-400" id="closeadminlogdetail" value="✕">
				</div>
				<div class="space-y-3 text-sm" id="adminlogdetailbody"></div>
			</div>
		</div>

		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="admin.js"></script>
	</body>
</html>
