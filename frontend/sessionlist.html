<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>場次列表 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="print.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Sessions</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl">場次管理</h1>
				</div>
				<a href="newsession.html" class="hidden md:inline-flex min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-newsessionlink>新增場次</a>
			</div>

			<div class="mb-4 md:hidden">
				<a href="newsession.html" class="inline-flex w-full min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-4 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-newsessionlink>新增場次</a>
			</div>
			<!-- 篩選搜尋區塊 -->
			<section class="mb-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-6">
				<div class="flex items-center justify-between gap-3 md:hidden">
					<div class="text-base font-bold text-zinc-100" id="filtertitle">篩選搜尋</div>
					<input type="button" class="cursor-pointer rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="togglefilter" value="展開">
				</div>
				<div class="hidden md:block" id="filterbody">
					<div class="my-3 flex flex-col gap-3 md:flex-row md:flex-wrap md:items-center md:justify-between md:gap-4">
						<div class="flex items-center gap-2 md:w-[340px]">
							<input type="date" class="min-h-12 w-full min-w-0 flex-1 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="startdate" placeholder="開始日期" aria-label="開始日期">
							<span class="text-zinc-500">~</span>
							<input type="date" class="min-h-12 w-full min-w-0 flex-1 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="enddate" placeholder="結束日期" aria-label="結束日期">
						</div>
						<select class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-center text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="club" aria-label="場地" required>
							<option value="">-- 請選擇 --</option>
						</select>
						<select class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="gametype" aria-label="遊戲類型">
							<option value="all">全部遊戲類型</option>
							<option value="cash">現金局</option>
							<option value="tournament">錦標賽</option>
							<option value="limited">限時錦標賽</option>
						</select>
						<input type="text" class="min-h-12 flex-1 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="name" placeholder="名稱" aria-label="場次名稱">
					</div>
					<div class="mb-1 mt-4 text-[13px] font-bold uppercase tracking-[0.14em] text-zinc-500" id="quickfiltertitle">快速篩選</div>
					<div class="grid grid-cols-1 gap-2 md:flex md:items-center md:justify-between">
						<div class="grid grid-cols-1 gap-2 md:grid-cols-3" id="quickfilterbuttons">
							<input type="button" class="cursor-pointer rounded-2xl bg-zinc-700 hover:bg-zinc-600 px-4 py-2 text-sm font-bold text-white transition quickfilterbutton" id="filter-registerable" value="可報名">
							<input type="button" class="cursor-pointer rounded-2xl bg-zinc-700 hover:bg-zinc-600 px-4 py-2 text-sm font-bold text-white transition quickfilterbutton" id="filter-owned" value="主辦">
							<input type="button" class="cursor-pointer rounded-2xl bg-zinc-700 hover:bg-zinc-600 px-4 py-2 text-sm font-bold text-white transition quickfilterbutton" id="filter-joined" value="有參與">
						</div>
						<div class="grid grid-cols-2 gap-2 md:flex md:justify-end">
							<input type="button" class="cursor-pointer rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-5 py-2 text-sm font-bold text-white transition" id="search" value="搜尋">
							<input type="button" class="cursor-pointer rounded-2xl bg-zinc-700 hover:bg-zinc-600 px-5 py-2 text-sm font-bold text-white transition" id="clearsearch" value="清空">
							<input type="button" class="cursor-pointer rounded-2xl border border-zinc-600 bg-zinc-800 hover:bg-zinc-700 px-5 py-2 text-sm font-bold text-white transition" id="printsessionlist" value="列印列表">
							<input type="button" class="cursor-pointer rounded-2xl border border-zinc-600 bg-zinc-800 hover:bg-zinc-700 px-5 py-2 text-sm font-bold text-white transition" id="exportsessioncsv" value="匯出 CSV">
						</div>
					</div>
				</div>
			</section>

			<!-- 場次列表 -->
			<div class="md:h-[50vh] md:overflow-auto md:overscroll-contain md:rounded-2xl md:border md:border-zinc-800 md:bg-zinc-900/40" id="main"></div>
			<div class="mt-4 flex flex-wrap items-center justify-center gap-2" id="pagination"></div>

			<!-- 場次統計預覽 -->
			<section class="mb-8 mt-8 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)]">
				<div class="mb-4 text-center text-lg font-extrabold text-white">場次統計預覽</div>
				<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center">
						<div class="text-sm text-zinc-400">總場次</div>
						<div class="mt-1 text-2xl font-extrabold" id="gamecount">0</div>
					</div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center">
						<div class="text-sm text-zinc-400">總盈虧</div>
						<div class="mt-1 text-2xl font-extrabold text-green-400" id="profit">+0</div>
					</div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-center">
						<div class="text-sm text-zinc-400">平均時長</div>
						<div class="mt-1 text-2xl font-extrabold" id="avgplaylength">0 小時</div>
					</div>
				</div>
			</section>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="print.js"></script>
		<script src="sessionlist.js"></script>
	</body>
</html>
