<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>多牌桌總覽 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Table Board</p>
					<h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl" id="boardtitle">多牌桌總覽</h1>
					<div class="mt-2 text-sm text-zinc-400" id="boardsessionname"></div>
				</div>
				<div class="flex flex-wrap gap-2">
					<a class="inline-flex min-h-12 items-center justify-center rounded-2xl bg-zinc-800 px-5 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="backtosession" href="#">回場次</a>
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-5 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" id="refreshboard" value="重新整理">
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-5 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="autobalance" value="自動平衡入座">
					<input type="button" class="inline-flex min-h-12 cursor-pointer items-center justify-center rounded-2xl bg-gradient-to-r from-rose-500 to-rose-600 px-5 text-sm font-bold text-white transition hover:from-rose-400 hover:to-rose-500" id="unseatall" value="全部退座（打散）">
				</div>
			</div>

			<div class="mb-6 grid grid-cols-3 gap-3">
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center">
					<div class="text-xs text-zinc-400" id="statlabeltables">牌桌</div>
					<div class="mt-1 text-2xl font-extrabold" id="stattables">0</div>
				</div>
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center">
					<div class="text-xs text-zinc-400" id="statlabelplayers">在場選手</div>
					<div class="mt-1 text-2xl font-extrabold text-emerald-400" id="statplayers">0</div>
				</div>
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center">
					<div class="text-xs text-zinc-400" id="statlabelavg">平均每桌</div>
					<div class="mt-1 text-2xl font-extrabold" id="statavg">0</div>
				</div>
			</div>

			<div id="balancehint" class="mb-6 hidden rounded-2xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm leading-7 text-amber-200"></div>

			<div id="boardgrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
			<div id="boardempty" class="hidden py-16 text-center text-zinc-500">此場次尚無牌桌</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="tableboard.js"></script>
	</body>
</html>
