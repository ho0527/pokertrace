<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>掃描報到 QR - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-md px-4 py-6 md:py-8">
			<div class="mb-4">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Scan</p>
				<h1 class="text-3xl font-extrabold tracking-tight text-white">掃描報到 QR</h1>
				<div class="mt-2 text-sm text-zinc-400">將選手收據上的 QR 對準相機，辨識後會自動開啟該筆報到核對頁。</div>
			</div>

			<div class="relative aspect-square overflow-hidden rounded-2xl border border-zinc-800 bg-black">
				<video id="scanvideo" class="h-full w-full object-cover" muted playsinline></video>
				<div class="pointer-events-none absolute inset-8 rounded-xl border-2 border-emerald-400/70"></div>
			</div>

			<div id="scanstatus" class="mt-3 min-h-6 text-sm text-zinc-400"></div>

			<div class="mt-3 flex flex-wrap gap-2">
				<input type="button" class="cursor-pointer rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-5 py-2 text-sm font-bold text-white" id="scanrestart" value="重新啟動相機">
				<a href="sessionlist.html" class="inline-flex items-center rounded-2xl bg-zinc-800 hover:bg-zinc-700 px-5 py-2 text-sm font-bold text-white" id="scanback">返回</a>
			</div>

			<div class="mt-6 border-t border-zinc-800 pt-4">
				<div class="mb-3 text-sm text-zinc-400" id="scanmanualhint">相機不能用時，可選擇場次後手動輸入收據上的「入場編號」：</div>
				<label for="scanmanualsession" class="mb-1 block text-xs text-zinc-500" id="scanmanualsessionlabel">場次</label>
				<select class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="scanmanualsession"></select>
				<div class="hidden min-h-12 w-full items-center rounded-2xl border border-zinc-700 bg-zinc-800/60 px-4 text-[15px] text-zinc-200" id="scanmanualsessionfixed"></div>
				<label for="scanmanualinput" class="mb-1 mt-3 block text-xs text-zinc-500" id="scanmanualentrylabel">入場編號</label>
				<div class="flex gap-2">
					<input type="number" class="min-h-11 flex-1 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="scanmanualinput" min="1" step="1" inputmode="numeric" placeholder="入場編號">
					<input type="button" class="cursor-pointer rounded-2xl bg-zinc-700 hover:bg-zinc-600 px-5 py-2 text-sm font-bold text-white" id="scanmanualgo" value="查詢">
				</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="jsqr.js"></script>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="scan.js"></script>
	</body>
</html>
