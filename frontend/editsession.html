<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>修改場次結果 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Edit Result</p>
				<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl">編輯場次結果</h1>
			</div>

			<div class="mb-5 rounded-[24px] border border-zinc-800 bg-zinc-900/80 p-5">
				<div class="mb-2 text-sm font-bold text-zinc-500">場次</div>
				<div class="text-2xl font-extrabold text-white" id="sessionname">載入中</div>
				<div class="mt-2 text-sm leading-7 text-zinc-400">
					<span id="sessiontype"></span>
					<span id="sessiontime"></span>
				</div>
			</div>

			<form method="POST" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="form">
				<div class="grid grid-cols-2 gap-4 md:grid-cols-2">
					<div>
						<label for="winprice" class="mb-2 block text-sm font-bold text-zinc-100">獲獎金額</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="winprice" min="0" inputmode="numeric" value="0">
					</div>
					<div>
						<label for="winthing" class="mb-2 block text-sm font-bold text-zinc-100">獲獎獎品</label>
						<input type="text" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="winthing" value="N/A" placeholder="如無獎品可填 N/A">
					</div>
				</div>

				<div class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-2">
					<div>
						<label for="place" class="mb-2 block text-sm font-bold text-zinc-100">名次</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="place" min="0" inputmode="numeric" value="0">
					</div>
					<div>
						<label for="totalbuyin" class="mb-2 block text-sm font-bold text-zinc-100">總買入</label>
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="totalbuyin" min="0" inputmode="numeric" value="0">
					</div>
				</div>

				<div class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-2">
					<label class="flex cursor-pointer items-center gap-3 rounded-[20px] border border-zinc-800 bg-zinc-950/70 p-4">
						<input type="checkbox" class="h-[18px] w-[18px] cursor-pointer accent-emerald-500" id="inmoney">
						<span class="select-none text-sm font-bold text-zinc-100">有進錢圈 (ITM)</span>
					</label>
					<label class="flex cursor-pointer items-center gap-3 rounded-[20px] border border-zinc-800 bg-zinc-950/70 p-4">
						<input type="checkbox" class="h-[18px] w-[18px] cursor-pointer accent-emerald-500" id="inft">
						<span class="select-none text-sm font-bold text-zinc-100">有進 Final Table</span>
					</label>
				</div>

				<div class="mt-5 min-h-6 text-center text-sm font-bold leading-7 text-rose-300" id="error"></div>

				<div class="mt-4 flex justify-end">
					<input type="submit" class="inline-flex min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-7 text-base font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="submit" value="送出">
				</div>
			</form>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="editsession.js"></script>
	</body>
</html>
