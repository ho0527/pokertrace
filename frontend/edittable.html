<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新增場次 - Add Session</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-xl mx-auto py-10 px-4">
			<h2 class="text-2xl font-bold mb-4">編輯桌次</h2>
			<form method="POST" class="bg-zinc-800 rounded-lg p-6 shadow space-y-6" id="form">
				<div>
					<label for="location" class="block mb-2 text-zinc-300">名稱</label>
					<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="name">
				</div>
				<div class="grid grid-cols-2 gap-4">
					<div>
						<label for="smallblind" class="block mb-2 text-zinc-300">小盲</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="smallblind" value="100">
					</div>
					<div>
						<label for="bigblind" class="block mb-2 text-zinc-300">大盲</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="bigblind" value="200">
					</div>
				</div>
				<div class="grid grid-cols-2 gap-4">
					<div>
						<label for="ante" class="block mb-2 text-zinc-300">大盲前注</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="bigblindante" value="200">
					</div>
					<div>
						<label for="ante" class="block mb-2 text-zinc-300">前注</label>
						<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="ante" value="0">
					</div>
				</div>
				<div>
					<label for="chips" class="block mb-2 text-zinc-300">入桌籌碼</label>
					<input type="number" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="chip" value="20000">
				</div>
				<div>
					<label for="starttime" class="block mb-2 text-zinc-300">開始日期</label>
					<input type="date" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="date">
				</div>
				<div class="grid grid-cols-2 gap-4">
					<div>
						<label for="starttime" class="block mb-2 text-zinc-300">開始時間</label>
						<input type="time" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="starttime" step="1" value="19:00">
					</div>
					<div>
						<label for="endtime" class="block mb-2 text-zinc-300">結束時間</label>
						<input type="time" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="endtime" step="1" value="23:30">
					</div>
				</div>
				<div class="text-red-500 text-center font-bold my-1" id="error"></div>
				<div class="flex justify-between">
					<input type="button" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded text-lg font-bold cursor-pointer" id="back" value="返回">
					<button type="submit" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded text-lg font-bold" id="submit">送出</button>
				</div>
			</form>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="edittable.js"></script>
	</body>
</html>
