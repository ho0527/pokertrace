<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0d0d0d">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>編輯賽程結構 — Poker Clock</title>
	<link href="../material/icon/icon.png" rel="shortcut icon" type="image/x-icon">
	<link href="../material/icon/icon.png" rel="apple-touch-icon">
	<link rel="stylesheet" href="control.css">
</head>

<body>
	<div class="layout">
		<div class="topbar">
			<div class="title-row">
				<div style="flex:1;min-width:0">
					<div class="tname" id="tournName">編輯賽程結構</div>
					<div class="tname-sub"><span id="tournSub">STRUCTURE EDIT</span> · LV <span id="hLv">—</span>/<span id="hLvMax">—</span></div>
				</div>
				<div id="regBadge" class="reg-badge reg-open">REG OPEN</div>
			</div>
		</div>

		<div class="section">
			<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
				<button class="btn btn-ghost btn-sm" id="btnBack">返回控制台</button>
				<button class="btn btn-ghost btn-sm" id="btnView">查看結構</button>
				<button class="btn btn-primary btn-sm" id="btnSaveStruct">儲存結構</button>
			</div>
		</div>

		<div class="section">
			<div class="section-title">快速套用</div>
			<div class="card">
				<div class="struct-tools">
					<div class="struct-tool-row">
						<label>Level 時長</label>
						<input class="txt" id="structLevelDur" type="number" min="1" inputmode="numeric" value="20">
						<button class="btn btn-sm" id="btnApplyLevelDur">套用</button>
					</div>
					<div class="struct-tool-row">
						<label>休息時長</label>
						<input class="txt" id="structBreakDur" type="number" min="1" inputmode="numeric" value="10">
						<button class="btn btn-sm btn-warn" id="btnApplyBreakDur">套用</button>
					</div>
				</div>
				<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
					<button class="btn btn-sm" id="btnAddLevel">+ Level</button>
					<button class="btn btn-sm btn-warn" id="btnAddBreak">+ 休息</button>
				</div>
			</div>
		</div>

		<div class="section">
			<div class="section-title">編輯項目</div>
			<div class="card">
				<div class="struct-head">
					<span>項目</span>
					<span>類型</span>
					<span>SB</span>
					<span>BB</span>
					<span>Ante</span>
					<span>分鐘</span>
					<span>REG</span>
					<span>操作</span>
				</div>
				<div id="structEditList" style="margin-bottom:12px"></div>
				<div style="font-size:11px;color:#666;line-height:1.5">
					REG 勾選代表該項目結束時自動截止報名。休息列只需要填分鐘。
				</div>
			</div>
		</div>

		<div class="section" style="margin-bottom:70px">
			<div class="section-title">匯入匯出</div>
			<div class="card">
				<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
					<button class="btn btn-sm btn-ghost" id="btnExportStruct">匯出 JSON</button>
					<button class="btn btn-sm btn-ghost" id="btnImportStruct">匯入 JSON</button>
					<label class="btn btn-sm btn-ghost" for="structFileIn">匯入檔案</label>
					<input type="file" id="structFileIn" accept="application/json,.json" style="display:none">
				</div>
				<textarea class="txt txt-area" id="structJsonText" placeholder="匯出的盲注結構 JSON 會顯示在這裡，也可以貼上 JSON 後按匯入。" style="display:none;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:120px"></textarea>
			</div>
		</div>
	</div>

	<div class="status-bar">
		<div><span class="sync-dot" id="syncDot"></span><span id="syncText">讀取中</span></div>
		<div id="lastAction">就緒</div>
	</div>

	<div class="toast" id="toast"></div>

	<script src="timerconfig.js"></script>
	<script src="structureedit.js"></script>
</body>

</html>
