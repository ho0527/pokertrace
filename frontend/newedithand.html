<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新增手牌 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<link rel="stylesheet" href="newedithand.css">
	</head>
	<body class="newhand-page bg-zinc-950 text-white min-h-screen">
		<div id="navigationbar"></div>

		<main class="newhand-shell">
			<div class="newhand-topbar">
				<div>
					<div class="newhand-eyebrow">PokerTrace</div>
					<h1 data-i18n="newedithandpage.pagetitlenew" id="pagetitle">新增手牌</h1>
				</div>
				<div class="newhand-topactions">
					<a href="sessionlist.html" data-i18n="newedithandpage.back" id="back">上一頁</a>
					<input type="button" data-i18n-value="newedithandpage.cleartemp" id="cleardata" value="清空暫存">
				</div>
			</div>

			<nav class="newhand-nav" data-i18n-aria-label="newedithandpage.flowlabel" aria-label="手牌流程">
				<input type="button" class="stepnav active" data-i18n-value="newedithandpage.step1" data-step="1" value="1 位置資訊">
				<input type="button" class="stepnav" data-i18n-value="newedithandpage.step2" data-step="2" value="2 紀錄手牌">
				<input type="button" class="stepnav" data-i18n-value="newedithandpage.step3" data-entersubmit data-step="3" value="3 檢查送出">
			</nav>

			<section class="newhand-status">
				<div>
					<span data-i18n="newedithandpage.labelseat">牌桌</span>
					<strong id="handtablename">-</strong>
				</div>
				<div>
					<span>Dealer</span>
					<strong id="dealerlabel">-</strong>
				</div>
				<div>
					<span data-i18n="newedithandpage.blindlabel">盲注</span>
					<strong id="blindlabel">-</strong>
				</div>
				<div>
					<span data-i18n="newedithandpage.labelplayer">選手</span>
					<strong id="playercountlabel">-</strong>
				</div>
				<div>
					<span data-i18n="newedithandpage.labelstatus">狀態</span>
					<strong data-i18n="newedithandpage.statusnotsaved" id="savestatus">尚未儲存</strong>
				</div>
			</section>

			<section class="newhand-step active" id="step1">
				<div class="newhand-grid">
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.step1title">位置與盲注</h2>
									<p data-i18n="newedithandpage.step1descedit">先確認遊戲類型、盲注與 Dealer，再進下一步</p>
							</div>
						</div>
						<div class="newhand-fields">
							<label>
								<span data-i18n="newedithandpage.labelgametype">遊戲類型</span>
								<select id="handgametype"></select>
							</label>
							<label>
								<span data-i18n="newedithandpage.blindlevellabel">盲注級別</span>
								<select id="blindlevelselect"></select>
							</label>
							<label id="smallblindfield">
								<span data-i18n="newedithandpage.smallblind" id="smallblindlabel">小盲</span>
								<input type="number" id="handsmallblind" min="0" inputmode="numeric">
							</label>
							<label id="bigblindfield">
								<span data-i18n="newedithandpage.labelbigblind" id="bigblindlabel">大盲</span>
								<input type="number" id="handbigblind" min="0" inputmode="numeric">
							</label>
							<label>
								<span id="antelabel">Ante</span>
								<input type="number" id="handante" min="0" inputmode="numeric">
							</label>
							<label>
								<span>Dealer</span>
								<select id="dealerseat"></select>
							</label>
							<label>
								<span data-i18n="newedithandpage.heroseat" id="selfseatinglabel">Hero 座位</span>
								<select id="selfseating"></select>
							</label>
						</div>
						<div class="newhand-checks">
							<label><input type="checkbox" data-i18n-value="newedithandpage.emptybutton" id="emptybutton"> 空 button</label>
							<label><input type="checkbox" data-i18n-value="newedithandpage.deadsmallblind" id="deadsmallblind"> 獨立大盲</label>
						</div>
						<div class="newhand-actions">
							<input type="button" data-i18n-value="newedithandpage.rebuildblinds" id="rebuildblinds" value="重建預設下注">
							<input type="button" class="primary" data-entersubmit data-goto="2" data-i18n-value="newedithandpage.stepnext" value="下一步">
						</div>
					</section>

					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.seatprefix">座位</h2>
									<p data-i18n="newedithandpage.seathintedit">點座位可標記選手與起始碼量</p>
							</div>
						</div>
						<div class="newhand-seatlist" id="seatlist"></div>
					</section>
				</div>
			</section>

			<section class="newhand-step" id="step2">
				<!-- 導覽 hub -->
				<div id="step2hub" class="step2view">
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.step2title">紀錄手牌</h2>
								<p data-i18n="newedithandpage.step2desc">選擇要操作的項目，現場一步一步點</p>
							</div>
						</div>
						<div class="newhand-hubstatus" id="hubstatus"></div>
						<div class="newhand-hubgrid">
							<div class="newhand-hubbtn" data-entersubmit role="button" tabindex="0" data-hub="hero">
								<span class="newhand-hubbtn-title" data-i18n="newedithandpage.hubherocards">新增我的手牌</span>
								<span class="newhand-hubbtn-sub" id="hubherocards">? ?</span>
							</div>
							<div class="newhand-hubbtn" role="button" tabindex="0" data-hub="board">
								<span class="newhand-hubbtn-title" data-i18n="newedithandpage.boardtitlehub" id="hubboardtitle">公共牌</span>
								<span class="newhand-hubbtn-sub" id="hubboardcards">-</span>
							</div>
							<div class="newhand-hubbtn accent" role="button" tabindex="0" data-hub="betting">
								<span class="newhand-hubbtn-title" data-i18n="newedithandpage.hubbetting">下注管理</span>
								<span class="newhand-hubbtn-sub" id="hubbetinfo">-</span>
							</div>
							<div class="newhand-hubbtn" role="button" tabindex="0" data-hub="result">
								<span class="newhand-hubbtn-title" data-i18n="newedithandpage.hubshowdown">攤牌 / 結果</span>
								<span class="newhand-hubbtn-sub" data-i18n="newedithandpage.hubresultinfo" id="hubresultinfo">選牌・選贏家</span>
							</div>
						</div>
						<div class="newhand-actions">
							<input type="button" data-goto="1" data-i18n-value="newedithandpage.stepprev" value="上一步">
							<input type="button" class="primary" data-entersubmit data-goto="3" data-i18n-value="newedithandpage.stepnext" value="下一步">
						</div>
					</section>
				</div>

				<!-- 下注管理 -->
				<div id="step2betting" class="step2view">
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.bettingtitle">下注管理</h2>
							</div>
							<input type="button" class="hubback" data-hub="hub" data-i18n-value="newedithandpage.backtohub" value="回上頁">
						</div>
						<div class="betting-stage">
							<div class="betting-head">
								<div>
									<div class="quick-action-seat" id="currentactionseat">Seat -</div>
									<div class="quick-action-meta" data-i18n="newedithandpage.waitingnext" id="currentactionmeta">等待系統推算下一位</div>
								</div>
								<label class="betting-street">
									<span data-i18n="newedithandpage.hubstreet">街別</span>
									<select id="actionstreet"></select>
								</label>
							</div>
							<div class="betting-actions">
								<input type="button" id="quickfold" value="Fold">
								<input type="button" id="quickcheckcall" value="Check / Call">
								<input type="button" id="quickraise" value="Bet / Raise">
							</div>
							<input type="button" class="betting-herocards" data-i18n-value="newedithandpage.selecthand" id="bettingherocards" value="選擇手牌">
						</div>
						<div class="newhand-actionlist" id="actionlist"></div>
					</section>
				</div>

				<!-- 攤牌 / 結果 -->
				<div id="step2result" class="step2view">
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.showdowntitle">攤牌 / 結果</h2>
								<p data-i18n="newedithandpage.showorderhint" id="showorderhint">系統會提示建議 show 順序，現場仍可 muck 或手動改贏家</p>
							</div>
							<input type="button" class="hubback" data-hub="hub" data-i18n-value="newedithandpage.backtohub" value="回上頁">
						</div>
						<div class="newhand-actions">
							<input type="button" data-i18n-value="newedithandpage.solvewinner" id="solvewinner" value="快速解算">
						</div>
						<div class="showdown-list" id="showdownlist"></div>
						<!-- TASK-038 輸入 A：run it twice 以上時在這裡長出第 2、3... 個 board -->
						<div class="showdown-runlist" id="runboardpanel"></div>
						<div class="newhand-summarybox" id="resultsummary"></div>
						<div class="newhand-actions">
							<input type="button" class="hubback" data-hub="hub" data-i18n-value="newedithandpage.backtohub" value="回上頁">
							<input type="button" class="primary" data-entersubmit data-goto="3" data-i18n-value="newedithandpage.stepnext" value="下一步">
						</div>
					</section>
				</div>
			</section>

			<section class="newhand-step" id="step3">
				<div class="newhand-grid">
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.step3title">儲存前檢查</h2>
									<p data-i18n="newedithandpage.step3desc">送出前先看警告，黃色為提醒、紅色需修正</p>
							</div>
						</div>
						<div id="warnings" class="newhand-warnings"></div>
					</section>
					<section class="newhand-panel">
						<div class="newhand-panelhead">
							<div>
								<h2 data-i18n="newedithandpage.summarytitle">摘要</h2>
								<p data-i18n="newedithandpage.step3noteedit">送出後下一手會承接結束碼量</p>
							</div>
						</div>
						<div class="newhand-summarybox" id="summarybox"></div>
						<label class="note-label">
							<span data-i18n="newedithandpage.labelnote">備註</span>
							<textarea data-i18n-placeholder="newedithandpage.psplaceholderedit" id="ps" rows="4" placeholder="現場補充、裁定或不連貫原因"></textarea>
						</label>
					</section>
				</div>
				<div class="newhand-actions">
					<input type="button" data-goto="2" data-i18n-value="newedithandpage.stepprev" value="上一步">
					<input type="button" data-i18n-value="newedithandpage.cleartemp" id="clearhandcache" value="清空暫存">
						<input type="button" class="primary save" data-entersubmit data-i18n-value="newedithandpage.submit" id="savehand" value="送出">
					<input type="button" class="primary save" data-entersubmit data-i18n-value="newedithandpage.saveandnext" id="saveandnext" value="送出，並新增下手牌">
				</div>
			</section>
		</main>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="handgame/handgame.js"></script>
		<script src="handgame/holdem.js"></script>
		<script src="handgame/omaha.js"></script>
		<script src="handgame/omaha5.js"></script>
		<script src="handgame/omaha8.js"></script>
		<script src="handgame/bigo.js"></script>
		<script src="handgame/shortdeck.js"></script>
		<script src="handgame/superholdem.js"></script>
		<script src="handgame/crazypineapple.js"></script>
		<script src="handgame/stud.js"></script>
		<script src="handgame/razz.js"></script>
		<script src="handgame/stud8.js"></script>
		<script src="handgame/a5draw.js"></script>
		<script src="handgame/deuce7draw.js"></script>
		<script src="handgame/badugi.js"></script>
		<script src="handgame/drawmaha.js"></script>
		<script src="newedithand.js"></script>
	</body>
</html>
