<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>報名清單 - Registrations</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-7xl mx-auto py-6 px-4">
			<div class="flex items-center justify-between mb-4">
				<div>
					<h1 class="text-2xl font-bold">報名清單</h1>
					<div class="text-zinc-400 text-sm mt-1" id="sessionname"></div>
				</div>
				<a href="javascript:history.back()" class="bg-zinc-700 hover:bg-zinc-600 px-4 py-2 rounded text-sm">返回場次</a>
			</div>

			<div class="grid grid-cols-3 gap-3 mb-6">
				<div class="bg-zinc-800 rounded-lg p-4">
					<div class="text-xs text-zinc-400">已報名</div>
					<div class="text-2xl font-bold text-yellow-400" id="statregistered">0</div>
				</div>
				<div class="bg-zinc-800 rounded-lg p-4">
					<div class="text-xs text-zinc-400">已確認</div>
					<div class="text-2xl font-bold text-green-400" id="statconfirmed">0</div>
				</div>
				<div class="bg-zinc-800 rounded-lg p-4">
					<div class="text-xs text-zinc-400">已取消</div>
					<div class="text-2xl font-bold text-zinc-500" id="statcancelled">0</div>
				</div>
			</div>

			<div class="bg-zinc-800 rounded-lg p-4 mb-4" id="registrationtoolbar"></div>

			<div class="bg-zinc-800 rounded-lg overflow-x-auto">
				<table class="w-full text-sm">
					<thead class="bg-zinc-700">
						<tr>
							<th class="px-3 py-2 text-left">選取</th>
							<th class="px-3 py-2 text-left">#</th>
							<th class="px-3 py-2 text-left">玩家</th>
							<th class="px-3 py-2 text-left">報名時間</th>
							<th class="px-3 py-2 text-left">狀態</th>
							<th class="px-3 py-2 text-left">座位</th>
							<th class="px-3 py-2 text-left">收益</th>
							<th class="px-3 py-2 text-left">修正</th>
							<th class="px-3 py-2 text-right">操作</th>
						</tr>
					</thead>
					<tbody id="reglist"></tbody>
				</table>
				<div id="empty" class="hidden text-center text-zinc-500 py-10">尚無報名紀錄</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="registrations.js"></script>
	</body>
</html>
