<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>員工工時 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6">
				<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Staff Hours</p>
				<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" data-i18n="staffworkpage.title">員工工時</h1>
				<p class="mt-2 leading-7 text-zinc-400" data-i18n="staffworkpage.subtitle">計分員、裁判與助理的打卡時數與應付金額。計費以 30 分鐘為單位無條件進位。</p>
			</div>

			<div id="staffshiftpanel" class="mb-6"></div>

			<div class="mb-4 flex border-b border-zinc-800">
				<input type="button" class="workwtab-btn px-4 py-2 text-emerald-400 border-b-2 border-emerald-400" data-i18n-value="staffworkpage.tabreport" data-worktab="report" value="跨場次累計">
				<input type="button" class="workwtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="staffworkpage.tabsession" data-worktab="session" value="單場明細">
			</div>

			<div id="worktab-report" class="worktab-content">
				<section class="mb-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-6">
					<div class="grid grid-cols-1 gap-3 md:grid-cols-4">
						<div>
							<label class="mb-1 block text-xs text-zinc-400" for="reportstartdate" data-i18n="staffworkpage.startdate">起始日</label>
							<input type="date" class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm" id="reportstartdate">
						</div>
						<div>
							<label class="mb-1 block text-xs text-zinc-400" for="reportenddate" data-i18n="staffworkpage.enddate">結束日</label>
							<input type="date" class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm" id="reportenddate">
						</div>
						<div>
							<label class="mb-1 block text-xs text-zinc-400" for="reportgroupby" data-i18n="staffworkpage.groupby">分組方式</label>
							<select class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm" id="reportgroupby">
								<option data-i18n="staffworkpage.groupstaff" value="staff">依員工</option>
								<option data-i18n="staffworkpage.groupsession" value="session">依場次</option>
								<option data-i18n="staffworkpage.grouplog" value="log">逐筆</option>
							</select>
						</div>
						<div>
							<label class="mb-1 block text-xs text-zinc-400" for="reportviewmode" data-i18n="staffworkpage.viewmode">檢視身分</label>
							<select class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm" id="reportviewmode">
								<option data-i18n="staffworkpage.viewowner" value="owner">我聘用的員工</option>
								<option data-i18n="staffworkpage.viewself" value="self">我自己的工時</option>
							</select>
						</div>
					</div>
					<div class="mt-3 flex flex-wrap gap-2">
						<input type="button" class="rounded-xl bg-emerald-600 px-5 py-2 text-sm font-bold text-white hover:bg-emerald-500" data-i18n-value="staffworkpage.search" id="reportsearch" value="查詢">
						<input type="button" class="rounded-xl bg-zinc-800 px-5 py-2 text-sm text-zinc-200 hover:bg-zinc-700" data-i18n-value="staffworkpage.clear" id="reportclear" value="清除條件">
					</div>
				</section>

				<div class="mb-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-4">
						<div class="text-xs text-zinc-500" data-i18n="staffworkpage.cardminute">本頁總時數</div>
						<div class="mt-1 text-2xl font-bold" id="reportcardminute">-</div>
					</div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-4">
						<div class="text-xs text-zinc-500" data-i18n="staffworkpage.cardamount">本頁總金額</div>
						<div class="mt-1 text-2xl font-bold" id="reportcardamount">-</div>
					</div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-4">
						<div class="text-xs text-zinc-500" data-i18n="staffworkpage.cardopened">進行中</div>
						<div class="mt-1 text-2xl font-bold" id="reportcardopened">-</div>
					</div>
				</div>

				<div id="reportmain" class="md:rounded-2xl md:border md:border-zinc-800"></div>
				<div id="reportpagination" class="mt-4 flex flex-wrap items-center justify-center gap-2"></div>
			</div>

			<div id="worktab-session" class="worktab-content hidden">
				<section class="mb-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-6">
					<label class="mb-1 block text-xs text-zinc-400" for="detailsession" data-i18n="staffworkpage.picksession">選擇場次</label>
					<select class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm" id="detailsession"></select>
				</section>
				<div id="detailmain" class="md:rounded-2xl md:border md:border-zinc-800"></div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="staffwork.js"></script>
	</body>
</html>
