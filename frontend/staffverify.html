<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>員工邀請確認 - PokerTrace</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white flex items-center justify-center px-4 py-10">
		<div class="w-full max-w-md rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-8 text-center shadow-[0_24px_60px_rgba(0,0,0,0.28)]">
			<p class="mb-3 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Staff Invite</p>
			<div id="loading" class="">
				<div class="text-5xl mb-4">⏳</div>
				<h1 class="text-2xl font-extrabold tracking-tight mb-2 text-white">驗證中...</h1>
				<p class="text-zinc-400 text-sm leading-7">正在處理您的邀請確認</p>
			</div>
			<div id="success" class="hidden">
				<div class="text-6xl mb-4">🎉</div>
				<h1 class="text-3xl font-extrabold tracking-tight mb-2 text-emerald-400">確認成功！</h1>
				<p class="text-zinc-300 leading-7 mb-6" id="successmsg">您已成功加入該主辦的員工名單。</p>
				<a href="signin.html" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500">前往登入</a>
			</div>
			<div id="alreadyactive" class="hidden">
				<div class="text-6xl mb-4">✅</div>
				<h1 class="text-3xl font-extrabold tracking-tight mb-2 text-emerald-400">已確認過</h1>
				<p class="text-zinc-300 leading-7 mb-6">您先前已確認過此邀請。</p>
				<a href="signin.html" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500">前往登入</a>
			</div>
			<div id="failed" class="hidden">
				<div class="text-6xl mb-4">❌</div>
				<h1 class="text-3xl font-extrabold tracking-tight mb-2 text-red-400">驗證失敗</h1>
				<p class="text-zinc-300 leading-7 mb-6" id="failedmsg">此連結無效或已過期。</p>
				<a href="signin.html" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700">回首頁</a>
			</div>
		</div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="staffverify.js"></script>
	</body>
</html>
