<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>轉播控制 (H4H) - PokerTrace</title>
		<link href="../material/icon/icon.png" rel="shortcut icon" type="image/x-icon">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-zinc-100">
		<div class="mx-auto max-w-3xl px-4 py-6">
			<header class="mb-6 border-b border-zinc-800 pb-4">
				<div class="text-xs font-bold uppercase tracking-[0.2em] text-amber-400" id="bcckicker">H4H · 手動推進控制台</div>
				<h1 class="mt-1 text-2xl font-extrabold" id="bccname">—</h1>
				<div class="mt-1 text-sm text-zinc-400" id="bccsubtitle">場內即時記錄，場外只看到你放行的手牌。逐手推進以控制轉播節奏。</div>
			</header>

			<div id="bccnotice" class="mb-6 hidden rounded-2xl border border-amber-500/40 bg-amber-500/10 px-5 py-4 text-sm text-amber-200"></div>

			<section id="bccmain" class="hidden">
				<div class="grid grid-cols-3 gap-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center"><div class="text-xs text-zinc-400" id="bcclabelreleased">已放行</div><div class="text-3xl font-extrabold text-emerald-400" id="bccreleased">0</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center"><div class="text-xs text-zinc-400" id="bcclabelpending">待放行</div><div class="text-3xl font-extrabold text-amber-300" id="bccpending">0</div></div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 text-center"><div class="text-xs text-zinc-400" id="bcclabeltotal">總手數</div><div class="text-3xl font-extrabold" id="bcctotal">0</div></div>
				</div>

				<div class="mt-4 rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
					<div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2" id="bccnexttitle">下一手待放行</div>
					<div id="bccnext" class="text-sm text-zinc-300">—</div>
				</div>

				<div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
					<button id="bccadvance" class="inline-flex min-h-14 items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-base font-extrabold text-white transition hover:from-emerald-400 hover:to-emerald-500 disabled:opacity-40 sm:col-span-2">▶ 推進下一手</button>
					<button id="bccback" class="inline-flex min-h-14 items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700 disabled:opacity-40">退回一手</button>
				</div>
				<div class="mt-3 text-right">
					<button id="bccall" class="text-sm font-bold text-amber-300 hover:text-amber-200 disabled:opacity-40">全部放行 →</button>
				</div>

				<div class="mt-6">
					<div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2" id="bcclisttitle">手牌放行進度</div>
					<div class="flex flex-col gap-2" id="bcclist"></div>
				</div>
			</section>
		</div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="broadcastcontrol.js"></script>
	</body>
</html>
