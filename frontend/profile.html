<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>個人資料</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-6xl mx-auto py-8 px-4">
			<h1 class="text-3xl font-bold mb-2">個人資料</h1>
			<p class="text-zinc-400 mb-8">玩家 ID: <span class="text-white font-mono font-bold" id="playerid">P-00001</span></p>

			<!-- ===== 報表區塊 ===== -->
			<div class="bg-zinc-800 rounded-lg p-6 shadow mb-8">
				<!-- 切換器 -->
				<div class="flex gap-2 mb-6">
					<button onclick="switchReport('month')" id="tab-month"
						class="report-tab px-5 py-2 rounded-full text-sm font-semibold transition bg-blue-600 text-white">
						月報表
					</button>
					<button onclick="switchReport('year')" id="tab-year"
						class="report-tab px-5 py-2 rounded-full text-sm font-semibold transition bg-zinc-700 text-zinc-300 hover:bg-zinc-600">
						年報表
					</button>
					<button onclick="switchReport('all')" id="tab-all"
						class="report-tab px-5 py-2 rounded-full text-sm font-semibold transition bg-zinc-700 text-zinc-300 hover:bg-zinc-600">
						生涯報表
					</button>
				</div>

				<!-- 月報表日期選擇 -->
				<div id="filter-month" class="mb-5 flex items-center gap-3">
					<label class="text-zinc-400 text-sm">選擇年月：</label>
					<input type="month" id="month-date" value="2026-05"
						class="bg-zinc-700 text-white rounded px-3 py-2 text-sm border border-zinc-600 focus:outline-none focus:border-blue-500">
				</div>

				<!-- 年報表日期選擇 -->
				<div id="filter-year" class="mb-5 flex items-center gap-3 hidden">
					<label class="text-zinc-400 text-sm">選擇年份：</label>
					<select id="year-date" class="bg-zinc-700 text-white rounded px-3 py-2 text-sm border border-zinc-600 focus:outline-none focus:border-blue-500">
						<option value="2026">2026</option>
						<option value="2025">2025</option>
						<option value="2024">2024</option>
						<option value="2023">2023</option>
					</select>
				</div>

				<!-- 包含服務費切換 -->
				<div class="mb-5 flex items-center gap-3 bg-zinc-700/40 rounded px-3 py-2">
					<input type="checkbox" id="includefee" class="w-4 h-4 accent-blue-500 cursor-pointer" checked>
					<label for="includefee" class="text-zinc-300 text-sm cursor-pointer select-none">
						盈虧計算包含服務費
						<span class="text-xs text-zinc-500 ml-1">(取消勾選後，盈虧只算買入金額本身)</span>
					</label>
				</div>

				<!-- 報表內容 -->
				<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
					<!-- Cash -->
					<div class="bg-zinc-900 rounded-lg p-5 flex flex-col gap-3">
						<div class="flex items-center gap-2 mb-1">
							<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
							<span class="font-semibold text-zinc-200">Cash <span class="text-zinc-500 text-xs font-normal">現金桌</span></span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>局數</span><span class="text-white font-mono" id="cash-games">48</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總買入</span><span class="text-white font-mono" id="cash-buyin">$12,000</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總收益</span><span class="text-green-400 font-mono font-bold" id="cash-profit">+$3,400</span>
						</div>
					</div>
					<!-- TLT -->
					<div class="bg-zinc-900 rounded-lg p-5 flex flex-col gap-3">
						<div class="flex items-center gap-2 mb-1">
							<span class="w-2 h-2 rounded-full bg-yellow-400 inline-block"></span>
							<span class="font-semibold text-zinc-200">TLT <span class="text-zinc-500 text-xs font-normal">限時錦標賽</span></span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>場次</span><span class="text-white font-mono" id="tlt-games">12</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總買入</span><span class="text-white font-mono" id="tlt-buyin">$6,000</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總收益</span><span class="text-red-400 font-mono font-bold" id="tlt-profit">-$800</span>
						</div>
					</div>
					<!-- MTT -->
					<div class="bg-zinc-900 rounded-lg p-5 flex flex-col gap-3">
						<div class="flex items-center gap-2 mb-1">
							<span class="w-2 h-2 rounded-full bg-purple-400 inline-block"></span>
							<span class="font-semibold text-zinc-200">MTT <span class="text-zinc-500 text-xs font-normal">錦標賽</span></span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>場次</span><span class="text-white font-mono" id="mtt-games">0</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總組數</span><span class="text-white font-mono" id="mtt-buyincount">0</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總買入</span><span class="text-white font-mono" id="mtt-buyin">0</span>
						</div>
						<div class="flex justify-between text-sm text-zinc-400">
							<span>總收益</span><span class="text-green-400 font-mono font-bold" id="mtt-profit">0</span>
						</div>
						<div class="border-t border-zinc-700 mt-1 pt-2 grid grid-cols-2 gap-x-3 gap-y-1">
							<div class="flex justify-between text-xs text-zinc-400">
								<span>ROI</span><span class="text-green-400 font-mono" id="mtt-roi">0%</span>
							</div>
							<div class="flex justify-between text-xs text-zinc-400">
								<span>ITM</span><span class="text-white font-mono" id="mtt-itm">0%</span>
							</div>
							<div class="flex justify-between text-xs text-zinc-400">
								<span>FT</span><span class="text-white font-mono" id="mtt-ft">0%</span>
							</div>
							<div class="flex justify-between text-xs text-zinc-400">
								<span>Top3</span><span class="text-white font-mono" id="mtt-top3">0%</span>
							</div>
						</div>
					</div>
				</div>

				<!-- 小計 -->
				<div class="mt-5 pt-5 border-t border-zinc-700 flex justify-between items-center">
					<span class="text-zinc-400 text-sm">總盈虧</span>
					<span class="text-2xl font-bold text-green-400" id="report-total">+$15,100</span>
				</div>
			</div>

			<!-- ===== 聘用人員 ===== -->
			<div class="bg-zinc-800 rounded-lg p-6 shadow mb-8" id="staffsection">
				<div class="text-lg font-semibold mb-5" id="staffsectiontitle">聘用人員</div>
				<div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="staffsectioncontent">
					<!-- 發牌員 -->
					<div class="bg-zinc-900 rounded-lg p-4 flex flex-col gap-3">
						<div class="flex items-center justify-between">
							<div class="flex items-center gap-2">
								<span class="text-xl">🃏</span>
								<span class="font-semibold">發牌員</span>
								<span class="bg-zinc-700 text-zinc-300 text-xs rounded-full px-2 py-0.5" id="dealer-count">0</span>
							</div>
							<button onclick="openStaffModal('dealer')"
								class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded transition">
								管理
							</button>
						</div>
						<div class="space-y-1" id="dealer-list"></div>
					</div>
					<!-- 裁判 (對應 user.type = floor) -->
					<div class="bg-zinc-900 rounded-lg p-4 flex flex-col gap-3">
						<div class="flex items-center justify-between">
							<div class="flex items-center gap-2">
								<span class="text-xl">⚖️</span>
								<span class="font-semibold">裁判</span>
								<span class="bg-zinc-700 text-zinc-300 text-xs rounded-full px-2 py-0.5" id="floor-count">0</span>
							</div>
							<button onclick="openStaffModal('floor')"
								class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded transition">
								管理
							</button>
						</div>
						<div class="space-y-1" id="floor-list"></div>
					</div>
					<!-- 助理 -->
					<div class="bg-zinc-900 rounded-lg p-4 flex flex-col gap-3">
						<div class="flex items-center justify-between">
							<div class="flex items-center gap-2">
								<span class="text-xl">🙋</span>
								<span class="font-semibold">助理</span>
								<span class="bg-zinc-700 text-zinc-300 text-xs rounded-full px-2 py-0.5" id="assistant-count">0</span>
							</div>
							<button onclick="openStaffModal('assistant')"
								class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded transition">
								管理
							</button>
						</div>
						<div class="space-y-1" id="assistant-list"></div>
					</div>
				</div>
			</div>

			<!-- ===== 語言切換 ===== -->
			<div class="bg-zinc-800 rounded-lg p-6 shadow mb-8">
				<div class="text-lg font-semibold mb-4">選擇語言</div>
				<div class="flex gap-2">
					<button onclick="switchLang('zhtw')" id="lang-zhtw"
						class="lang-btn px-6 py-2 rounded-full text-sm font-semibold transition bg-zinc-700 text-zinc-300 hover:bg-zinc-600">
						中文
					</button>
					<button onclick="switchLang('en')" id="lang-en"
						class="lang-btn px-6 py-2 rounded-full text-sm font-semibold transition bg-zinc-700 text-zinc-300 hover:bg-zinc-600">
						英文
					</button>
				</div>
			</div>

			<!-- ===== 籌碼顏色 ===== -->
			<div class="bg-zinc-800 rounded-lg p-6 shadow mb-8">
				<div class="flex items-center justify-between gap-3">
					<div>
						<div class="text-lg font-semibold">籌碼顏色種類</div>
						<div class="text-xs text-zinc-400 mt-1" id="chipcolorpreview">白色、紅色、藍色、綠色、黑色</div>
					</div>
					<button id="openchipcolormodal" class="bg-blue-600 hover:bg-blue-700 text-sm px-4 py-2 rounded transition">管理</button>
				</div>
			</div>

			<!-- ===== 其他連結 ===== -->
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
				<a href="display-synced.html"
					class="bg-zinc-800 hover:bg-zinc-700 rounded-lg p-5 shadow flex items-center gap-3 transition">
					<span class="text-2xl">⏱️</span>
					<div>
						<div class="font-semibold">簡易本地計時器</div>
						<div class="text-xs text-zinc-400"></div>
					</div>
				</a>
				<a href="referee-control.html"
					class="bg-zinc-800 hover:bg-zinc-700 rounded-lg p-5 shadow flex items-center gap-3 transition">
					<span class="text-2xl">🎛️</span>
					<div>
						<div class="font-semibold">裁判控制台</div>
						<div class="text-xs text-zinc-400"></div>
					</div>
				</a>
			</div>

			<!-- 登出 -->
			<div class="mb-8">
				<input type="button" class="button bg-red-700 hover:bg-red-800 px-6 py-2 rounded cursor-pointer w-full" id="signout" value="登出">
			</div>
		</div>

		<div id="footer"></div>

		<!-- ===== 聘用人員燈箱 ===== -->
		<div id="staffmodal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">
			<div class="bg-zinc-800 rounded-lg p-6 w-full max-w-md mx-4 max-h-[80vh] flex flex-col">
				<!-- Header -->
				<div class="flex justify-between items-center mb-5">
					<h2 class="text-xl font-bold" id="staffmodal-title">發牌員名單</h2>
					<button onclick="closeStaffModal()" class="text-zinc-400 hover:text-white text-2xl leading-none">&times;</button>
				</div>

				<!-- 新增欄位 -->
				<div class="flex gap-2 mb-5">
					<input type="text" id="staffid-input" placeholder="輸入使用者 ID（e.g. P-00099）"
						class="flex-1 bg-zinc-700 text-white rounded px-3 py-2 text-sm border border-zinc-600 focus:outline-none focus:border-blue-500">
					<button onclick="addStaff()"
						class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded text-sm font-semibold transition">
						新增
					</button>
				</div>

				<!-- 目前名單 -->
				<div class="text-xs text-zinc-400 mb-2">目前名單</div>
				<div class="overflow-y-auto flex-1 space-y-2" id="staffmodal-list">
					<!-- 動態填入 -->
				</div>

				<!-- Footer -->
				<div class="mt-5 pt-4 border-t border-zinc-700">
					<button onclick="closeStaffModal()"
						class="w-full bg-zinc-600 hover:bg-zinc-700 px-4 py-2 rounded text-sm transition">
						關閉
					</button>
				</div>
			</div>
		</div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="profile.js"></script>
	</body>
</html>
