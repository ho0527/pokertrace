<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>系統 API 紀錄 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-wrap gap-2">
				<input type="button" class="rounded-full bg-blue-600 px-5 py-2 text-sm font-bold text-white transition" data-entersubmit id="admintabbuttonlog" value="紀錄">
				<input type="button" class="rounded-full bg-zinc-700 px-5 py-2 text-sm font-bold text-zinc-300 transition hover:bg-zinc-600" id="admintabbuttonuser" value="使用者">
			</div>

			<div id="admintablog">
				<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
					<div>
						<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="adminlogeyebrow">API Access Log</p>
						<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" data-i18n="adminlogpage.heading" id="adminlogheading">系統 API 紀錄</h1>
					</div>
					<div class="flex flex-wrap gap-2">
						<input type="text" id="adminlogkeyword" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" data-i18n-placeholder="adminlogpage.searchplaceholder" placeholder="搜尋使用者姓名/信箱/選手編號/API/方法/IP" maxlength="100">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-emerald-400" data-entersubmit data-i18n-value="adminlogpage.search" id="searchadminlog" value="搜尋">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-rose-400" data-i18n-value="adminlogpage.erroronly" id="adminlogerroronly" aria-pressed="false" value="只看非 200">
						<select id="adminloglimitselect" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" data-i18n-aria-label="adminuserpage.pagesizelabel" aria-label="每頁筆數">
							<option value="10">10</option>
							<option value="20" selected>20</option>
							<option value="50">50</option>
							<option value="100">100</option>
						</select>
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-i18n-value="adminlogpage.reload" id="reloadadminlog" value="重新整理">
					</div>
				</div>
				<div class="max-h-[65vh] overflow-y-auto overflow-x-auto rounded-2xl border border-zinc-800">
					<table class="w-full text-left text-sm">
						<thead class="sticky top-0 z-10 bg-zinc-900 text-zinc-400">
							<tr id="adminloghead">
								<th class="ptsortth select-none px-4 py-3" data-sortkey="createtime"><span data-i18n="adminlogpage.coltime" id="adminlogcoltime">時間</span><span class="ptsortarrow text-emerald-400" data-sortkey="createtime"></span></th>
								<th class="ptsortth select-none px-4 py-3" data-sortkey="username"><span data-i18n="adminlogpage.coluser" id="adminlogcoluser">使用者</span><span class="ptsortarrow text-emerald-400" data-sortkey="username"></span></th>
								<th class="ptsortth select-none px-4 py-3" data-sortkey="path"><span id="adminlogcolpath">API</span><span class="ptsortarrow text-emerald-400" data-sortkey="path"></span></th>
								<th class="ptsortth select-none px-4 py-3" data-sortkey="statuscode"><span data-i18n="adminlogpage.colstatus" id="adminlogcolstatus">狀態碼</span><span class="ptsortarrow text-emerald-400" data-sortkey="statuscode"></span></th>
							</tr>
						</thead>
						<tbody id="adminlogtablebody"></tbody>
					</table>
				</div>
				<div id="adminlogpagination" class="mt-6 flex flex-wrap justify-center items-center gap-2"></div>
			</div>

			<div id="admintabuser" class="hidden">
				<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
					<div>
						<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="adminusereyebrow">User Management</p>
						<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="adminuserheading">使用者管理</h1>
						<p class="mt-1 text-xs text-zinc-500" id="adminuserhint">Lv4 以上為管理員</p>
						<p class="mt-1 text-xs text-zinc-500" id="adminusersorthint">點欄位標題可排序</p>
					</div>
					<div class="flex flex-wrap gap-2">
						<input type="text" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="adminuserkeyword" maxlength="100" placeholder="搜尋姓名/信箱/選手編號">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-zinc-700 px-6 text-sm font-bold text-white transition hover:bg-zinc-600" id="showadminuserdefault" value="預設使用者">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl border border-zinc-700 bg-zinc-800 px-6 text-sm font-bold text-white transition hover:border-emerald-400" data-entersubmit id="searchadminuser" value="搜尋">
						<select class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" data-i18n-aria-label="adminuserpage.pagesizelabel" id="adminuserlimitselect" aria-label="每頁筆數">
							<option value="10">10</option>
							<option value="20" selected>20</option>
							<option value="50">50</option>
							<option value="100">100</option>
						</select>
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="reloadadminuser" value="重新整理">
					</div>
				</div>
				<div class="max-h-[65vh] overflow-y-auto overflow-x-auto rounded-2xl border border-zinc-800">
					<table class="w-full text-left text-sm">
						<thead class="sticky top-0 z-10 bg-zinc-900 text-zinc-400">
							<tr>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="name"><span class="pointer-events-none" id="adminusercolname">姓名</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="name"></span></th>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="playerid"><span class="pointer-events-none" id="adminusercolplayerid">編號</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="playerid"></span></th>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="email"><span class="pointer-events-none" id="adminusercolemail">Email</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="email"></span></th>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="permission"><span class="pointer-events-none" id="adminusercolpermission">權限</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="permission"></span></th>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="status"><span class="pointer-events-none" id="adminusercolstatus">狀態</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="status"></span></th>
								<th class="adminusersortheader cursor-pointer select-none whitespace-nowrap px-4 py-3" data-sortkey="createtime"><span class="pointer-events-none" id="adminusercolcreatetime">建立時間</span><span class="adminusersortarrow pointer-events-none text-emerald-400" data-sortkey="createtime"></span></th>
								<th class="px-4 py-3" id="adminusercolaction">操作</th>
							</tr>
						</thead>
						<tbody id="adminusertablebody"></tbody>
					</table>
				</div>
				<div id="adminuserpagination" class="mt-6 flex flex-wrap justify-center items-center gap-2"></div>
			</div>
		</div>

		<div id="adminlogdetailmodal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
			<div class="w-full max-w-lg rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
				<div class="mb-4 flex items-center justify-between">
					<h2 class="text-lg font-bold" data-i18n="adminlogpage.detailtitle" id="adminlogdetailtitle">詳細訊息</h2>
					<input type="button" class="rounded-xl border border-zinc-700 px-3 py-1 text-sm text-zinc-300 hover:border-emerald-400" id="closeadminlogdetail" value="✕">
				</div>
				<div class="space-y-3 text-sm" id="adminlogdetailbody"></div>
			</div>
		</div>

		<div id="adminuserblockmodal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
			<div class="w-full max-w-lg rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
				<div class="mb-4 flex items-center justify-between">
					<h2 class="text-lg font-bold" id="adminuserblocktitle">限時封鎖使用者</h2>
					<input type="button" class="rounded-xl border border-zinc-700 px-3 py-1 text-sm text-zinc-300 hover:border-emerald-400" id="closeadminuserblock" value="✕">
				</div>
				<div class="space-y-3 text-sm">
					<div>
						<div class="text-xs uppercase tracking-wide text-zinc-500" id="adminuserblockreasonlabel">封鎖原因</div>
						<textarea class="mt-1 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="adminuserblockreason" rows="3" maxlength="200" placeholder="請輸入封鎖原因"></textarea>
					</div>
					<div>
						<div class="text-xs uppercase tracking-wide text-zinc-500" id="adminuserblockdurationlabel">封鎖時長</div>
						<select class="mt-1 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-3 text-[15px] text-white outline-none transition focus:border-emerald-400" id="adminuserblockduration">
							<option data-i18n="adminuserpage.duration1hour" value="1">1 小時</option>
							<option data-i18n="adminuserpage.duration1day" value="24">1 天</option>
							<option data-i18n="adminuserpage.duration3day" value="72">3 天</option>
							<option data-i18n="adminuserpage.duration7day" value="168">7 天</option>
							<option data-i18n="adminuserpage.duration30day" value="720">30 天</option>
						</select>
					</div>
				</div>
				<div class="mt-6 flex justify-end gap-3 flex-wrap">
					<input type="button" class="rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:border-emerald-400" id="canceladminuserblock" value="取消">
					<input type="button" class="rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-4 py-2 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-entersubmit id="submitadminuserblock" value="送出">
				</div>
			</div>
		</div>

		<div id="adminuserbanmodal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
			<div class="w-full max-w-lg rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
				<div class="mb-4 flex items-center justify-between">
					<h2 class="text-lg font-bold" id="adminuserbantitle">永久停權使用者</h2>
					<input type="button" class="rounded-xl border border-zinc-700 px-3 py-1 text-sm text-zinc-300 hover:border-emerald-400" id="closeadminuserban" value="✕">
				</div>
				<div class="space-y-3 text-sm">
					<div>
						<div class="text-xs uppercase tracking-wide text-zinc-500" id="adminuserbanreasonlabel">停權原因</div>
						<textarea class="mt-1 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="adminuserbanreason" rows="3" maxlength="200" placeholder="請輸入停權原因"></textarea>
					</div>
					<div class="text-xs text-rose-200" id="adminuserbanwarning">確認永久停權？此操作會踢除該使用者所有登入。</div>
				</div>
				<div class="mt-6 flex justify-end gap-3 flex-wrap">
					<input type="button" class="rounded-xl border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:border-emerald-400" id="canceladminuserban" value="取消">
					<input type="button" class="rounded-xl border border-rose-400 bg-rose-500/15 px-4 py-2 text-sm font-bold text-rose-200 transition" id="submitadminuserban" value="永久停權">
				</div>
			</div>
		</div>

		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="admin.js"></script>
	</body>
</html>
