<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>協會管理</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="max-w-6xl mx-auto py-8 px-4">
			<h1 class="text-3xl font-bold mb-6">協會管理</h1>

			<div class="bg-zinc-800 rounded-lg p-4 mb-6 flex flex-wrap gap-4 items-center">
				<input type="text" class="bg-zinc-700 text-white rounded px-3 py-2 flex-1" id="searchname" placeholder="搜尋協會名稱">
				<input type="button" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded cursor-pointer" id="searchbutton" value="搜尋">
				<input type="button" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded cursor-pointer" id="addclubbutton" value="新增協會">
			</div>

			<div class="h-[50vh] overflow-y-auto">
				<table class="w-full text-sm bg-zinc-800 rounded-lg">
					<thead class="sticky top-0">
						<tr class="bg-zinc-700 text-zinc-300">
							<th class="py-3 px-4">#</th>
							<th class="py-3 px-4">協會名稱</th>
							<th class="py-3 px-4">協會地址</th>
							<th class="py-3 px-4">註解</th>
							<th class="py-3 px-4">操作</th>
						</tr>
					</thead>
					<tbody class="text-center" id="clubtable"></tbody>
				</table>
			</div>

			<div class="bg-zinc-800 rounded-lg p-6 my-8">
				<div class="text-lg font-semibold mb-4 text-center">協會統計</div>
				<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
					<div class="flex flex-col items-center">
						<div class="text-zinc-400">總協會數</div>
						<div class="text-2xl font-bold" id="totalclubs">0</div>
					</div>
					<div class="flex flex-col items-center">
						<div class="text-zinc-400">顯示數量</div>
						<div class="text-2xl font-bold" id="displaycount">0</div>
					</div>
				</div>
			</div>
		</div>

		<div id="clubmodal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
			<div class="bg-zinc-800 rounded-lg p-6 w-full max-w-md mx-4">
				<div class="flex justify-between items-center mb-6">
					<h2 class="text-2xl font-bold" id="modaltitle">新增協會</h2>
					<button id="closemodal" class="text-zinc-400 hover:text-white text-2xl">&times;</button>
				</div>

				<form id="clubform">
					<input type="hidden" id="clubid">

					<div class="mb-4">
						<label class="block text-sm font-medium mb-2">協會名稱 <span class="text-red-500">*</span></label>
						<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="clubname" required>
					</div>

					<div class="mb-4">
						<label class="block text-sm font-medium mb-2">協會地址 <span class="text-red-500">*</span></label>
						<input type="text" class="w-full bg-zinc-700 text-white rounded px-3 py-2" id="clubaddress" required>
					</div>

					<div class="mb-6">
						<label class="block text-sm font-medium mb-2">註解</label>
						<textarea class="w-full bg-zinc-700 text-white rounded px-3 py-2 h-24" id="clubps" rows="3"></textarea>
					</div>

					<div class="flex gap-3">
						<button type="button" class="flex-1 bg-zinc-600 hover:bg-zinc-700 px-4 py-2 rounded cursor-pointer" id="cancelbutton">
							取消
						</button>
						<button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded cursor-pointer">
							確認
						</button>
					</div>
				</form>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="clublist.js"></script>
	</body>
</html>
