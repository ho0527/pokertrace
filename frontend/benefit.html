<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>收益圖表</title>
        <link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
        <script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    </head>
    <body class="bg-zinc-900 text-white min-h-screen">
        <div id="navigationbar"></div>

        <div class="max-w-6xl mx-auto py-8 px-4">
            <h1 class="text-3xl font-bold mb-6 text-center">收益圖表</h1>
            <!-- 日期範圍選擇 -->
            <div class="bg-zinc-800 rounded-lg p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">開始日期</label>
                        <input type="date" id="startdate" class="w-full bg-zinc-700 text-white rounded px-3 py-2 border border-zinc-600 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">結束日期</label>
                        <input type="date" id="enddate" class="w-full bg-zinc-700 text-white rounded px-3 py-2 border border-zinc-600 focus:border-blue-500 outline-none">
                    </div>
                    <div class="flex items-end">
                        <button id="search" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">查詢</button>
                    </div>
                    <div class="flex items-end">
                        <button id="reset" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-2 px-4 rounded transition">重置</button>
                    </div>
                </div>
            </div>

            <div id="chart" style="width:100%;height:70vh"></div>
        </div>

        <div id="footer"></div>

        <script src="translate.js"></script>
        <script src="initialize.js"></script>
        <script src="benefit.js"></script>
    </body>
</html>
