<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>進階報表 - PokerTrace</title>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
        <script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
        <link rel="stylesheet" href="tailwind.css">
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    </head>
    <body class="min-h-screen bg-zinc-950 text-white">
        <div id="navigationbar"></div>

        <div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
            <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                <div>
                    <p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="benefiteyebrow">Advanced Report</p>
                    <h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" data-i18n="benefit.title" id="benefittitle">進階報表</h1>
                </div>
                <a href="profile.html" class="inline-flex min-h-12 items-center justify-center rounded-2xl bg-zinc-800 px-5 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" data-i18n="benefit.backtoprofile" id="backtoprofile">回個人資料</a>
            </div>

            <section class="mb-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
                <div class="mb-5">
                    <div class="text-lg font-extrabold text-white" data-i18n="benefit.filtertitle" id="benefitfiltertitle">日期篩選</div>
                    <div class="mt-2 text-sm leading-7 text-zinc-400" data-i18n="benefit.filterdesc" id="benefitfilterdesc">依區間檢視累積收益走勢與結果摘要。</div>
                </div>
                <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
                    <div>
                        <label for="startdate" class="mb-2 block text-sm font-bold text-zinc-100" data-i18n="benefit.startdate" id="startdatelabel">開始日期</label>
                        <input type="date" id="startdate" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
                    </div>
                    <div>
                        <label for="enddate" class="mb-2 block text-sm font-bold text-zinc-100" data-i18n="benefit.enddate" id="enddatelabel">結束日期</label>
                        <input type="date" id="enddate" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15">
                    </div>
                    <div class="flex items-end">
                        <input type="button" class="min-h-12 inline-flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-entersubmit data-i18n-value="benefit.search" id="search" value="查詢">
                    </div>
                    <div class="flex items-end">
                        <input type="button" class="min-h-12 inline-flex w-full items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" data-i18n-value="benefit.reset" id="reset" value="重置">
                    </div>
                </div>
            </section>

            <section class="mb-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-8">
                <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                    <div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5">
                        <div class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-zinc-500" data-i18n="benefit.summaryrangetitle" id="summaryrangetitle">查詢區間</div>
                        <div class="text-lg font-bold text-white" id="summaryrangevalue">-</div>
                    </div>
                    <div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5">
                        <div class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-zinc-500" data-i18n="benefit.summarytotaltitle" id="summarytotaltitle">累積收益</div>
                        <div class="text-lg font-bold text-green-400" id="summarytotalvalue">0</div>
                    </div>
                    <div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5">
                        <div class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-zinc-500" data-i18n="benefit.summarycounttitle" id="summarycounttitle">日期筆數</div>
                        <div class="text-lg font-bold text-white" id="summarycountvalue">0</div>
                    </div>
                </div>
                <div class="mt-5 rounded-2xl border border-zinc-800 bg-zinc-950/60 p-4 text-sm leading-7 text-zinc-300" id="benefitresultdesc">顯示指定區間的累積收益趨勢。</div>
            </section>

            <section class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-4 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-6">
                <div id="chartwrap">
                    <div id="chart" style="width:100%;height:70vh"></div>
                    <div id="chartempty" class="hidden rounded-2xl border border-dashed border-zinc-800 bg-zinc-950/60 p-8 text-center">
                        <div class="text-lg font-bold text-white" data-i18n="benefit.emptychart" id="chartemptytitle">目前沒有可生成收益趨勢的資料</div>
                        <div class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="benefit.emptychartdesc" id="chartemptydesc">調整日期區間或先回場次列表累積資料。</div>
                        <div class="mt-5">
                            <a href="sessionlist.html" class="inline-flex min-h-12 items-center justify-center rounded-2xl bg-emerald-600 px-5 text-sm font-bold text-white transition hover:bg-emerald-500" id="chartemptycta">前往場次列表</a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="mt-6 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-4 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-6">
                <div class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-emerald-400" id="clubsectioneyebrow">By Club</div>
                <h2 class="text-xl font-extrabold text-white" data-i18n="benefit.clubsectiontitle" id="clubsectiontitle">依協會分組</h2>
                <p class="mt-2 text-sm leading-7 text-zinc-400" id="clubsectiondesc">依協會彙整同一查詢區間的淨盈虧。</p>
                <div id="clubwrap" class="mt-5">
                    <div id="clubchart"></div>
                    <div id="clubtablewrap" class="mt-5 overflow-x-auto">
                        <table class="w-full min-w-[420px] border-collapse text-sm">
                            <thead>
                                <tr class="border-b border-zinc-800 text-left text-zinc-400" id="clubtablehead">
                                    <th class="ptsortth select-none py-2 pr-4 font-bold" data-sortkey="name"><span data-i18n="benefit.clubheadname" id="clubheadname">協會</span><span class="ptsortarrow text-emerald-400" data-sortkey="name"></span></th>
                                    <th class="ptsortth select-none py-2 pr-4 font-bold" data-sortkey="count"><span data-i18n="benefit.clubheadcount" id="clubheadcount">場次數</span><span class="ptsortarrow text-emerald-400" data-sortkey="count"></span></th>
                                    <th class="ptsortth select-none py-2 font-bold" data-sortkey="profit"><span data-i18n="benefit.clubheadprofit" id="clubheadprofit">淨盈虧</span><span class="ptsortarrow text-emerald-400" data-sortkey="profit"></span></th>
                                </tr>
                            </thead>
                            <tbody id="clubtablebody"></tbody>
                        </table>
                    </div>
                    <div id="clubempty" class="hidden rounded-2xl border border-dashed border-zinc-800 bg-zinc-950/60 p-8 text-center">
                        <div class="text-lg font-bold text-white" data-i18n="benefit.clubempty" id="clubemptytitle">這個區間沒有可分組的資料</div>
                        <div class="mt-3 text-sm leading-7 text-zinc-400" data-i18n="benefit.clubemptydesc" id="clubemptydesc">調整日期區間，或確認場次已設定所屬協會。</div>
                    </div>
                </div>
            </section>
        </div>

        <div id="footer"></div>

        <script src="translate.js"></script>
        <script src="initialize.js"></script>
        <script src="benefit.js"></script>
    </body>
</html>
