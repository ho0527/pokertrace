<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>主儀表板</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen lg:overflow-hidden">
		<div id="navigationbar"></div>

		<div class="max-w-6xl mx-auto py-8 px-4">
			<h1 class="text-3xl font-bold mb-6">主儀表板</h1>

			<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
				<div class="bg-zinc-800 rounded-lg p-6 shadow flex flex-col items-center">
					<div class="text-lg font-semibold mb-2">今日盈虧</div>
					<div class="text-2xl font-bold text-green-400" id="todaytotalprofit">+$0</div>
				</div>
				<div class="bg-zinc-800 rounded-lg p-6 shadow flex flex-col items-center">
					<div class="text-lg font-semibold mb-2">本週盈虧</div>
					<div class="text-2xl font-bold text-green-400" id="weektotalprofit">+$0</div>
				</div>
				<div class="bg-zinc-800 rounded-lg p-6 shadow flex flex-col items-center">
					<div class="text-lg font-semibold mb-2">本月盈虧</div>
					<div class="text-2xl font-bold text-green-400" id="monthtotalprofit">+$0</div>
				</div>
			</div>

			<div class="bg-zinc-800 rounded-lg p-6 shadow mb-8">
				<div class="text-lg font-semibold mb-4">個人前週盈虧趨勢圖</div>
				<div id="trendChart" style="height: 300px;"></div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="main.js"></script>
	</body>
</html>
