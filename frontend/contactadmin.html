<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>聯絡訊息後台 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Contact Admin</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="contactadminheading">聯絡訊息後台</h1>
				</div>
				<div class="flex flex-wrap gap-2">
					<select id="contactstatusfilter" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" aria-label="篩選訊息狀態">
						<option data-i18n="contactadminpage.allstatus" value="">全部狀態</option>
						<option data-i18n="contactadminpage.new" value="new">新訊息</option>
						<option data-i18n="contactadminpage.read" value="read">已讀</option>
						<option data-i18n="contactadminpage.done" value="done">已處理</option>
					</select>
					<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" id="reloadcontactmessages" value="重新整理">
				</div>
			</div>
			<div id="contactmessageadminlist" class="space-y-4"></div>
			<div id="contactmessagepagination" class="mt-6 flex flex-wrap gap-2"></div>
		</div>

		<div id="footer"></div>
		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="contactadmin.js"></script>
	</body>
</html>
