<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>登入 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<script src="https://accounts.google.com/gsi/client" async defer></script>
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto flex min-h-[calc(100vh-160px)] w-full max-w-md flex-col items-center justify-center px-4 py-10">
			<div class="w-full rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-8 text-center shadow-[0_24px_60px_rgba(0,0,0,0.35)] md:p-10">
				<p class="mb-3 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Sign in</p>
				<h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl" id="signinheading">歡迎回來</h1>
				<p class="mt-3 text-sm leading-6 text-zinc-400" id="signinsubheading">使用 Google 登入 PokerTrace，繼續你的場次與工作流程。</p>

				<div class="mx-auto mt-8 w-full max-w-xs">
					<input type="button" id="googlesigninbtn" class="flex w-full items-center justify-center gap-3 rounded-full border border-white/60 bg-white/10 px-6 py-3 font-medium text-white shadow-lg backdrop-blur-sm transition-all hover:border-white hover:bg-white/20 disabled:cursor-not-allowed disabled:opacity-50" data-entersubmit value="使用 Google 登入">

					<div id="googlefallback" class="mt-4 hidden">
						<div class="mb-2 text-xs text-zinc-400" id="googlefallbackhint">若沒有跳出視窗，請改用下方按鈕登入。</div>
						<div id="gsibutton" class="flex justify-center"></div>
					</div>
				</div>

				<div id="signinerrorbox" class="mt-6 hidden rounded-2xl border border-red-500/30 bg-red-500/10 p-4 text-left">
					<div class="text-sm leading-7 text-red-100" id="signinerror"></div>
					<div class="mt-2 text-xs text-red-200" id="signinreturnhint"></div>
				</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="signin.js"></script>
	</body>
</html>
