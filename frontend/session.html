<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>場次詳情 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="carddisplay.css">
		<link rel="stylesheet" href="print.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	</head>
	<body class="min-h-screen bg-zinc-950 text-white" data-backfallback="sessionlist.html">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-3 md:py-4">
			<div class="flex w-full flex-wrap items-center justify-between gap-3">
				<a href="sessionlist.html" class="w-full md:w-fit inline-flex min-h-12 items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700 cursor-pointer" data-i18n="common.back" id="autoback">回上一頁</a>
				<input type="button" class="w-full md:w-fit inline-flex min-h-12 items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700 cursor-pointer" data-i18n-value="sessionpage.printsession" id="printsession" value="列印場次">
			</div>
		</div>

		<div class="mx-auto w-full max-w-6xl px-4 pb-8 min-h-[70vh]" id="sessionmain">
			<div class="mb-6 flex flex-col gap-3 rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8 sm:flex-row sm:items-center sm:justify-between">
				<div class="min-w-0 flex-1 w-full">
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400">Session</p>
					<div class="text-3xl font-extrabold tracking-tight text-white md:text-4xl text-center md:text-left" id="sessionname" data-textmarquee></div>
				</div>
				<div class="w-full md:w-fit rounded-2xl border border-zinc-700 bg-zinc-950/70 px-4 py-3 text-sm text-zinc-400" id="date"></div>
			</div>

			<!-- <div class="mb-6 grid grid-cols-1 gap-4 lg:grid-cols-[1.2fr_0.8fr]">
				<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-br from-emerald-950/70 via-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="rolesummary"></div>
				<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="sessionfocus"></div>
			</div> -->

			<!-- Tabs -->
			<div class="mb-6 border-b border-zinc-800 flex justify-around md:justify-start">
				<input type="button" class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="overview" data-data-i18n-value="series.overview" id="0" value="總覽">
				<input type="button" class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="table" data-data-i18n-value="sessionpage.tabtable" id="1" value="牌桌">
				<input type="button" class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="hands" data-data-i18n-value="sessionpage.tabhand" id="2" value="手牌">
				<input type="button" class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="payout" data-data-i18n-value="sessionpage.tplplace" id="6" value="名次">
				<input type="button" class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="other" data-data-i18n-value="sessionpage.tabother" id="7" value="其他">
			</div>
			<!-- Tab Contents -->
			<div id="tab-overview" class="tab-content">
				<div class="mb-4 border-b border-zinc-800 flex justify-around md:justify-start">
					<input type="button" class="overviewtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tplgeneral" data-overviewtab="general" value="一般">
					<input type="button" class="overviewtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tabinfo" data-overviewtab="info" value="資訊">
					<input type="button" class="overviewtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tplnote" data-overviewtab="note" value="備註">
				</div>
				<div id="overviewtab-general" class="overviewtab-content">
					<!-- <div class="grid grid-cols-1 gap-4 lg:grid-cols-[1.15fr_0.85fr] mb-4">
						<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="sessionnextsteps"></div>
						<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" id="sessionquicklinks"></div>
					</div> -->
					<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8 mb-4">
						<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm" id="info"></div>
					</div>
					<div id="actionarea" class="hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8 mb-4">
						<div class="mb-4">
							<div class="text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="actiontitle">下一步</div>
							<div class="mt-2 text-sm leading-7 text-zinc-400" id="actionhint"></div>
						</div>
						<div class="flex flex-wrap gap-3 items-center" id="actionbuttons"></div>
					</div>
				</div>
				<div id="overviewtab-info" class="overviewtab-content hidden">
					<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8">
						<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm" id="sessiondetailinfo"></div>
					</div>
				</div>
				<div id="overviewtab-note" class="overviewtab-content hidden">
					<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8">
						<div class="text-lg font-semibold mb-2" data-i18n="sessionpage.tplnote">備註</div>
						<div id="description" class="whitespace-pre-wrap text-zinc-200">-</div>
					</div>
				</div>
			</div>
			<div id="tab-table" class="tab-content hidden">
				<div class="mb-4 border-b border-zinc-800 flex justify-around md:justify-start">
					<input type="button" class="tabletab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tabtable" data-tabletab="list" value="牌桌">
					<input type="button" class="tabletab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tplseat" data-tabletab="seats" value="座位">
				</div>
				<div id="tabletab-list" class="tabletab-content">
					<div class="bg-zinc-800 rounded-lg p-4 mb-6 flex flex-wrap gap-4 items-center">
						<input type="text" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" data-i18n-aria-label="sessionpage.venuesearchlabel" data-i18n-placeholder="sessionpage.tplvenue" placeholder="地點" aria-label="牌桌地點搜尋">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-zinc-700 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-600" data-i18n-value="sessionpage.tplsearch" data-entersubmit value="搜尋">
						<a href="newtable.html" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-i18n="sessionpage.tpladdtable" id="newtable">新增牌桌</a>
						<a href="#" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-zinc-700 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-600" data-i18n="sessionpage.tableboardentry" id="tableboardentry">多牌桌總覽</a>
						<input type="button" class="hidden min-h-12 inline-flex items-center justify-center rounded-2xl bg-red-600 hover:bg-red-500 px-6 text-sm font-bold text-white cursor-pointer transition" data-i18n-value="sessionpage.tpldeletealltable" id="deletetable" value="刪除所有牌桌">
					</div>
					<!-- 場次列表 -->
					<div class="md:h-[50vh] md:overscroll-contain overflow-x-auto rounded-2xl border border-zinc-800">
						<table class="w-full text-sm">
							<thead class="sticky top-0 text-left text-xs font-bold uppercase tracking-wider text-zinc-400" id="sessiontablehead">
								<tr class="border-b border-zinc-800 bg-zinc-900">
									<th class="ptsortth select-none px-4 py-3" data-sortkey="no"><span id="sessiontablenamehead">名稱</span><span class="ptsortarrow text-emerald-400" data-sortkey="no"></span></th>
									<th class="px-4 py-3" data-i18n="sessionpage.colaction">操作</th>
								</tr>
							</thead>
							<tbody class="text-center" id="tablemain"></tbody>
						</table>
					</div>
				</div>
				<div id="tabletab-seats" class="tabletab-content hidden">
					<div id="sessionplayerscontent" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8"></div>
				</div>
			</div>
			<div id="tab-hands" class="tab-content hidden">
				<div class="mb-4 border-b border-zinc-800 flex justify-around md:justify-start">
					<a href="#hands" class="handtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n="series.overview" data-handtab="overview">總覽</a>
					<a href="#chart" class="handtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n="sessionpage.tabchart" data-handtab="ev">圖表</a>
					<a href="#stats" class="handtab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n="sessionpage.tabstats" data-handtab="stats">統計</a>
					<a href="" target="_blank" rel="noopener" id="sessionbroadcast" class="hidden md:ml-auto inline-flex items-center gap-2 px-4 py-2 text-sm font-bold text-emerald-300 hover:text-emerald-200"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>現場轉播</a>
					<a href="" target="_blank" rel="noopener" id="sessionbroadcastcontrol" class="hidden inline-flex items-center gap-2 px-4 py-2 text-sm font-bold text-amber-300 hover:text-amber-200"><span class="rounded bg-amber-500/20 px-1.5 text-xs">H4H</span>轉播控制</a>
				</div>
				<div id="handtab-overview" class="handtab-content">
					<div class="flex justify-between items-center mb-4">
						<div class="text-lg font-semibold" data-i18n="sessionpage.handrecordtitle">手牌紀錄</div>
						<div class="flex gap-2">
							<button type="button" id="sessionhandsort" class="inline-flex items-center gap-1 rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700">時間 ↓</button>
							<input type="button" id="printsessionhands" class="cursor-pointer inline-flex items-center rounded-2xl bg-zinc-800 px-4 py-2 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700" data-i18n-value="sessionpage.printhand" value="列印手牌">
						</div>
					</div>
					<div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-3">
						<input type="text" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15 col-span-2 md:col-span-1 min-w-0" data-i18n-placeholder="sessionpage.handsearchplaceholder" data-i18n-aria-label="sessionpage.handsearchlabel" id="sessionhandsearch" placeholder="搜尋 table / 選手 / Seat" aria-label="搜尋牌桌、選手或座位">
						<input type="date" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15 min-w-0 appearance-none" data-i18n-aria-label="sessionpage.handfromlabel" id="sessionhandfrom" aria-label="手牌起始日期">
						<input type="date" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15 min-w-0 appearance-none" data-i18n-aria-label="sessionpage.handtolabel" id="sessionhandto" aria-label="手牌結束日期">
						<input type="number" class="min-h-12 w-full rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15 min-w-0" data-i18n-aria-label="sessionpage.handseatlabel" id="sessionhandseat" inputmode="numeric" placeholder="Seat" aria-label="座位篩選">
						<input type="button" class="min-h-12 inline-flex items-center justify-center rounded-2xl bg-zinc-800 px-6 text-sm font-bold text-zinc-100 transition hover:bg-zinc-700 min-w-0" data-i18n-value="sessionpage.tplclear" id="sessionhandclear" value="清除">
					</div>
					<!-- 桌面：表格 -->
					<div class="hidden md:block overflow-x-auto rounded-2xl border border-zinc-800">
						<table class="w-full text-sm">
							<thead class="text-left text-xs font-bold uppercase tracking-wider text-zinc-400" id="sessionhandhead">
								<tr class="border-b border-zinc-800 bg-zinc-900">
									<th class="px-4 py-3">#</th>
									<th class="ptsortth select-none px-4 py-3" data-sortkey="tablename"><span data-i18n="sessionpage.handcolposition">位置</span><span class="ptsortarrow text-emerald-400" data-sortkey="tablename"></span></th>
									<th class="px-4 py-3" data-i18n="sessionpage.colstarthand">起手牌</th>
									<th class="px-4 py-3" data-i18n="sessionpage.handcolaction">行動</th>
									<th class="ptsortth select-none px-4 py-3" data-sortkey="result"><span data-i18n="sessionpage.handcolresult">結果</span><span class="ptsortarrow text-emerald-400" data-sortkey="result"></span></th>
									<th class="px-4 py-3" data-i18n="sessionpage.colimportance">重要性</th>
								</tr>
							</thead>
							<tbody id="sessionhandtable"></tbody>
						</table>
					</div>
					<!-- 手機：卡片列表 -->
					<div class="md:hidden flex flex-col gap-3" id="sessionhandcards"></div>
					<div class="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm" id="sessionhandpager"></div>
				</div>
				<div id="handtab-ev" class="handtab-content hidden">
					<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8">
						<div class="flex flex-wrap items-center justify-between gap-3 mb-1">
							<div class="text-lg font-semibold" data-i18n="sessionpage.chartstacktitle">累積計分牌量圖表</div>
							<div id="sessionevplayer" class="hidden"></div>
						</div>
						<div class="text-sm text-zinc-400 mb-4" data-i18n="sessionpage.chartstacknote">統計本場次所有牌桌，左側為最舊手牌、右側為最新手牌，數值為每手結束後的累積計分牌量。</div>
						<div id="sessionevsummary" class="grid grid-cols-3 gap-3 mb-4"></div>
						<div id="evChart" class="sessionevchart"></div>
					</div>
				</div>
				<div id="handtab-stats" class="handtab-content hidden">
					<div class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8">
						<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
							<div class="text-lg font-semibold" data-i18n="sessionpage.statstitle">統計數據</div>
							<div id="sessionstatsplayer" class="hidden"></div>
						</div>
						<div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2" data-i18n="sessionpage.tplchip">計分牌</div>
						<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm mb-6" id="sessionstatschipcards"></div>
						<div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2" data-i18n="sessionpage.chartprofit">損益</div>
						<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm" id="sessionstatscards"></div>
					</div>
				</div>
			</div>
			<div id="tab-payout" class="tab-content hidden">
				<div id="sessionpayoutcontent" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8"></div>
			</div>
			<div id="tab-other" class="tab-content hidden">
				<div class="mb-4 border-b border-zinc-800 flex justify-around md:justify-start">
					<input type="button" class="othertab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tabsettings" data-othertab="settings" value="設定">
					<input type="button" class="othertab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tablink" data-othertab="relations" value="關聯">
					<input type="button" class="othertab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-i18n-value="sessionpage.tabinfo" data-othertab="orderinfo" value="資訊">
				</div>
				<div id="othertab-settings" class="othertab-content">
					<div class="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-4">
						<div class="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-3 flex md:block gap-2 overflow-x-auto">
							<input type="button" class="settings-side-btn w-full text-center px-3 py-2 rounded bg-emerald-600 text-white mb-2" data-entersubmit data-i18n-value="sessionpage.tplgeneral" data-setting="general" value="一般">
							<input type="button" class="settings-side-btn w-full text-center px-3 py-2 rounded text-zinc-300 hover:bg-zinc-700 mb-2" data-i18n-value="sessionpage.tplgamesetting" data-setting="game" value="牌局設定">
							<input type="button" class="settings-side-btn w-full text-center px-3 py-2 rounded text-zinc-300 hover:bg-zinc-700 mb-2" data-i18n-value="sessionresult.title" data-setting="result" value="我的成績">
							<input type="button" class="settings-side-btn w-full text-center px-3 py-2 rounded text-zinc-300 hover:bg-zinc-700 mb-2" data-i18n-value="sessionpage.tabdisplay" data-setting="display" value="大螢幕">
							<input type="button" class="settings-side-btn w-full text-center px-3 py-2 rounded text-red-300 hover:bg-zinc-700" data-i18n-value="sessionpage.tpldeletesession" data-setting="delete" value="刪除賽事">
						</div>
						<div id="settingscontent" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8"></div>
					</div>
				</div>
				<div id="othertab-relations" class="othertab-content hidden">
					<div id="relationscontent" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8"></div>
					<div id="seriesattach" class="mt-4 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8"></div>
				</div>
				<div id="othertab-orderinfo" class="othertab-content hidden">
					<div id="orderinfocontent" class="rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-6 shadow-[0_24px_60px_rgba(0,0,0,0.28)] md:p-8" data-i18n="sessionpage.orderinfoprefix">
						場次id: #<span id="sessiontoken"></span>
						querykey: <span id="sessionid"></span>
					</div>
				</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="print.js"></script>
		<script src="session.js"></script>
		<script src="sessionseries.js"></script>
	</body>
</html>
