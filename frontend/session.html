<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>場次詳情 - Session Detail</title>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	</head>
	<body class="bg-zinc-900 text-white min-h-screen">
		<div id="navigationbar"></div>

		<div class="flex justify-between items-center max-w-6xl mx-auto py-4 px-2 sm:px-4 my-2">
			<input type="button" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded text-sm font-bold cursor-pointer" id="back" value="上一頁">
		</div>

		<div class="max-w-6xl mx-auto py-4 px-2 sm:px-4 min-h-[70vh]">
			<h1 class="text-2xl font-bold mb-4">場次詳情 #<span id="sessiontoken"></span></h1>
			<!-- Tabs -->
			<div class="mb-6 border-b border-zinc-700 flex flex-wrap">
				<button class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="overview" data-id="0">總覽</button>
				<button class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="table" data-id="1">牌桌</button>
				<button class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="hands" data-id="2">手牌</button>
				<button class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="ev" data-id="3">EV圖</button>
				<button class="tab-btn px-4 py-2 text-zinc-300 border-b-2 border-transparent hover:text-emerald-400" data-tab="stats" data-id="4">各手牌統計</button>
			</div>
			<!-- Tab Contents -->
			<div id="tab-overview" class="tab-content">
				<div class="bg-zinc-800 rounded-lg p-6 mb-4">
					<div class="text-lg font-semibold mb-2">
						場次資訊
						<span class="text-zinc-500 my-2 font-normal text-sm" id="date"></span>
					</div>
					<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm" id="info"></div>
				</div>
				<div class="bg-zinc-800 rounded-lg p-6">
					<div class="text-lg font-semibold mb-2">備註</div>
					<div id="description">今晚狀態佳，策略執行順利。</div>
				</div>
			</div>
			<div id="tab-table" class="tab-content hidden">
				<div class="bg-zinc-800 rounded-lg p-4 mb-6 flex flex-wrap gap-4 items-center">
					<input type="text" class="bg-zinc-700 text-white rounded px-3 py-2" placeholder="地點">
					<select class="bg-zinc-700 text-white rounded px-3 py-2">
						<option value="">全部遊戲類型</option>
						<option>現金局</option>
						<option>錦標賽</option>
						<option>限時錦標賽</option>
					</select>
					<button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">搜尋</button>
					<a href="newtable.html" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded" id="newtable">新增牌桌</a>
					<input type="button" class="hidden bg-red-600 hover:bg-red-700 px-4 py-2 rounded cursor-pointer" id="deletetable" value="刪除所有牌桌">
				</div>
				<!-- 場次列表 -->
				<div class="h-[50vh] overflow-auto">
					<table class="w-full text-sm bg-zinc-800 rounded-lg">
						<thead class="sticky top-0">
							<tr class="bg-zinc-700 text-zinc-300">
								<th class="py-2 px-2">#</th>
								<th class="py-2 px-2">時間</th>
								<th class="py-2 px-2">名稱</th>
								<th class="py-2 px-2">小盲/大盲</th>
								<th class="py-2 px-2">大盲前注</th>
								<th class="py-2 px-2">前注</th>
								<th class="py-2 px-2">起始籌碼</th>
								<th class="py-2 px-2">操作</th>
							</tr>
						</thead>
						<tbody class="text-center" id="tablemain"></tbody>
					</table>
				</div>
			</div>
			<div id="tab-hands" class="tab-content hidden">
				<div class="flex justify-between items-center mb-4">
					<div class="text-lg font-semibold">手牌紀錄</div>
				</div>
				<div class="overflow-x-auto">
					<table class="w-full text-sm bg-zinc-800 rounded-lg overflow-hidden">
						<thead>
							<tr class="bg-zinc-700 text-zinc-300">
								<th class="py-2 px-2">#</th>
								<th class="py-2 px-2">位置</th>
								<th class="py-2 px-2">起手牌</th>
								<th class="py-2 px-2">行動</th>
								<th class="py-2 px-2">結果</th>
								<th class="py-2 px-2">重要性</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td class="py-2 px-2">1</td>
								<td>CO</td>
								<td>Ah Kh</td>
								<td>加注-跟注-下注-棄牌</td>
								<td class="text-green-400">+350</td>
								<td>★</td>
							</tr>
							<tr>
								<td class="py-2 px-2">2</td>
								<td>BB</td>
								<td>7d 7c</td>
								<td>跟注-過牌-下注-全下</td>
								<td class="text-red-400">-200</td>
								<td></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div id="tab-stats" class="tab-content hidden">
				<div class="bg-zinc-800 rounded-lg p-6">
					<div class="text-lg font-semibold mb-4">統計數據</div>
					<ul class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
						<li>總手牌數：12</li>
						<li>勝率：41.7%</li>
						<li>平均盈虧：+120</li>
						<li>最大單手盈虧：+600</li>
					</ul>
				</div>
			</div>
			<div id="tab-ev" class="tab-content hidden">
				<div class="bg-zinc-800 rounded-lg p-6">
					<div class="text-lg font-semibold mb-4">EV圖</div>
					<div id="evChart" style="height: 300px;"></div>
				</div>
			</div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="session.js"></script>
	</body>
</html>
