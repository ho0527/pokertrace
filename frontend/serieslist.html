<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>系列賽 - PokerTrace</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link rel="stylesheet" href="tailwind.css">
	</head>
	<body class="min-h-screen bg-zinc-950 text-white">
		<div id="navigationbar"></div>

		<div class="mx-auto w-full max-w-6xl px-4 py-6 md:py-8">
			<div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
				<div>
					<p class="mb-2 text-[13px] font-bold uppercase tracking-[0.16em] text-emerald-400" id="eyebrow">Series</p>
					<h1 class="text-4xl font-extrabold tracking-tight text-white md:text-5xl" id="pagetitle">系列賽管理</h1>
				</div>
				<input type="button" class="cursor-pointer hidden md:inline-flex min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-6 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-entersubmit id="togglecreate" value="新增系列賽">
			</div>

			<div class="mb-4 md:hidden">
				<input type="button" class="cursor-pointer inline-flex w-full min-h-12 items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-4 text-sm font-bold text-white transition hover:from-emerald-400 hover:to-emerald-500" data-entersubmit id="togglecreatemobile" value="新增系列賽">
			</div>

			<!-- 新增系列賽面板 -->
			<section class="mb-6 hidden rounded-[28px] border border-zinc-800 bg-gradient-to-b from-zinc-900/95 to-zinc-950/95 p-5 shadow-[0_24px_60px_rgba(0,0,0,0.22)] md:p-6" id="createpanel">
				<form id="createform" class="flex flex-col gap-4">
					<div class="grid grid-cols-1 gap-3 md:grid-cols-2">
						<label class="flex flex-col gap-1">
							<span class="text-sm text-zinc-400" data-label="name">系列賽名稱</span>
							<input type="text" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="f-name" maxlength="100">
						</label>
						<label class="flex flex-col gap-1">
							<span class="text-sm text-zinc-400" data-label="scoringtype">排名依據</span>
							<select class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-4 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="f-scoringtype">
								<option value="profit" data-opt="scoring_profit">盈虧</option>
								<option value="place" data-opt="scoring_place">名次</option>
								<option value="points" data-opt="scoring_points">積分</option>
							</select>
						</label>
						<label class="flex flex-col gap-1">
							<span class="text-sm text-zinc-400" data-label="starttime">開始日期</span>
							<input type="date" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="f-starttime">
						</label>
						<label class="flex flex-col gap-1">
							<span class="text-sm text-zinc-400" data-label="endtime">結束日期</span>
							<input type="date" class="min-h-12 rounded-2xl border border-zinc-700 bg-zinc-800 px-3 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="f-endtime">
						</label>
					</div>
					<label class="flex flex-col gap-1">
						<span class="text-sm text-zinc-400" data-label="description">說明</span>
						<textarea class="min-h-[64px] rounded-2xl border border-zinc-700 bg-zinc-800 px-4 py-2 text-[15px] text-white outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/15" id="f-description"></textarea>
					</label>
					<label class="flex items-center gap-2">
						<input type="checkbox" class="h-5 w-5 accent-emerald-500" id="f-private">
						<span class="text-sm text-zinc-300" data-label="private">私人系列賽</span>
					</label>
					<div class="flex justify-end">
						<input type="submit" class="cursor-pointer rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-6 py-2 text-sm font-bold text-white transition" data-entersubmit id="createsubmit" value="建立">
					</div>
				</form>
			</section>

			<!-- 系列賽列表 -->
			<div id="main"></div>
		</div>

		<div id="footer"></div>

		<script src="translate.js"></script>
		<script src="initialize.js"></script>
		<script src="serieslist.js"></script>
	</body>
</html>
