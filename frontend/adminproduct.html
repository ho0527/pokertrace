<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>購物平台 - Shopping Mall</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	</head>
	<body class="bg-gray-50 min-h-screen">
		<!-- Header -->
		<nav class="bg-white shadow sticky top-0 z-50">
			<div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">
				<div class="flex items-center space-x-4">
					<i class="fas fa-store text-2xl text-blue-600"></i>
					<span class="text-xl font-bold text-gray-800">管理商品</span>
				</div>
				<div class="flex items-center space-x-4" id="headerlink">
					<a href="newproduct.html" class="text-gray-700 hover:text-blue-600">新增商品</a>
					<a href="main.html" class="text-gray-700 hover:text-blue-600">個人資料</a>
				</div>
			</div>
		</nav>

		<!-- Search & Category -->
		<div class="bg-white py-4 shadow">
			<div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between px-4 space-y-2 md:space-y-0">
				<div class="flex flex-nowrap space-x-2 overflow-x-auto max-w-full md:max-w-[400px]" id="tagdiv">
					<input type="button" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full whitespace-nowrap" value="全部">
				</div>
				<div class="w-full md:w-1/3">
					<input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" id="keyword" placeholder="搜尋商品...">
				</div>
			</div>
		</div>

		<!-- Product List -->
		<div class="max-w-6xl mx-auto px-4 py-8">
			<div class="flex justify-center my-5">
				<div class="inline-flex rounded-md shadow-sm" id="pagination">
					<a href="#" class="px-3 py-2 rounded-l-md border border-gray-300 bg-white text-gray-500 hover:bg-gray-100" aria-label="Previous">
						<i class="fas fa-chevron-left"></i>
					</a>
					<a href="#" class="px-3 py-2 border-t border-b border-gray-300 bg-white text-blue-600 font-bold hover:bg-blue-50">1</a>
					<a href="#" class="px-3 py-2 rounded-r-md border border-gray-300 bg-white text-gray-500 hover:bg-gray-100" aria-label="Next">
						<i class="fas fa-chevron-right"></i>
					</a>
				</div>
			</div>

			<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 min-h-[60vh] my-3" id="main"></div>
		</div>

		<!-- Footer -->
		<footer class="bg-white border-t py-6">
			<div class="max-w-6xl mx-auto px-4 text-center text-gray-500 text-sm">
				&copy; 2025 購物平台. All rights reserved.
			</div>
		</footer>

		<script src="initialize.js"></script>
		<script src="adminproduct.js"></script>
	</body>
</html>
